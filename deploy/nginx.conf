# OpenWorkBuddy — nginx 反向代理模板
#
# 用法：
#   1) 复制到 /etc/nginx/sites-available/openworkbuddy.conf
#   2) 把 buddy.example.com 换成你的域名，证书路径换成你自己的
#      （没有证书就先 `certbot --nginx -d buddy.example.com`，它会把 ssl_* 那几行替你填好）
#   3) ln -s ../sites-available/openworkbuddy.conf /etc/nginx/sites-enabled/
#   4) nginx -t && systemctl reload nginx
#   5) **别忘了** .env 里 OPENWORKBUDDY_TRUST_PROXY=1 —— 不填的话限流会把全公司锁死，
#      原因见 deploy/env.example 里那段。
#
# 用 caddy 的话不需要这个文件，deploy/Caddyfile 已经把同样的事做好了。

# 到后端保持长连接。不写这个 upstream 的话，nginx 每个请求都新开一条 TCP 到
# 127.0.0.1:3800 —— 本机上不致命，但白白多一次握手，而这个界面一屏要拉十几个文件。
upstream openworkbuddy {
    server 127.0.0.1:3800;
    keepalive 32;
    keepalive_timeout 75s;
}

# 80 端口只干一件事：把人送去 443。
# certbot 的续期校验走 .well-known，那条要放行，否则续证书会失败——
# 而证书过期这件事总是发生在三个月后你早就忘了这台机器的时候。
server {
    listen 80;
    listen [::]:80;
    server_name buddy.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # ---------- 1. HTTP/2：一条连接跑完所有请求 ----------
    # 首屏要拉 9 个 js + 1 个 html。HTTP/1.1 下浏览器最多并发 6 条，
    # 剩下的排队等；开了 h2 就是一条连接多路复用，不用为每个文件各握一次手。
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # nginx ≥ 1.25.1 的写法；老版本用 `listen 443 ssl http2;`
    server_name buddy.example.com;

    ssl_certificate     /etc/letsencrypt/live/buddy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buddy.example.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;   # TLS1.3 时代让客户端挑，它比服务器更清楚自己硬件支持什么

    # ---------- 2. TLS 会话复用：第二次连上来别重新算一遍密钥 ----------
    # 省 0.3~1.3 秒。手机上从 4G 切 WiFi、锁屏再解锁，都会重连，
    # 没有这几行的话每次都要完整握一次手，体感就是「点开要等一下」。
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets on;

    # 传附件用。跟 Caddyfile 里的 max_size 64MB 对齐——两边不一致的话，
    # 换个反代传同一个文件，一个成一个 413，最难查的那种不一致。
    client_max_body_size 64m;

    # ---------- 3. gzip 可以开，但**别让它压到 SSE** ----------
    # 「nginx 这层开 gzip 会毁掉流式输出」这个说法只对了一半，而且差的那一半很要命。
    # 实测（nginx 1.30.0，上游每 250ms 吐一行，量每行到达客户端的时刻，单位 ms）：
    #
    #   gzip off                        + proxy_buffering off  →  276/523/774/1025/1276/1527  逐行到
    #   gzip on（types 不含 SSE 类型）    + proxy_buffering off  →  256/523/758/1009/1260/1515  逐行到
    #   gzip on（types 不含 SSE 类型）    + proxy_buffering on   →  272/522/773/1023/1274/1526  逐行到
    #   gzip on（types **含** SSE 类型）  + proxy_buffering off  →  273/510/761/1012/1263/1515  逐行到
    #   gzip on（types **含** SSE 类型）  + proxy_buffering on   →  1511 ×6   ★六行全卡到最后一起出★
    #
    # 要出事得**同时**满足两条：gzip 真的压到了 text/event-stream，并且开着缓冲。
    # 少任何一条都还能逐行流。而 nginx 自带的 gzip_types 默认只有 text/html，
    # 所以「随手一行 gzip on」其实压不到 SSE——真正的雷是从网上抄一长串 MIME 清单
    # （不少模板里就带着 text/event-stream），或者图省事写 gzip_types *;。
    #
    # 这儿两条都掐死：下面的清单里没有 text/event-stream，location 里又写死 proxy_buffering off。
    #
    # 那为什么不干脆 gzip off？因为应用自己压的只有两样：磁盘上的静态文件
    # （static-compress.js）和 res.json 出去的动态 JSON（json-compress.js）。
    # 漏网的那些正好都不小，只有 nginx 这层够得着：
    #   /metrics 的纯文本、审计日志导出、以及工作区里 res.download / res.sendFile
    #   直接发的成果文件（.md / .csv / .txt / .svg 那些）。
    # 而且不会重复劳动 —— 上游自己带着 Content-Encoding 上来时 nginx 直接放行
    # （实测：656 字节进、656 字节出，客户端解一次 gzip 就还原）。
    # 老版本（没有这两层中间件的）挂上来也能直接受益，不用先升级。
    gzip             on;
    gzip_vary        on;
    gzip_proxied     any;
    gzip_min_length  1024;
    gzip_comp_level  5;
    # text/html 是 nginx 永远会压的，写不写都一样、也去不掉；下面这些是额外要压的。
    # ⚠️ 这一行里永远不要出现 text/event-stream —— 上面那张表最后一行就是代价。
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    location / {
        proxy_pass http://openworkbuddy;

        # 上面那个 upstream 的 keepalive 只有配上这两行才真的生效：
        # HTTP/1.0 不支持长连接，而 nginx 默认会往上游发 `Connection: close`。
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ⚠️ 千万别在这儿写 `proxy_set_header Accept-Encoding "";`
        # 网上的模板很爱加这一行（为了让 nginx 自己压），但这个应用是自己压的：
        # 把这个头抹掉，它就只能发未压缩的原文，首屏从 388KB 变回 1134KB。

        # ---------- 4. 流式回答不能被缓冲 ----------
        # 对话和终端镜像都是 SSE。这是挂反代之后最常见的那个「怎么不打字了」的真凶。
        # 上面那张表里只有「压到 SSE + 开缓冲」那一行是坏的；这一行关掉缓冲，等于给
        # gzip_types 那份清单上第二道保险——哪天有人往里手滑加了 SSE 类型，流还是逐行出。
        proxy_buffering off;
        proxy_cache off;

        # 一个任务跑一小时很正常（Goal 模式能跑很多轮）。默认 60s 会在中途把流掐断，
        # 界面上看就是「跑着跑着断了」，而服务端其实还在跑。
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
