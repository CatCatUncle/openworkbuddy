<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业管理后台 · OpenWorkBuddy</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/css/ui.css">
<script>
  /* 主题/皮肤/字号跟工作台走同一份本机偏好（app-02.js 写的那三个 key）。
     放在 <head> 里同步执行是为了不闪白：等 admin.js 加载完再套，用户会先看到一帧浅色。 */
  (function () {
    try {
      var d = document.documentElement.dataset;
      var t = localStorage.getItem("owb-theme") || "system";
      d.theme = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      var skin = localStorage.getItem("owb-look-skin"); if (skin && skin !== "default") d.skin = skin;
      var fs = localStorage.getItem("owb-look-fs"); if (fs && fs !== "m") d.fs = fs;
      var font = localStorage.getItem("owb-look-font"); if (font && font !== "system") d.font = font;
    } catch (e) { /* 隐私模式下存储不可用，用默认外观即可 */ }
  })();
</script>
<style>
  :root {
    --owb-fs: 15px;
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
    --owb-ease: cubic-bezier(.2, .6, .3, 1);
    /* 这一页把圆角整体调大一档（卡片 16 / 控件 12 / 小控件 8）。
       后台是一屏十几个方块的地方，10px 的圆角在这个密度下看着像没做圆角。 */
    --radius: 14px;
  }
  html[data-fs="s"] { --owb-fs: 14px; }
  html[data-fs="l"] { --owb-fs: 16px; }
  html[data-fs="xl"] { --owb-fs: 18px; }
  html[data-font="serif"] { --font-sans: Georgia, "Songti SC", "Noto Serif CJK SC", SimSun, serif; }
  html[data-font="mono"] { --font-sans: var(--font-mono); }
  /* 皮肤：跟 index.html 同一套，只换品牌色那一组令牌 */
  html[data-skin="ocean"] { --primary:#0284c7; --ring:#0284c7; --ring-weak:#e0f2fe; --brand-text:#0369a1; }
  html[data-theme="dark"][data-skin="ocean"] { --ring:#38bdf8; --ring-weak:#0c2a3d; --brand-text:#7dd3fc; }
  html[data-skin="forest"] { --primary:#059669; --ring:#059669; --ring-weak:#d1fae5; --brand-text:#047857; }
  html[data-theme="dark"][data-skin="forest"] { --ring:#34d399; --ring-weak:#0b2e24; --brand-text:#6ee7b7; }
  html[data-skin="sunset"] { --primary:#ea580c; --ring:#ea580c; --ring-weak:#ffedd5; --brand-text:#c2410c; }
  html[data-theme="dark"][data-skin="sunset"] { --ring:#fb923c; --ring-weak:#3a2410; --brand-text:#fdba74; }
  html[data-skin="rose"] { --primary:#e11d48; --ring:#e11d48; --ring-weak:#ffe4e6; --brand-text:#be123c; }
  html[data-theme="dark"][data-skin="rose"] { --ring:#fb7185; --ring-weak:#3d1520; --brand-text:#fda4af; }
  html[data-skin="graphite"] { --primary:#4b5563; --ring:#4b5563; --ring-weak:#e5e7eb; --brand-text:#1f2937; }
  html[data-theme="dark"][data-skin="graphite"] { --primary:#6b7280; --ring:#9ca3af; --ring-weak:#2b2d34; --brand-text:#d1d5db; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-sans); font-size: var(--owb-fs); line-height: 1.65;
    background: var(--background); color: var(--foreground);
    -webkit-font-smoothing: antialiased; text-size-adjust: 100%;
  }
  /* 中文在 15px 上默认字距偏挤，加一点点；别加多，加多了英文和数字会散 */
  body { letter-spacing: .008em; }
  a { color: var(--brand-text); text-decoration: none; }
  a:hover { text-decoration: none; }

  /* ---------- 骨架：左导航（白） + 右内容（灰底衬托卡片） ---------- */
  .ad { display: grid; grid-template-columns: 248px 1fr; height: 100%; }
  .ad-side {
    display: flex; flex-direction: column; min-height: 0;
    background: var(--card); border-right: 1px solid var(--border);
  }
  .ad-brand {
    display: flex; align-items: center; gap: 8px; padding: 18px 16px 12px;
    font-weight: 600; font-size: 15px; flex: none; white-space: nowrap;
  }
  .ad-brand img { border-radius: 8px; flex: none; }
  .ad-brand .ui-badge { flex: none; }
  /* 索引行右边那句「去哪儿配」：是链接就得长得像链接，还得看得出会新开一页 */
  .ad-go {
    display: inline-flex; align-items: center; gap: 4px; font-size: 13.5px;
    color: var(--brand-text); white-space: nowrap;
  }
  .ad-go .i { width: 13px; height: 13px; opacity: .7; }
  .ad-go:hover { text-decoration: underline; text-underline-offset: 3px; }
  .ad-side-q { flex: none; position: relative; padding: 2px 10px 6px; }
  .ad-side-q .i {
    position: absolute; left: 20px; top: 50%; transform: translateY(-50%) translateY(-2px);
    width: 14px; height: 14px; color: var(--subtle-foreground); pointer-events: none;
  }
  .ad-side-q input {
    width: 100%; height: 32px; padding: 0 10px 0 30px; font: inherit; font-size: 13px;
    color: var(--foreground); background: var(--muted); border: 1px solid transparent;
    border-radius: var(--radius-md); outline: none; appearance: none;
  }
  .ad-side-q input::placeholder { color: var(--subtle-foreground); }
  .ad-side-q input::-webkit-search-cancel-button { appearance: none; }
  .ad-side-q input:focus { background: var(--card); border-color: var(--border); box-shadow: 0 0 0 3px var(--ring-weak); }
  .ad-nav { flex: 1; overflow-y: auto; padding: 2px 10px 16px; }
  .ad-nav-none { padding: 18px 12px; font-size: 13px; line-height: 1.7; color: var(--muted-foreground); }
  .ad-grp {
    padding: 12px 10px 4px; font-size: 12px; font-weight: 500;
    color: var(--subtle-foreground); letter-spacing: .04em;
  }
  .ad-nav-i {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    height: 34px; padding: 0 10px; margin-bottom: 1px; border: 0; border-radius: var(--radius-md);
    background: transparent; color: var(--muted-foreground); font: inherit; font-size: 14px;
    text-decoration: none; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    transition: background-color .15s var(--owb-ease), color .15s var(--owb-ease);
  }
  .ad-nav-i .i { width: 16px; height: 16px; flex: none; opacity: .85; }
  .ad-nav-i:hover { background: var(--accent); color: var(--accent-foreground); }
  .ad-nav-i.on { background: var(--ring-weak); color: var(--brand-text); font-weight: 500; }
  .ad-nav-i.on .i { opacity: 1; }
  .ad-nav-i:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring-weak); }
  .ad-side-foot { flex: none; padding: 10px; border-top: 1px solid var(--border); }

  .ad-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--muted); }
  .ad-top {
    flex: none; display: flex; align-items: center; gap: 16px;
    padding: 18px 28px; background: var(--card); border-bottom: 1px solid var(--border);
  }
  .ad-top h1 { font-size: 20px; font-weight: 600; line-height: 1.35; letter-spacing: -.01em; }
  .ad-top p { margin-top: 2px; font-size: 13.5px; color: var(--muted-foreground); line-height: 1.5; }
  .ad-top-r { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
  .ad-body { flex: 1; overflow-y: auto; padding: 24px 28px 48px; }
  .ad-wrap { max-width: 960px; display: flex; flex-direction: column; gap: 16px; }
  /* 表格页放宽到 1320：设置页 960 是为了一行字别太长（读的东西），
     但账本页是拿来扫的，九列挤在 960 里每列都在换行，右边却空着四百多像素。 */
  .ad-wrap--wide { max-width: 1320px; }

  /* ---------- 流水筛选条 ---------- */
  .ad-filter {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 12px 20px; border-top: 1px solid var(--border); background: var(--muted);
  }
  .ad-filter-r { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ad-chips { display: flex; gap: 4px; flex-wrap: wrap; }
  .ad-chip {
    padding: 5px 11px; font-size: 13px; line-height: 1.4; border-radius: 999px; cursor: pointer;
    border: 1px solid transparent; background: transparent; color: var(--muted-foreground);
    transition: background .15s var(--owb-ease), color .15s var(--owb-ease);
  }
  .ad-chip:hover { background: var(--card); color: var(--foreground); }
  /* 选中态用实心而不是描边：一排六个胶囊里，描边那一个远看跟没选一样 */
  .ad-chip.is-on { background: var(--primary); color: #fff; border-color: var(--primary); }
  .ad-chip.is-on:hover { background: var(--primary); color: #fff; }
  .ad-date { width: 140px; height: 32px; font-size: 13px; padding: 0 8px; }
  .ad-dash { color: var(--subtle-foreground); font-size: 13px; }
  .ad-pick { width: auto; min-width: 118px; height: 32px; font-size: 13px; }
  .ad-search { width: 190px; height: 32px; font-size: 13px; }
  /* 窄屏：筛选条整条竖过来，两半各占满一行，别把日期框挤成 40px */
  @media (max-width: 720px) {
    .ad-filter { flex-direction: column; align-items: stretch; }
    .ad-filter-r > * { flex: 1 1 auto; }
    .ad-search { width: auto; }
  }

  /* ---------- 总览的「要你处理的」 ---------- */
  .ad-todo { display: flex; flex-direction: column; gap: 8px; }
  .ad-todo-i {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    border: 1px solid var(--border); border-radius: 12px; font-size: 14px; line-height: 1.6;
  }
  .ad-todo-i > span { flex: 1; min-width: 0; }
  .ad-todo-i > .i { flex: none; width: 17px; height: 17px; }
  /* 待办只有两档：要动手的（warn）和知道一声的（info）。
     再分细一档，人第一眼就分不出哪条该先点。 */
  .ad-todo-i--warn {
    border-color: color-mix(in srgb, var(--warning) 36%, var(--border));
    background: color-mix(in srgb, var(--warning) 7%, transparent);
  }
  .ad-todo-i--warn > .i { color: var(--warning); }
  .ad-todo-i--info > .i { color: var(--muted-foreground); }
  .ad-todo-ok {
    display: flex; align-items: center; gap: 10px; padding: 14px;
    border-radius: 12px; background: var(--muted); font-size: 14px;
  }
  .ad-todo-ok .i { width: 18px; height: 18px; color: var(--success-text); flex: none; }
  .ad-todo-ok .fd { display: block; margin-top: 2px; }
  /* 并排两张卡。窄了自己叠成一列——后台常常开在半屏上 */
  .ad-two { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 16px; align-items: start; }
  .ad-sub { font-size: 13px; color: var(--muted-foreground); }

  /* ---------- 翻页条 ---------- */
  .ad-pager {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 12px 20px; border-top: 1px solid var(--border);
  }
  .ad-pager-n { font-size: 13px; color: var(--muted-foreground); font-variant-numeric: tabular-nums; }
  /* 合计那排卡片夹在筛选条和表格之间，上下都得留白，不然三样东西糊成一坨 */
  .ad-filter + .ui-stats { padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .ui-stats + .ui-table-wrap { border-top: 0; }

  /* ---------- 卡片 ---------- */
  /* 卡片头和卡片身分开：表格能一直画到卡片边上，不再是一截停在内边距上的悬空横线 */
  .ad-card { overflow: hidden; }
  .ad-card-h { padding: 18px 20px 14px; }
  .ad-card-h + .ui-table-wrap, .ad-card-h + .ad-empty { border-top: 1px solid var(--border); }
  .ad-card-b { padding: 4px 20px 18px; }
  .ad-card-h + .ad-card-b { padding-top: 0; }
  .ad-hrow { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .ad-hrow > :last-child { flex: none; }

  .ad-sec-t { font-size: 16px; font-weight: 600; letter-spacing: -.01em; line-height: 1.4; }
  .ad-sec-d { margin-top: 4px; font-size: 13.5px; color: var(--muted-foreground); line-height: 1.7; max-width: 74ch; }
  /* 「第二行小字」：表格里的用户名、字段下的说明、行末的相对时间都用它。
     以前只在 .ad-field 里定义，独立用的地方全部退回 15px 正文，跟主文案一样大。 */
  .fd { font-size: 13px; color: var(--muted-foreground); line-height: 1.55; }

  /* ---------- 只读信息表（不是设置项，别做成左标签右控件那种大跨度） ---------- */
  .ad-dl { display: grid; grid-template-columns: 132px minmax(0, 1fr); }
  .ad-dl > dt {
    padding: 12px 16px 12px 0; font-size: 14px; color: var(--muted-foreground);
    border-bottom: 1px solid var(--border);
  }
  .ad-dl > dd { padding: 12px 0; font-size: 14px; border-bottom: 1px solid var(--border); min-width: 0; }
  .ad-dl > dt:last-of-type, .ad-dl > dd:last-of-type { border-bottom: 0; }
  .ad-dl .v { font-weight: 500; }

  .ad-num { font-variant-numeric: tabular-nums; }
  .ad-empty {
    padding: 44px 16px; text-align: center; color: var(--subtle-foreground); font-size: 14px;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  .ad-empty .i { width: 22px; height: 22px; opacity: .6; }

  /* 7 日柱状：纯 div，不引图表库（这页要能离线打开） */
  .ad-bars { display: flex; align-items: flex-end; gap: 0; height: 150px; padding-top: 4px; }
  .ad-bars .b { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; padding: 0 4px; }
  .ad-bars .b .t { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; border-bottom: 1px solid var(--border); }
  .ad-bars .b i {
    width: 100%; max-width: 52px; min-height: 3px; background: var(--primary); opacity: .82;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0; transition: opacity .15s var(--owb-ease);
  }
  .ad-bars .b:hover i { opacity: 1; }
  .ad-bars .b b {
    font-size: 12px; font-weight: 500; color: var(--muted-foreground); line-height: 1.4;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .ad-bars .b.z b { min-height: 17px; }
  .ad-bars .b .t em { font-style: normal; font-size: 13px; line-height: 1; color: var(--subtle-foreground); padding-bottom: 2px; }
  .ad-bars .b u { text-decoration: none; font-size: 12px; color: var(--subtle-foreground); font-variant-numeric: tabular-nums; }

  /* ---------- 设置项（左说明 / 右控件） ---------- */
  .ad-field { display: flex; align-items: center; gap: 24px; padding: 14px 0; border-bottom: 1px solid var(--border); }
  .ad-field:last-child { border-bottom: 0; }
  .ad-field--top { align-items: flex-start; }
  .ad-field > div:first-child { flex: 1; min-width: 0; }
  .ad-field .fl { font-size: 14px; font-weight: 500; line-height: 1.5; }
  .ad-field .fd { margin-top: 3px; max-width: 62ch; line-height: 1.65; }
  .ad-field .fc { flex: none; display: flex; align-items: center; gap: 8px; }
  .ad-field .fc .ui-input { width: 180px; }
  textarea.ui-input::placeholder { color: color-mix(in srgb, var(--subtle-foreground) 55%, transparent); }
  textarea.ui-input { height: auto; min-height: 84px; padding: 8px 12px; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; resize: vertical; }

  .ad-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  /* 弹层里的一组勾选（一把 Key 能走哪几路能力）。每格都是个可点的框，
     而不是字旁边一个 13px 的小方块——手机上那个小方块点不中 */
  .ad-checks { display: flex; flex-wrap: wrap; gap: 8px; }
  .ad-checks label {
    display: inline-flex; align-items: center; gap: 6px; margin: 0; cursor: pointer;
    padding: 6px 11px; border: 1px solid var(--border); border-radius: 999px;
    font-size: 13px; font-weight: 400; user-select: none;
  }
  .ad-checks label:has(input:checked) { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 8%, transparent); }
  .ad-checks input { margin: 0; accent-color: var(--primary); }
  .ad-mono { font-family: var(--font-mono); font-size: 13px; }
  .ad-actions { display: flex; gap: 4px; justify-content: flex-end; }

  /* ---------- 弹层：加成员、改成员、建组织都用它 ---------- */
  .ui-dialog h2 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; padding: 20px 22px 0; }
  .ui-dialog .bd { padding: 14px 22px; display: flex; flex-direction: column; gap: 14px; }
  .ui-dialog .ft { display: flex; justify-content: flex-end; gap: 8px; padding: 6px 22px 20px; }
  .ui-dialog label { display: block; font-size: 13px; font-weight: 500; color: var(--foreground); margin-bottom: 6px; }

  .ad-toast {
    position: fixed; left: 50%; bottom: 32px; transform: translate(-50%, 8px);
    padding: 10px 18px; border-radius: 999px; font-size: 14px; z-index: 80;
    background: var(--foreground); color: var(--background); box-shadow: 0 8px 28px rgba(0,0,0,.22);
    opacity: 0; transition: opacity .16s var(--owb-ease), transform .16s var(--owb-ease); pointer-events: none;
  }
  .ad-toast.show { opacity: 1; transform: translate(-50%, 0); }
  .ad-toast.bad { background: var(--destructive); color: #fff; }

  .ad-gate {
    max-width: 460px; margin: 12vh auto; text-align: center;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
  }
  .ad-gate .i { width: 40px; height: 40px; color: var(--subtle-foreground); }

  @media (max-width: 900px) {
    .ad { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .ad-side { flex-direction: row; align-items: center; border-right: 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .ad-brand { padding: 10px 14px; }
    .ad-nav { display: flex; gap: 4px; padding: 8px; overflow-x: auto; }
    .ad-grp { display: none; }
    .ad-nav-i { width: auto; margin-bottom: 0; }
    .ad-side-foot { border-top: 0; }
    .ad-top { padding: 14px 16px; }
    .ad-body { padding: 16px 16px 40px; }
    .ad-dl { grid-template-columns: 1fr; }
    .ad-dl > dt { padding: 12px 0 0; border-bottom: 0; }
    .ad-dl > dd { padding: 2px 0 12px; }
    .ad-field { flex-direction: column; align-items: stretch; gap: 10px; }
    .ad-field .fc { justify-content: flex-start; }
  }
</style>
</head>
<body>
<!-- lucide 图标（ISC，https://lucide.dev），内联进来是为了离线可用、跟着 currentColor 变色 -->

<symbol id="i-zap" viewBox="0 0 24 24"><path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z" /></symbol>
<symbol id="i-blocks" viewBox="0 0 24 24"><path d="M10 22V7a1 1 0 0 0-1-1H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5a1 1 0 0 0-1-1H2" /> <rect x="14" y="2" width="8" height="8" rx="1" /></symbol>
