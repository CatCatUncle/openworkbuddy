<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>企业管理后台 · OpenWorkBuddy</title>
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/css/ui.css">
<script>
  /* 主题/皮肤/字号跟工作台走同一份本机偏好（app-02.js 写的那三个 key）。
     放在 <head> 里同步执行是为了不闪白：等 admin.js 加载完再套，用户会先看到一帧浅色。 */
  (function () {
    try {
      var d = document.documentElement.dataset;
      var t = localStorage.getItem("wb-theme") || "system";
      d.theme = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      var skin = localStorage.getItem("wb-look-skin"); if (skin && skin !== "default") d.skin = skin;
      var fs = localStorage.getItem("wb-look-fs"); if (fs && fs !== "m") d.fs = fs;
      var font = localStorage.getItem("wb-look-font"); if (font && font !== "system") d.font = font;
    } catch (e) { /* 隐私模式下存储不可用，用默认外观即可 */ }
  })();
</script>
<style>
  :root {
    --wb-fs: 15px;
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  html[data-fs="s"] { --wb-fs: 14px; }
  html[data-fs="l"] { --wb-fs: 16px; }
  html[data-fs="xl"] { --wb-fs: 18px; }
  html[data-font="serif"] { --font-sans: Georgia, "Songti SC", "Noto Serif CJK SC", SimSun, serif; }
  html[data-font="mono"] { --font-sans: var(--font-mono); }
  /* 皮肤：跟 index.html 同一套，只换品牌色那一组令牌 */
  html[data-skin="ocean"] { --primary:#0284c7; --ring:#0284c7; --ring-weak:#e0f2fe; --brand-text:#0369a1; }
  html[data-theme="dark"][data-skin="ocean"] { --ring:#38bdf8; --ring-weak:#0c2a3d; --brand-text:#7dd3fc; }
  html[data-skin="forest"] { --primary:#059669; --ring:#059669; --ring-weak:#d1fae5; --brand-text:#047857; }
  html[data-theme="dark"][data-skin="forest"] { --ring:#34d399; --ring-weak:#0b2e24; --brand-text:#6ee7b7; }
  html[data-skin="sunset"] { --primary:#ea580c; --ring:#ea580c; --ring-weak:#ffedd5; --brand-text:#c2410c; }
  html[data-theme="dark"][data-skin="sunset"] { --ring:#fb923c; --ring-weak:#3a2410; --brand-text:#fdba74; }
  html[data-skin="rose"] { --primary:#e11d48; --ring:#e11d48; --ring-weak:#ffe4e6; --brand-text:#be123c; }
  html[data-theme="dark"][data-skin="rose"] { --ring:#fb7185; --ring-weak:#3d1520; --brand-text:#fda4af; }
  html[data-skin="graphite"] { --primary:#4b5563; --ring:#4b5563; --ring-weak:#e5e7eb; --brand-text:#1f2937; }
  html[data-theme="dark"][data-skin="graphite"] { --primary:#6b7280; --ring:#9ca3af; --ring-weak:#2b2d34; --brand-text:#d1d5db; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-sans); font-size: var(--wb-fs); line-height: 1.6;
    background: var(--background); color: var(--foreground);
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--brand-text); }
  /* ---------- 骨架：左导航 + 右内容 ---------- */
  .ad { display: grid; grid-template-columns: 240px 1fr; height: 100%; }
  .ad-side {
    display: flex; flex-direction: column; min-height: 0;
    background: var(--muted); border-right: 1px solid var(--border);
  }
  .ad-brand {
    display: flex; align-items: center; gap: 8px; padding: 16px 16px 12px;
    font-weight: 600; font-size: 15px; flex: none;
  }
  .ad-brand svg { width: 24px; height: 24px; border-radius: 6px; }
  .ad-nav { flex: 1; overflow-y: auto; padding: 4px 8px 16px; }
  .ad-grp { padding: 12px 8px 4px; font-size: 12px; color: var(--subtle-foreground); font-weight: 500; }
  .ad-nav-i {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    height: 34px; padding: 0 8px; margin-bottom: 2px; border: 0; border-radius: var(--radius-md);
    background: transparent; color: var(--muted-foreground); font: inherit; font-size: 14px;
    cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ad-nav-i .i { width: 16px; height: 16px; flex: none; }
  .ad-nav-i:hover { background: var(--accent); color: var(--accent-foreground); }
  .ad-nav-i.on { background: var(--ring-weak); color: var(--brand-text); font-weight: 500; }
  .ad-nav-i:focus-visible { outline: none; box-shadow: 0 0 0 3px var(--ring-weak); }
  .ad-side-foot { flex: none; padding: 8px; border-top: 1px solid var(--border); }

  .ad-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .ad-top {
    flex: none; display: flex; align-items: center; gap: 16px;
    padding: 16px 24px; border-bottom: 1px solid var(--border);
  }
  .ad-top h1 { font-size: 18px; font-weight: 600; line-height: 1.4; }
  .ad-top p { font-size: 13px; color: var(--muted-foreground); }
  .ad-top-r { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: none; }
  .ad-body { flex: 1; overflow-y: auto; padding: 24px; }
  .ad-wrap { max-width: 1040px; display: flex; flex-direction: column; gap: 16px; }

  /* ---------- 通用块 ---------- */
  .ad-sec-t { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .ad-sec-d { font-size: 13px; color: var(--muted-foreground); }
  .ad-note {
    display: flex; gap: 8px; padding: 12px 16px; border-radius: var(--radius-lg);
    background: var(--ring-weak); color: var(--brand-text); font-size: 13px; line-height: 1.6;
  }
  .ad-note .i { width: 16px; height: 16px; margin-top: 3px; flex: none; }
  .ad-note--warn { background: color-mix(in srgb, var(--warning) 12%, transparent); color: var(--warning); }
  .ad-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr)); gap: 12px; }
  .ad-kpi .k { padding: 16px; border: 1px solid var(--border); border-radius: var(--radius-xl); background: var(--card); }
  .ad-kpi .k b { display: block; font-size: 24px; font-weight: 600; line-height: 1.3; letter-spacing: -.01em; }
  .ad-kpi .k span { font-size: 13px; color: var(--muted-foreground); }
  .ad-kpi .k em { font-style: normal; font-size: 12px; color: var(--subtle-foreground); }

  table.ad-t { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.ad-t th {
    text-align: left; font-weight: 500; font-size: 12px; color: var(--subtle-foreground);
    padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap;
  }
  table.ad-t td { padding: 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table.ad-t tr:last-child td { border-bottom: 0; }
  table.ad-t tbody tr:hover { background: var(--muted); }
  .ad-num { font-variant-numeric: tabular-nums; }
  .ad-scroll { overflow-x: auto; }
  .ad-empty { padding: 32px 16px; text-align: center; color: var(--subtle-foreground); font-size: 14px; }

  /* 7 日柱状：纯 div，不引图表库（这页要能离线打开） */
  .ad-bars { display: flex; align-items: flex-end; gap: 8px; height: 128px; padding-top: 8px; }
  .ad-bars .b { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; height: 100%; }
  .ad-bars .b i { width: 100%; max-width: 48px; background: var(--primary); border-radius: var(--radius-sm); min-height: 2px; opacity: .85; }
  .ad-bars .b u { text-decoration: none; font-size: 12px; color: var(--subtle-foreground); }

  .ad-field { display: flex; align-items: flex-start; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .ad-field:last-child { border-bottom: 0; }
  .ad-field > div:first-child { flex: 1; min-width: 0; }
  .ad-field .fl { font-size: 14px; font-weight: 500; }
  .ad-field .fd { font-size: 13px; color: var(--muted-foreground); margin-top: 2px; }
  .ad-field .fc { flex: none; display: flex; align-items: center; gap: 8px; }
  .ad-field .fc .ui-input { width: 180px; }
  select.ui-input { padding-right: 8px; }
  textarea.ui-input { height: auto; min-height: 76px; padding: 8px 12px; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; resize: vertical; }

  /* 开关：原生 checkbox 在两套主题下颜色不可控，自己画一个 */
  .ad-sw { position: relative; width: 40px; height: 24px; flex: none; }
  .ad-sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .ad-sw i { position: absolute; inset: 0; border-radius: 999px; background: var(--input); transition: background-color .18s ease; pointer-events: none; }
  .ad-sw i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .18s ease; }
  .ad-sw input:checked + i { background: var(--primary); }
  .ad-sw input:checked + i::after { transform: translateX(16px); }
  .ad-sw input:focus-visible + i { box-shadow: 0 0 0 3px var(--ring-weak); }
  .ad-sw input:disabled { cursor: not-allowed; }
  .ad-sw input:disabled + i { opacity: .5; }

  .ad-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ad-mono { font-family: var(--font-mono); font-size: 13px; }
  .ad-actions { display: flex; gap: 6px; justify-content: flex-end; }

  /* 弹层：加成员、改成员、建组织都用它 */
  .ad-mask { position: fixed; inset: 0; background: rgba(0,0,0,.42); display: flex; align-items: center; justify-content: center; padding: 24px; z-index: 60; }
  .ad-modal { width: 100%; max-width: 460px; max-height: 100%; overflow-y: auto; background: var(--popover); color: var(--popover-foreground); border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: 0 16px 48px rgba(0,0,0,.24); }
  .ad-modal h2 { font-size: 16px; font-weight: 600; padding: 16px 20px 0; }
  .ad-modal .bd { padding: 12px 20px; display: flex; flex-direction: column; gap: 12px; }
  .ad-modal .ft { display: flex; justify-content: flex-end; gap: 8px; padding: 8px 20px 20px; }
  .ad-modal label { display: block; font-size: 13px; color: var(--muted-foreground); margin-bottom: 4px; }

  .ad-toast {
    position: fixed; left: 50%; bottom: 32px; transform: translate(-50%, 8px);
    padding: 8px 16px; border-radius: var(--radius-md); font-size: 14px; z-index: 80;
    background: var(--foreground); color: var(--background); box-shadow: 0 8px 24px rgba(0,0,0,.2);
    opacity: 0; transition: opacity .16s ease, transform .16s ease; pointer-events: none;
  }
  .ad-toast.show { opacity: 1; transform: translate(-50%, 0); }
  .ad-toast.bad { background: var(--destructive); color: #fff; }

  .ad-gate { max-width: 460px; margin: 12vh auto; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .ad-gate .i { width: 40px; height: 40px; color: var(--subtle-foreground); }

  @media (max-width: 860px) {
    .ad { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .ad-side { flex-direction: row; align-items: center; border-right: 0; border-bottom: 1px solid var(--border); overflow-x: auto; }
    .ad-brand { padding: 8px 12px; }
    .ad-nav { display: flex; gap: 4px; padding: 8px; overflow-x: auto; }
    .ad-grp { display: none; }
    .ad-nav-i { width: auto; margin-bottom: 0; }
    .ad-side-foot { border-top: 0; }
    .ad-body { padding: 16px; }
  }
</style>
</head>

<div class="ad">
  <aside class="ad-side">
    <div class="ad-brand">
      <img src="/icon.png" alt="" width="24" height="24" style="border-radius:6px">
      <span>OpenWorkBuddy</span>
      <span class="ui-badge ui-badge--secondary" style="font-size:11px">企业版</span>
    </div>
    <nav class="ad-nav" id="ad-nav" aria-label="管理后台导航"></nav>
    <div class="ad-side-foot">
      <a class="ui-btn ui-btn--ghost ui-btn--sm ui-btn--block" href="/">
        <svg class="i" aria-hidden="true"><use href="#i-arrow-left"></use></svg> 返回工作台
      </a>
    </div>
  </aside>
  <main class="ad-main">
    <header class="ad-top">
      <div style="min-width:0">
        <h1 id="ad-title">企业管理后台</h1>

      </div>
      <div class="ad-top-r" id="ad-top-r"></div>
    </header>
    <div class="ad-body" id="ad-body">
      <div class="ad-gate"><div class="ui-skeleton" style="width:100%;height:180px"></div></div>
    </div>
  </main>
</div>

<div class="ad-toast" id="ad-toast" role="status" aria-live="polite"></div>
