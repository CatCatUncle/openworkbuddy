<!doctype html>
<meta charset="utf-8">
<title>OpenWorkBuddy 桌面宠物</title>
<style>
  /* 透明无边框窗口：整页背景必须透明，否则桌面上会出现一块白方块 */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    -webkit-user-select: none; user-select: none; cursor: grab; }
  body.dragging { cursor: grabbing; }
  :root { --brand: #5b5ff7; --ink: #2b2b3c; }

  /* 内容是按 168×196 这个基准尺寸画的；「大小」滑块改的是窗口，画面得跟着一起缩放，
     否则调大只是把猫塞进一个更大的透明框里（看着纹丝不动），调小则直接把猫裁掉半边。
     用 transform 而不是 zoom：命中判定和 getBoundingClientRect 都会跟着 transform 走，
     点击穿透那套逻辑一行都不用改。原点钉在 bottom center——猫是站在窗口底边中间的。 */
  #pet { position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: flex-end; padding-bottom: 4px; box-sizing: border-box;
    width: 168px; height: 196px; left: 50%; margin-left: -84px; top: auto;
    transform: scale(var(--s, 1)); transform-origin: bottom center;
    opacity: var(--op, 1); transition: opacity .2s ease-out; }
  /* 半透明是为了"平时不碍眼"。但要问你问题、或者你正把光标压在它身上时，
     再半透明就成了看不清——这两种时候一律回到不透明。 */
  #pet.s-asking, body.hot #pet { opacity: 1; }

  /* ---------- 气泡：平时藏着，悬停冒出；要提问时常驻（就是要你看见） ---------- */
  #bubble { position: relative; max-width: 150px; margin-bottom: 6px; padding: 6px 9px; border-radius: 10px;
    background: rgba(255,255,255,.97); color: var(--ink);
    font: 12px/1.45 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    box-shadow: 0 4px 14px rgba(40,40,80,.18); border: 1px solid rgba(91,95,247,.16);
    opacity: 0; transform: translateY(4px); transition: opacity .18s, transform .18s;
    word-break: break-word; text-align: center; }
  #bubble::after { content: ""; position: absolute; left: 50%; margin-left: -5px; bottom: -6px;
    width: 10px; height: 10px; background: #fff; border-right: 1px solid rgba(91,95,247,.16);
    border-bottom: 1px solid rgba(91,95,247,.16); transform: rotate(45deg); }
  #bubble.on { opacity: 1; transform: translateY(0); }
  .s-asking #bubble { border-color: var(--brand); box-shadow: 0 4px 18px rgba(91,95,247,.4); }

  /* ---------- 舞台：猫和照片二选一，特效层两者共用 ---------- */
  #stage { position: relative; width: 108px; height: 112px; }
  /* 投影不是装饰：宠物要浮在别人的白窗口上，没有这道影它会糊成一团看不出轮廓 */
  .actor { position: absolute; left: 0; top: 0; width: 108px; height: 100px;
    filter: drop-shadow(0 2px 4px rgba(40,40,80,.22)) drop-shadow(0 0 1px rgba(70,70,120,.35)); }
  .c-cat #photo, .c-cat #sprite, .c-photo #cat, .c-photo #sprite, .c-sprite #cat, .c-sprite #photo { display: none; }
  /* 形象 C：Codex / Petdex 的精灵图。用 canvas 不用 background-image，是因为点击穿透要按
     像素的 alpha 判定——canvas 能直接读到那个 alpha，背景图读不到，只能整块方框挡住底下的应用。
     单帧 192×208，显示成 96×104（正好 2:1 整数倍，像素画缩下来不糊）。 */
  #sprite { left: 6px; top: 4px; width: 96px; height: 104px; image-rendering: pixelated; }
  /* 精灵图自带 6~8 帧的动作，别再叠一层呼吸/摇摆，两套动画打架会抖 */
  .c-sprite .actor { animation: none; }
  /* 同理：状态特效（转圈/问号/星星/💤/水滴）是给静态形象补语义的，精灵图自己有对应动作行 */
  .c-sprite #fx, .c-sprite #drop { display: none; }
  .s-sleep #sprite { filter: grayscale(.55) brightness(.94); }

  /* 地面投影：跳起来时缩小变淡，这一下才让它有重量感 */
  #shadow { position: absolute; left: 50%; bottom: 2px; width: 54px; height: 9px; margin-left: -27px;
    background: radial-gradient(ellipse at center, rgba(40,40,80,.22), rgba(40,40,80,0) 70%); pointer-events: none; }

  /* ---------- 待机：呼吸 + 轻微左右摇（静态图靠这两下"活"起来） ---------- */
  /* 周期取互质小数（呼吸 3.2345 / 摆尾 5.5345 / 眨眼另走 JS 随机），几十分钟不重样。
     比值接近整数是"假活"最大的破绽——几条动画每隔几秒就在同一帧对齐，人眼立刻看出是循环。 */
  .actor { animation: breathe 3.2345s ease-in-out infinite; transform-origin: 54px 96px; }
  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1) rotate(0deg) }
    30%      { transform: translateY(-1.5px) scale(1.02, .99) rotate(-1.6deg) }
    70%      { transform: translateY(-1.5px) scale(.99, 1.02) rotate(1.6deg) }
  }
  #tail { transform-origin: 86px 88px; animation: sway 5.5345s ease-in-out infinite; }
  @keyframes sway { 0%,100% { transform: rotate(-6deg) } 50% { transform: rotate(14deg) } }
  /* 眨眼交给 JS 随机触发：闭 0.10s → 睁 0.15s，睁比闭慢一半，这个不对称才像活的 */
  .eye { transform-origin: center; transform: scaleY(1); transition: transform .15s ease-out; }
  .blinking .eye { transform: scaleY(.08); transition-duration: .10s; }
  /* 表情换眼：完成是笑眼，睡着是闭眼，其余用会眨的圆眼 */
  #eyes-happy, #eyes-shut { display: none; }
  .s-done .eye, .s-sleep .eye { display: none; }
  .s-done #eyes-happy, .s-sleep #eyes-shut { display: block; }

  /* ---------- 干活：点头 + 敲键盘 + 头顶转圈 ---------- */
  .s-working .actor { animation: bob .62s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3.5px) } }
  .s-working #paw-l { animation: tapA .34s ease-in-out infinite; transform-origin: 40px 92px; }
  .s-working #paw-r { animation: tapB .34s ease-in-out infinite; transform-origin: 68px 92px; }
  @keyframes tapA { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-3.5px) } }
  @keyframes tapB { 0%,100% { transform: translateY(-3.5px) } 50% { transform: translateY(0) } }
  #laptop { opacity: 0; transition: opacity .2s; }
  .s-working #laptop { opacity: 1; }
  /* 照片形象没法敲键盘，改成头像外圈转一道进度环 */
  .c-photo.s-working #ring { opacity: 1; animation: spin 1.1s linear infinite; }

  /* ---------- 有问题要问：跳 + 问号 + 光晕，最显眼的一档 ---------- */
  .s-asking .actor { animation: hop .8s cubic-bezier(.3,.7,.4,1) infinite; }
  @keyframes hop { 0%,55%,100% { transform: translateY(0) } 25% { transform: translateY(-12px) } 40% { transform: translateY(-2px) } }
  .s-asking #shadow { animation: shrink .8s cubic-bezier(.3,.7,.4,1) infinite; }
  @keyframes shrink { 0%,55%,100% { transform: scale(1); opacity: 1 } 25% { transform: scale(.68); opacity: .5 } }

  /* ---------- 共用特效层 ---------- */
  #fx { position: absolute; left: 0; top: -6px; width: 108px; height: 30px;
    display: flex; align-items: center; justify-content: center; pointer-events: none; }
  #fx > * { position: absolute; opacity: 0; transition: opacity .2s;
    font: 700 22px/1 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #spin { width: 15px; height: 15px; border: 3px solid rgba(91,95,247,.22);
    border-top-color: var(--brand); border-radius: 50%; }
  .s-working #spin { opacity: 1; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg) } }
  #qmark { color: var(--brand); font-size: 26px; }
  .s-asking #qmark { opacity: 1; animation: qpop .8s ease-in-out infinite; }
  @keyframes qpop { 0%,100% { transform: scale(1) rotate(-7deg) } 50% { transform: scale(1.25) rotate(7deg) } }
  #sparks, #zzz { width: 26px; height: 26px; fill: none; stroke: var(--brand); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .s-done #sparks { opacity: 1; animation: pop 1.2s ease-out infinite; }
  @keyframes pop { 0% { transform: scale(.6); opacity: 0 } 30% { opacity: 1 } 100% { transform: scale(1.3) translateY(-9px); opacity: 0 } }
  .s-sleep #zzz { opacity: 1; animation: floaty 2.6s ease-in-out infinite; }
  @keyframes floaty { 0% { transform: translate(6px, 4px) scale(.85); opacity: .2 } 40% { opacity: 1 } 100% { transform: translate(14px, -12px) scale(1.15); opacity: 0 } }
  #drop { position: absolute; right: 20px; top: 34px; width: 8px; height: 8px; border-radius: 50%;
    background: #7fc4f5; opacity: 0; pointer-events: none; }
  .s-error #drop { opacity: 1; animation: fall 1.6s ease-in infinite; }
  @keyframes fall { 0% { transform: translateY(0); opacity: .9 } 100% { transform: translateY(11px); opacity: 0 } }
  #halo { position: absolute; left: 50%; top: 50%; width: 84px; height: 84px; margin: -46px 0 0 -42px;
    border: 3px solid var(--brand); border-radius: 50%; opacity: 0; pointer-events: none; }
  .s-asking #halo { animation: halo 1.4s ease-out infinite; }
  @keyframes halo { 0% { transform: scale(.7); opacity: .55 } 100% { transform: scale(1.4); opacity: 0 } }

  /* ---------- 照片形象 ---------- */
  #photo { display: flex; align-items: flex-end; justify-content: center; }
  #pwrap { position: relative; width: 88px; height: 88px; }
  #photo, #pwrap { pointer-events: none; } /* 命中判定交给脚本里的圆形距离计算，方角不算数 */
  #pimg { width: 88px; height: 88px; border-radius: 50%; object-fit: cover; display: block;
    box-shadow: 0 6px 16px rgba(40,40,80,.28); border: 3px solid #fff; box-sizing: border-box; }
  #ring { position: absolute; inset: -5px; border-radius: 50%; opacity: 0;
    border: 3px solid rgba(91,95,247,.18); border-top-color: var(--brand); }
  .s-sleep #pimg { filter: grayscale(.55) brightness(.94); }
  .s-sleep .actor { animation-duration: 5.5s; }
</style>

<div id="pet" class="s-idle c-cat">
  <div id="bubble"><span id="btxt"></span></div>
  <div id="stage">
    <div id="halo"></div>
    <div id="shadow"></div>

    <!-- 形象 A：内置的猫 -->
    <svg id="cat" class="actor" viewBox="0 0 108 100" aria-hidden="true">
      <path id="tail" d="M84 92 q18 4 16 -16 q-1 -9 -8 -9" fill="none" stroke="#b9bce6" stroke-width="7" stroke-linecap="round"/>
      <path d="M22 96 q0 -30 32 -30 q32 0 32 30 q0 8 -8 8 H30 q-8 0 -8 -8 z" fill="#fff" stroke="#b9bce6" stroke-width="2.5"/>
      <path d="M28 44 L26 24 L44 36 z" fill="#fff" stroke="#b9bce6" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M80 44 L82 24 L64 36 z" fill="#fff" stroke="#b9bce6" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M31 40 L30 30 L39 36 z" fill="#ffd3e2"/>
      <path d="M77 40 L78 30 L69 36 z" fill="#ffd3e2"/>
      <ellipse cx="54" cy="52" rx="30" ry="26" fill="#fff" stroke="#b9bce6" stroke-width="2.5"/>
      <ellipse class="eye" cx="44" cy="50" rx="3.6" ry="4.6" fill="#2b2b3c"/>
      <ellipse class="eye" cx="64" cy="50" rx="3.6" ry="4.6" fill="#2b2b3c"/>
      <g id="eyes-happy" stroke="#2b2b3c" stroke-width="2.6" fill="none" stroke-linecap="round">
        <path d="M40 52 q4 -5 8 0"/><path d="M60 52 q4 -5 8 0"/>
      </g>
      <g id="eyes-shut" stroke="#2b2b3c" stroke-width="2.6" fill="none" stroke-linecap="round">
        <path d="M40 51 q4 4 8 0"/><path d="M60 51 q4 4 8 0"/>
      </g>
      <path d="M51.5 58 h5 l-2.5 3 z" fill="#ff9fb8"/>
      <path d="M54 61 q-4 4 -7 1 M54 61 q4 4 7 1" stroke="#aeb1dd" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <g stroke="#b9bce6" stroke-width="1.6" stroke-linecap="round">
        <path d="M24 54 h11 M24 60 h11 M84 54 h-11 M84 60 h-11"/>
      </g>
      <ellipse id="paw-l" cx="40" cy="95" rx="7" ry="5" fill="#fff" stroke="#b9bce6" stroke-width="2"/>
      <ellipse id="paw-r" cx="68" cy="95" rx="7" ry="5" fill="#fff" stroke="#b9bce6" stroke-width="2"/>
      <g id="laptop">
        <rect x="38" y="86" width="32" height="4" rx="2" fill="#5b5ff7"/>
        <path d="M42 86 v-11 h24 v11 z" fill="#eceffe" stroke="#5b5ff7" stroke-width="2" stroke-linejoin="round"/>
      </g>
    </svg>

    <!-- 形象 B：用户上传的照片（自己或朋友） -->
    <div id="photo" class="actor"><div id="pwrap"><img id="pimg" alt=""><div id="ring"></div></div></div>

    <!-- 形象 C：Codex / Petdex 精灵图（~/.codex/pets、~/.petdex/pets 里扫到的） -->
    <canvas id="sprite" class="actor" width="192" height="208"></canvas>

    <div id="fx"><span id="spin"></span><span id="qmark">?</span><svg id="sparks" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg><svg id="zzz" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3h8l-8 9h8"/><path d="M4 14h7l-7 7h7"/></svg></div>
    <div id="drop"></div>
  </div>
</div>

<script>
  const pet = document.getElementById("pet");
  const bubble = document.getElementById("bubble");
  const btxt = document.getElementById("btxt");
  const pimg = document.getElementById("pimg");
  const TIP = { idle: "待命中 · 点我打开主窗口", working: "正在干活", asking: "我有个问题要问你 · 点我去回答",
                done: "任务完成 · 点我看看", error: "出岔子了 · 点我看看", sleep: "本机睡过一觉，任务时限已顺延",
                review: "产出等你过目" };
  let state = "idle", text = "", character = "cat", hovering = false, walk = "";

  /* ------------------------------------------------------------------ *
   * 精灵图播放器
   * ------------------------------------------------------------------ *
   * 图集是 8 列 × 9(或 11) 行，一行一个动作。主进程把整张图当 data URL 推过来，
   * 外加一张「我们的状态 → 第几行 / 几帧 / 一轮多久」的表（见 pet-sprites.js）。
   *
   * 每帧把对应格子 drawImage 到 canvas 上，同时把这一帧的像素 alpha 缓存下来——
   * 点击穿透就是靠它逐像素判定的：一张方图集里真正有东西的只是中间一小块，
   * 不按 alpha 判就等于用一个 96×104 的方框把底下应用的点击全挡了。
   * alpha 只在换帧时读一次（十几分之一秒一次），鼠标移动时是纯数组下标，不做 readback。
   */
  const spriteEl = document.getElementById("sprite");
  const sctx = spriteEl.getContext("2d", { willReadFrequently: true });
  let sheetImg = null, sheetSrc = "", spec = null, frameAlpha = null, frameTimer = null, frameIdx = 0;

  function spriteRow() {
    if (!spec) return null;
    // 溜达方向优先于状态：走路时就该播走路，但状态本身（idle）没变
    return spec.map[walk ? "walk-" + walk : state] || spec.map[state] || spec.map.idle || null;
  }

  function drawFrame() {
    const r = spriteRow();
    if (!r || !sheetImg || !sheetImg.complete || !sheetImg.naturalWidth) return;
    const w = spec.frameW, h = spec.frameH;
    if (spriteEl.width !== w || spriteEl.height !== h) { spriteEl.width = w; spriteEl.height = h; }
    const col = frameIdx % Math.max(1, Math.min(r.frames, spec.cols));
    sctx.clearRect(0, 0, w, h);
    sctx.drawImage(sheetImg, col * w, r.row * h, w, h, 0, 0, w, h);
    try { frameAlpha = sctx.getImageData(0, 0, w, h); } catch { frameAlpha = null; }
  }

  function retime() {
    clearInterval(frameTimer); frameTimer = null;
    const r = spriteRow();
    if (character !== "sprite" || !r) return;
    frameIdx = 0;
    drawFrame();
    const n = Math.max(1, Math.min(r.frames, spec.cols));
    if (n < 2) return; // 单帧的动作不用起定时器
    frameTimer = setInterval(() => { frameIdx = (frameIdx + 1) % n; drawFrame(); }, Math.max(60, Math.round(r.durationMs / n)));
  }

  function loadSheet(src) {
    if (src === sheetSrc) return;
    sheetSrc = src;
    frameAlpha = null;
    if (!src) { sheetImg = null; return; }
    sheetImg = new Image();
    sheetImg.onload = retime;   // 图还没解码完就画，画出来是空的；等 onload 再起播放
    sheetImg.src = src;
  }

  function paint() {
    const blinking = pet.classList.contains("blinking"); // 别把正眨到一半的眼睛擦掉
    pet.className = "s-" + state + " c-" + character + (walk ? " w-" + walk : "") + (blinking ? " blinking" : "");
    btxt.textContent = text || TIP[state] || "";
    bubble.classList.toggle("on", state === "asking" || hovering);
    document.body.classList.toggle("hot", hovering);
  }
  /**
   * 命中判定：光标底下到底压着不压着宠物的实体。
   * 窗口是个 168×196 的透明矩形，真正有东西的地方只占中间一小块；不判定的话
   * 剩下的空白会把底下应用的点击全挡掉（桌宠差评第一名就是"挡东西、点不中"）。
   *
   * 猫走 elementFromPoint：SVG 图元天然按填充区域命中，落在空白处只会命中 <svg> 根节点，
   * 所以"命中了某个子图元"就等于"压在猫身上"，等价于像素级 alpha 测试且不用开 canvas 读像素。
   * 照片走圆形距离计算：<img> 是方的，border-radius 圆不圆不该由浏览器的命中规则说了算。
   */
  function solidAt(x, y) {
    if (bubble.classList.contains("on")) {
      const b = bubble.getBoundingClientRect();
      if (x >= b.left && x <= b.right && y >= b.top && y <= b.bottom) return true;
    }
    if (character === "photo") {
      const r = pimg.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      return Math.hypot(x - cx, y - cy) <= r.width / 2 + 3;
    }
    if (character === "sprite") {
      // 逐像素 alpha。getBoundingClientRect 已经把 --s 的缩放算进去了，
      // 所以这里除以 rect 的实际宽高就自动是缩放无关的。
      if (!frameAlpha) return false;
      const r = spriteEl.getBoundingClientRect();
      if (!r.width || !r.height || x < r.left || x > r.right || y < r.top || y > r.bottom) return false;
      const px = Math.floor((x - r.left) / r.width * frameAlpha.width);
      const py = Math.floor((y - r.top) / r.height * frameAlpha.height);
      if (px < 0 || py < 0 || px >= frameAlpha.width || py >= frameAlpha.height) return false;
      return frameAlpha.data[(py * frameAlpha.width + px) * 4 + 3] > 24;
    }
    const el = document.elementFromPoint(x, y);
    return !!(el && el.closest("#cat") && el.tagName.toLowerCase() !== "svg");
  }
  let hit = null;
  function updateHit(on) {
    if (on === hit) return;
    hit = on;
    hovering = on;
    window.wbPet && window.wbPet.hit(on);
    paint();
  }
  document.addEventListener("mousemove", (e) => updateHit(solidAt(e.clientX, e.clientY)));
  document.addEventListener("mouseleave", () => updateHit(false));
  // 亮相就先交出鼠标：等光标真压上来再要回控制权。渲染进程要是挂了，主进程那边保持"可交互"兜底。
  updateHit(false);

  /* 随机眨眼：固定周期的眨眼一眼假。间隔 4~7 秒随机，闭 0.10s、睁 0.15s（睁比闭慢一半）。
     睡着和完成时是另一套眼型，别去打断它。 */
  (function blinkLoop() {
    const wait = 4000 + Math.random() * 3000;
    setTimeout(() => {
      if (state !== "sleep" && state !== "done") {
        pet.classList.add("blinking");
        setTimeout(() => pet.classList.remove("blinking"), 150);
      }
      blinkLoop();
    }, wait);
  })();

  // 拖动/点击：主进程按位移大小裁定（挪了算拖，没挪算点），这里只报按下和松开
  document.addEventListener("mousedown", (e) => {
    if (e.button !== 0) return;
    document.body.classList.add("dragging");
    window.wbPet && window.wbPet.dragStart();
  });
  document.addEventListener("mouseup", () => {
    document.body.classList.remove("dragging");
    window.wbPet && window.wbPet.dragEnd();
  });
  window.addEventListener("blur", () => document.body.classList.remove("dragging"));
  document.addEventListener("contextmenu", (e) => { e.preventDefault(); window.wbPet && window.wbPet.menu(); });

  window.wbPet && window.wbPet.onState((s) => {
    const wasRow = spec ? JSON.stringify(spriteRow()) : "";
    state = s.name || "idle";
    text = s.text || "";
    walk = s.walk === "left" || s.walk === "right" ? s.walk : "";
    character = s.character === "photo" && s.photo ? "photo"
      : s.character === "sprite" && s.sheet && s.sprite ? "sprite" : "cat";
    if (character === "photo" && pimg.src !== s.photo) pimg.src = s.photo;
    if (character === "sprite") {
      spec = s.sprite;
      loadSheet(s.sheet);
      // 动作没变就别重起定时器，否则每来一条状态推送动画都从第 0 帧重新开始，看着一卡一卡的
      if (JSON.stringify(spriteRow()) !== wasRow) retime();
    } else {
      clearInterval(frameTimer); frameTimer = null; frameAlpha = null;
    }
    // 大小和透明度都落在 #pet 上（不是整页）：整页透明会把气泡里的字也一起糊掉
    document.documentElement.style.setProperty("--s", String(Math.min(2, Math.max(.6, Number(s.scale) || 1))));
    document.documentElement.style.setProperty("--op", String(Math.min(1, Math.max(.25, Number(s.opacity) || 1))));
    paint();
  });
  paint();
</script>
