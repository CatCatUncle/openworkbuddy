<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenWorkBuddy</title>
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/css/ui.css">
<style>
  :root {
    /* --wb-* 一律指向 ui.css 里的 shadcn 令牌。老名字留着是为了不动那八百行既有样式，
       但值只有一处（ui.css），改主题不用两边同步，也就不会两边各说各的。 */
    --wb-brand: var(--primary); --wb-brand-weak: var(--ring-weak); --wb-brand-grad: linear-gradient(135deg,#5b5ff7,#8b5cf6);
    --wb-bg: var(--background); --wb-bg-side: var(--muted); --wb-bg-hover: var(--accent);
    --wb-border: var(--border); --wb-text: var(--foreground); --wb-text-2: var(--muted-foreground); --wb-text-3: var(--subtle-foreground);
    --wb-ok: var(--success); --wb-err: var(--destructive);
    /* 填充色和文字色得分开：同一个紫/红，当背景够用，当文字在浅底上不够。见 ui.css 的 --brand-text/--danger-text */
    --wb-brand-text: var(--brand-text); --wb-err-text: var(--danger-text); --wb-ok-text: var(--success-text);
    /* 底色被写死成白的那几处（比如 IM 气泡里的选中态），字色也不能跟着主题走 */
    --wb-brand-on-white: #5155e8;
    --wb-content-w: 832px; --wb-code-bg: #16181f; --wb-code-text: #d5dcec;
    /* 这四个一直被 JS 里的内联样式引用，却从来没人定义过——评测页、运行记录页的边框和卡片底色
       就这么一路空着（跟之前「生成的网页黑底黑字」是同一类毛病）。补上，并同样接到令牌上 */
    --wb-line: var(--border); --wb-card: var(--card); --wb-warn: var(--warning); --mono: var(--font-mono);
    /* 三级表面：外壳（body / 左栏 / 文件面板）→ 画布（.main / 预览面板）→ 卡片（--wb-bg 那一层白）。
       以前这三层都是纯白，卡片全靠一根灰线撑着；分开之后白卡片自己就浮起来了。值在 ui.css */
    --wb-shell: var(--app-shell); --wb-canvas: var(--page-canvas);
    /* 给模型画的内联 SVG 信息图用的一套语义色/字体变量。图里写 var(--color-text-primary)
       而不是写死 #333，暗色模式下才不会变成黑底黑字。名字沿用通行叫法，模型不用学新词。 */
    --color-text-primary: #2c2c2a; --color-text-secondary: #5f5e5a; --color-text-tertiary: #888780;
    --color-border-primary: #b4b2a9; --color-border-secondary: #d3d1c7; --color-border-tertiary: #e4e2da;
    --color-bg-subtle: #f7f8fa;
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  /* ---------- 外观偏好：app-02.js 的 applyLook() 把选择写到 根元素 html 的 data-fs / data-skin / data-font / data-density 属性 ----------
     字号只改一个 --wb-fs：正文、输入框、标题、行内代码、左栏历史都按 calc 跟着走，四档之间比例不变 */
  :root { --wb-fs: 15px; }
  /* 折叠箭头。伪元素挂不了 <use>，所以这枚只能走 mask：形状写死在 data: 里，颜色由
     currentColor 走 background 给。改形状要跟 icons.js 里的 chevron-right 对齐。 */
  :root {
    --wb-chev-mask: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>');
  }
  html[data-fs="s"] { --wb-fs: 14px; }
  html[data-fs="l"] { --wb-fs: 16px; }
  html[data-fs="xl"] { --wb-fs: 18px; }
  html[data-font="serif"] { --font-sans: Georgia, "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", SimSun, serif; }
  html[data-font="mono"] { --font-sans: var(--font-mono); }
  /* 皮肤：只换品牌色那一组令牌，版式一点不动。字色单独给（浅底要深、暗底要亮），别拿填充色当字色——
     每套在浅/暗两个主题下的 --brand-text 对比度都有测试盯着（≥4.5），白字压 --primary 也要 ≥3 */
  html[data-skin="ocean"] { --primary: #0284c7; --ring: #0284c7; --ring-weak: #e0f2fe; --brand-text: #0369a1; --wb-brand-on-white: #0369a1; --wb-brand-grad: linear-gradient(135deg,#0284c7,#06b6d4); }
  html[data-theme="dark"][data-skin="ocean"] { --ring: #38bdf8; --ring-weak: #0c2a3d; --brand-text: #7dd3fc; }
  html[data-skin="forest"] { --primary: #059669; --ring: #059669; --ring-weak: #d1fae5; --brand-text: #047857; --wb-brand-on-white: #047857; --wb-brand-grad: linear-gradient(135deg,#059669,#14b8a6); }
  html[data-theme="dark"][data-skin="forest"] { --ring: #34d399; --ring-weak: #0b2e24; --brand-text: #6ee7b7; }
  html[data-skin="sunset"] { --primary: #ea580c; --ring: #ea580c; --ring-weak: #ffedd5; --brand-text: #c2410c; --wb-brand-on-white: #c2410c; --wb-brand-grad: linear-gradient(135deg,#ea580c,#f59e0b); }
  html[data-theme="dark"][data-skin="sunset"] { --ring: #fb923c; --ring-weak: #3a2410; --brand-text: #fdba74; }
  html[data-skin="rose"] { --primary: #e11d48; --ring: #e11d48; --ring-weak: #ffe4e6; --brand-text: #be123c; --wb-brand-on-white: #be123c; --wb-brand-grad: linear-gradient(135deg,#e11d48,#ec4899); }
  html[data-theme="dark"][data-skin="rose"] { --ring: #fb7185; --ring-weak: #3d1520; --brand-text: #fda4af; }
  html[data-skin="graphite"] { --primary: #4b5563; --ring: #4b5563; --ring-weak: #e5e7eb; --brand-text: #1f2937; --wb-brand-on-white: #1f2937; --wb-brand-grad: linear-gradient(135deg,#4b5563,#6b7280); }
  html[data-theme="dark"][data-skin="graphite"] { --primary: #6b7280; --ring: #9ca3af; --ring-weak: #2b2d34; --brand-text: #d1d5db; }
  /* 密度：紧凑只收间距和行高，不动字号 */
  html[data-density="compact"] .turn { margin-bottom: 12px; }
  html[data-density="compact"] .a-msg { margin-top: 8px; }
  html[data-density="compact"] .a-text { line-height: 1.55; }
  html[data-density="compact"] .u-msg .bubble { padding: 7px 12px; line-height: 1.5; }
  html[data-density="compact"] .hist-item { padding: 5px 10px; }
  html[data-density="compact"] .card-item { padding: 8px 12px; margin-bottom: 6px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    /* -apple-system 排在 PingFang 前面：这样拉丁字母走 SF（苹果自己的界面字），
       中文再落回 PingFang——同一句中英混排，各拿各最合适的那套。
       反过来写（PingFang 在前）拉丁字母会用 PingFang 自带的西文，字重和字距都偏「网页」。 */
    font-family: var(--font-sans);
    background: var(--wb-shell); color: var(--wb-text); display: flex; overflow: hidden; font-size: var(--wb-fs);
    /* macOS 默认按 subpixel 渲染，中英文都会比设计稿粗一档，整页发糊；
       后台页（admin.html）一直是开着的，主界面反倒漏了，两边看起来不像一个产品。 */
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  /* 标题收字距：15px 以上的粗体默认字距偏松，收紧一点才像「界面字」而不是「正文」 */
  h1, h2, h3, .topbar .title, .brand .name { letter-spacing: -.011em; }
  /* 数字走等宽字形：耗时、计数、金额在列表里逐行左右跳，是最廉价的一种「糙」 */
  .out-row .sz, .hist-item .meta, .ev-fb-tab td, .cr-num, .tok, .proc-head .tc { font-variant-numeric: tabular-nums; }
  input, select, textarea, button { font-family: inherit; }
  /* ---------- 左侧导航 ---------- */
  aside { position: relative; width: var(--wb-side-w, 250px); flex-shrink: 0; background: var(--wb-shell); border-right: 1px solid var(--wb-border); display: flex; flex-direction: column; padding: 14px 10px; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 14px; }
  .brand .mark { width: 30px; height: 30px; border-radius: var(--radius-lg); background: var(--wb-brand-grad); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
  .brand .name { font-size: 15px; font-weight: 600; }
  .brand .tag { font-size: 11px; color: var(--wb-text-2); }
  /* 里程碑时间线卡片（长跑可见性）：过程区里原地刷新的 PROGRESS.md 打勾清单 */
  .ms-card { margin: 6px 0; padding: 8px 10px; border: 1px solid var(--wb-border); border-radius: var(--radius-md); font-size: 13px; }
  .ms-card .ms-head { font-weight: 600; margin-bottom: 4px; }
  .ms-card .ms-file { color: var(--wb-text-3); font-weight: 400; font-size: 12px; }
  .ms-card .ms-item { padding: 1px 0; color: var(--wb-text-2); }
  .ms-card .ms-item.done { color: var(--wb-text-3); }
  #new-task { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 0 4px 14px; padding: 9px; border: none; border-radius: var(--radius-lg); background: var(--wb-brand-grad); color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; }
  .ab-head { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600; padding: 2px 4px 6px; cursor: pointer; user-select: none; }
  .ab-head .ab-sub { font-weight: 400; font-size: 12px; color: var(--wb-text-3); }
  .ab-ch { display: flex; align-items: center; gap: 6px; padding: 5px 4px; border-radius: var(--radius-sm); font-size: 13px; cursor: pointer; }
  .ab-ch:hover { background: var(--wb-bg-hover); }
  .ab-ch .st { margin-left: auto; font-size: 12px; color: var(--wb-text-3); }
  .ab-ch .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--wb-text-3); flex: none; }
  .ab-ch .dot.ok { background: var(--wb-ok); }
  .ab-ch .dot.err { background: var(--wb-err); }
  .ab-empty { font-size: 12px; color: var(--wb-text-3); padding: 4px; }
  .im-strip { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 10px; border: 1px solid var(--wb-border); border-radius: var(--radius-lg); font-size: 14px; margin-bottom: 12px; }
  .im-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--wb-text-2); }
  .im-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--wb-text-3); }
  .im-chip .dot.ok { background: var(--wb-ok); }
  .im-chip .dot.err { background: var(--wb-err); }
  .im-feed { display: flex; flex-direction: column; gap: 8px; max-height: 55vh; overflow-y: auto; padding: 4px 2px; }
  .im-b { max-width: 76%; padding: 8px 12px; border-radius: var(--radius-lg); font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .im-b.in { align-self: flex-start; background: var(--wb-bg-hover); }
  .im-b.out { align-self: flex-end; background: var(--wb-brand-weak); }
  .im-b.error { align-self: center; color: var(--wb-err-text); font-size: 13px; background: none; }
  .im-b .m { font-size: 12px; color: var(--wb-text-3); margin-bottom: 2px; }
  .side-label { font-size: 12px; color: var(--wb-text-3); padding: 4px 10px 6px; }
  /* 同上：任务多到要滚的时候，侧栏里每条标题会整体左移 11px */
  #history { flex: 1; overflow-y: auto; min-height: 0; scrollbar-gutter: stable; }
  .hist-item { padding: 8px 10px; border-radius: var(--radius-md); font-size: calc(var(--wb-fs) - 1px); color: var(--wb-text-2); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist-item:hover { background: var(--wb-bg-hover); }
  /* 这几类行是 div，补了 tabindex 才能 Tab 到；浏览器不给 div 画默认焦点圈，得自己画。
     用 outline 不用 box-shadow：选中态的左侧指示条正占着 box-shadow。 */
  .hist-item:focus-visible, .proj-item:focus-visible, .side-nav .item:focus-visible,
  .out-card:focus-visible, .proc-head:focus-visible, .out-more:focus-visible, .out-main:focus-visible,
  .src-hd:focus-visible, .user-chip:focus-visible {
    outline: 2px solid var(--wb-brand); outline-offset: -2px;
  }
  /* 选中态不拿品牌色当文字：品牌紫压在自己的浅紫底上只有 4.86:1，比同一列表里
     未选中项的 5.75:1 还低——当前项成了整列最不清楚的一行，层级是反的。
     改成 shadcn sidebar 的做法：文字用 accent-foreground（最重），品牌色退回去
     当左侧指示条（填充色的正确用法），选中与 hover 靠指示条区分，不靠色相。 */
  .hist-item.active { background: var(--wb-brand-weak); color: var(--wb-text); font-weight: 600; box-shadow: inset 3px 0 0 var(--wb-brand); }
  .side-nav { border-top: 1px solid var(--wb-border); padding-top: 8px; margin-top: 8px; }
  /* 主导航挪到「项目」下面，跟任务历史之间用一条线隔开（历史是列表，导航是入口，别混在一起） */
  .side-nav.top { border-top: none; border-bottom: 1px solid var(--wb-border); padding: 0 0 8px; margin: 6px 0 8px; }
  .side-nav .item { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: var(--radius-md); font-size: 14px; color: var(--wb-text-2); cursor: pointer; }
  .side-nav .item:hover { background: var(--wb-bg-hover); color: var(--wb-text); }
  .side-nav .item.active { background: var(--wb-brand-weak); color: var(--wb-text); font-weight: 600; box-shadow: inset 3px 0 0 var(--wb-brand); }
  /* 官方 WorkBuddy 的侧栏项是两行：主标题 + 灰色副标题（专家/技能·连接器、自动化/定时任务、更多/资料库·灵感） */
  .side-nav .item .tx { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
  .side-nav .item .tx .sub { font-size: 12px; color: var(--wb-text-3); font-weight: 400; }
  /* 这一行本来还压了 opacity:.82，选中底上实测只剩 3.55（浅）/ 4.16（暗）——
     12px 的小字要 4.5。去掉透明度，两套主题分别回到 4.86 和 5.37 */
  .side-nav .item.active .tx .sub { color: var(--wb-brand-text); }
  .side-nav .more-toggle { justify-content: space-between; color: var(--wb-text-3); }
  .side-nav .more-toggle .caret { margin-left: auto; }
  /* 项目表头：点整行进项目页，点右边的加号快速新建 */
  .side-nav .nav-head { cursor: pointer; }
  /* 加号原来用第三级文字色，压在选中底上暗色只有 4.25。抬一级到 --wb-text-2：浅 5.40 / 暗 5.36 */
  /* 实测 23×21，差一点点就够 24——补齐，顺便把图标居中 */
  .side-nav .nav-head #proj-add { margin-left: auto; text-decoration: none; color: var(--wb-text-2);
    font-size: 15px; padding: 0; width: 24px; height: 24px; flex: none; border-radius: var(--radius-sm);
    display: inline-flex; align-items: center; justify-content: center; }
  .side-nav .nav-head #proj-add:hover { background: var(--wb-bg-hover); color: var(--wb-text); }
  .side-nav #proj-list { margin: 0 0 4px; }
  .side-nav .more-toggle .caret { display: inline-flex; align-items: center; color: var(--wb-text-3); transition: transform var(--wb-t-fast) var(--wb-ease); }
  .side-nav .more-toggle.open .caret { transform: rotate(180deg); }
  .more-box { display: none; padding-left: 8px; }
  .more-box.open { display: block; }
  /* ---------- 主区域 ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--wb-canvas); }
  .topbar { height: 56px; flex: 0 0 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--wb-border); }
  .topbar .title { font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar .right { display: flex; align-items: center; gap: 10px; }
  /* 侧栏上那两条工作线（办公 / 工程）。分的是「这次干哪种活儿」：办公是做表写稿出图发消息
     （鼠标流），工程是写代码跑脚本查日志（键盘流，连着本机的 wb 命令行）。放在「新建任务」
     底下、任务列表上头，而不是塞进设置页：两条线各记各的会话，切一下标签下面整列历史跟着换，
     挨着放才看得出是同一件事。两个按钮等分整行——侧栏能被拖到 180px，靠内容撑宽度会挤成一高一矮。 */
  .lane-tabs { display: flex; gap: 2px; padding: 3px; margin: 0 4px 12px; background: var(--wb-bg-hover); border-radius: var(--radius-lg); }
  .lane-tabs button { flex: 1 1 0; min-width: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: none; background: transparent; color: var(--wb-text-2); font: inherit; font-size: 13px; line-height: 1; padding: 7px 8px; border-radius: var(--radius-md); cursor: pointer; white-space: nowrap; }
  .lane-tabs button:hover { color: var(--wb-text); }
  .lane-tabs button.on { background: var(--wb-card); color: var(--wb-text); font-weight: 500; box-shadow: 0 1px 2px rgba(23,24,28,.10); }
  .lane-tabs button .i { width: 15px; height: 15px; flex-shrink: 0; }
  .lane-tabs .lt-name { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  /* 终端里此刻有几趟活儿在跑。人在办公那条线上也看得见这个数字，不用来回点 */
  .lane-tabs .lt-live { flex: 0 0 auto; min-width: 16px; height: 16px; padding: 0 4px; border-radius: var(--radius-md); background: var(--wb-brand); color: #fff; font-size: 11px; font-weight: 600; line-height: 16px; text-align: center; }
  #toggle-files { border: 1px solid var(--wb-border); background: var(--wb-bg); border-radius: var(--radius-md); padding: 5px 12px; font-size: 13px; color: var(--wb-text-2); cursor: pointer; position: relative; }
  /* 「成果文件」角标：这回合来了几件还没看过的新产出。面板一开就摘掉 */
  #toggle-files .fb-badge { position: absolute; top: -7px; right: -7px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: var(--radius-lg); background: var(--wb-brand); color: #fff; font-size: 11px; font-weight: 600; line-height: 18px; text-align: center; box-sizing: border-box; }
  #chat-scroll { flex: 1; overflow-y: auto; min-height: 0; scrollbar-gutter: stable both-edges; }
  #to-bottom { position: absolute; right: 24px; bottom: 150px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--wb-border); background: var(--wb-bg); color: var(--wb-text-2); font-size: 15px; cursor: pointer; box-shadow: var(--shadow-menu); display: none; z-index: 5; }
  #to-bottom.show { display: block; }
  #to-bottom:hover { color: var(--wb-brand-text); border-color: var(--wb-brand-text); }
  /* 长对话滚动引导：往上翻远了出「回到最前」；人在上面时下面来了新内容，「回到最新」挂红点 */
  #to-top { position: absolute; right: 24px; bottom: 190px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--wb-border); background: var(--wb-bg); color: var(--wb-text-2); font-size: 15px; cursor: pointer; box-shadow: var(--shadow-menu); display: none; z-index: 5; }
  #to-top.show { display: flex; align-items: center; justify-content: center; }
  #to-top:hover { color: var(--wb-brand-text); border-color: var(--wb-brand-text); }
  #to-bottom.new::after { content: ""; position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--destructive, #e5484d); border: 2px solid var(--wb-bg); }
  /* 列宽要把自己的左右内边距算进去，才能和输入卡片落在同一条竖线上：
     卡片是 832px 整块（428–1260），消息列如果也只有 832px，减掉 20px 内边距后
     内容只剩 448–1240，两端各内缩 20px——头像和用户气泡的边就都对不上卡片的边。 */
  .chat-col { max-width: calc(var(--wb-content-w) + 40px); margin: 0 auto; padding: 24px 20px 12px; }
  /* 广场类页面（专家/技能/连接器、模板库）是卡片网格，832px 的阅读宽度会挤成一列 */
  .chat-col.wide-page { max-width: 1160px; }
  .empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 10vh; }
  .empty h1 { font-size: 34px; font-weight: 700; margin-bottom: 24px; letter-spacing: 1px; }
  .scene-tabs { display: flex; flex-wrap: wrap; justify-content: center; background: var(--wb-bg-side); border-radius: var(--radius-full); padding: 4px; gap: 2px; margin-bottom: 34px; }
  .scene-tabs button { border: none; background: transparent; border-radius: var(--radius-full); padding: 9px 20px; font-size: 15px; color: var(--wb-text-2); cursor: pointer; display: flex; align-items: center; gap: 6px; }
  /* 选中的那颗胶囊是「反色」：浅色下黑底白字。可原来这两个颜色是写死的，深色模式下
     轨道底 --wb-bg-side 正好也是 #17181c——胶囊底和轨道底一模一样，1.00:1，
     整颗胶囊直接消失，只剩几个白字浮在那儿，根本看不出选中的是哪个。
     改成跟着主题翻的一对：底用前景色、字用背景色，浅色下和以前一模一样，深色下自动变成白底黑字。 */
  .scene-tabs button.active { background: var(--wb-text); color: var(--wb-bg); font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 720px; }
  .chips button { padding: 9px 18px; border-radius: var(--radius-full); border: 1px solid var(--wb-border); background: var(--wb-bg); font-size: 14px; color: var(--wb-text); cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .chips button:hover { border-color: var(--wb-brand-text); color: var(--wb-brand-text); background: var(--wb-brand-weak); }
  /* 这块底色原来写死成薄荷绿：深色模式下它不翻色，整页暗的时候留一块刺眼亮片（对页面底 14.2:1）；
     文字那一档也只有 3.76:1。改成跟着主题走的绿 */
  .scene-tag { display: inline-flex; align-items: center; gap: 8px; background: color-mix(in srgb, var(--wb-ok) 12%, var(--wb-card)); color: var(--wb-ok-text); font-size: 13px; border-radius: var(--radius-2xl); padding: 4px 12px; margin-bottom: 8px; }
  .scene-tag b { cursor: pointer; font-weight: 400; opacity: .7; }
  /* @ / 自动补全菜单 */
  .mention-menu { display: none; position: absolute; bottom: 100%; left: 12px; margin-bottom: 8px; min-width: 260px; max-width: 420px; max-height: 260px; overflow-y: auto; background: var(--wb-bg); border: 1px solid var(--wb-border); border-radius: var(--radius-xl); box-shadow: var(--shadow-menu); padding: 6px; z-index: 40; }
  .mention-menu.show { display: block; }
  .mention-menu .mi { padding: 8px 12px; border-radius: var(--radius-md); font-size: 14px; cursor: pointer; }
  .mention-menu .mi:hover, .mention-menu .mi.sel { background: var(--wb-bg-hover); }
  .mention-menu .mi .sub { font-size: 12px; color: var(--wb-text-3); display: block; }
  .mention-menu .mh { font-size: 12px; color: var(--wb-text-3); padding: 4px 12px; }
  .turn { margin-bottom: 22px; }
  .u-msg { display: flex; justify-content: flex-end; }
  .u-msg .bubble { max-width: 78%; background: var(--wb-brand); color: #fff; border-radius: var(--radius-2xl) var(--radius-2xl) var(--radius-xs) var(--radius-2xl); padding: 10px 15px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }
  .u-msg .bubble .bubble-attach { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .u-msg .bubble .bubble-attach span { font-size: 12px; background: rgba(255,255,255,.18); border-radius: var(--radius-md); padding: 2px 8px; white-space: nowrap; }
  .a-msg { display: flex; gap: 10px; margin-top: 16px; }
  .a-msg .avatar { width: 28px; height: 28px; flex-shrink: 0; border-radius: var(--radius-lg); background: var(--wb-brand-grad); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
  .a-msg .body { min-width: 0; flex: 1; }
  /* 头像可以是首字母、emoji 或用户传的图。传了图就让图铺满整块，底下的品牌渐变自然被盖住；
     emoji 则换成中性底，不然彩色 emoji 压在紫色渐变上很脏。 */
  img.ava-img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
  .emo { background: var(--wb-bg-hover) !important; }
  /* 内置猫标（avatar="@cat"）。跟 emoji 不同，它本来就是白+粉+深灰的三色标，
     压在品牌渐变上正好，所以不换中性底——那样反而糊成一坨。
     82% 是留给圆形容器的：标的外接框是正方形，铺满 100% 耳朵尖会被圆切掉——
     实测（把 symbol 画进 canvas 数落在内切圆外的不透明像素）：100% 时 22/32/52px 三档
     分别有 12.4%/8.4%/5.3% 的像素出界，最远超出 3.8px；82% 时三档都是 0。 */
  .ava-mk { width: 82%; height: 82%; display: block; }
  /* 头像用的图标跟着容器走，不跟字号走：头像格子有 17/28/38/52 好几种尺寸，
     .i 的 1em 在大格子里会缩成中间一小点 */
  .i.ava-ic { width: 62%; height: 62%; stroke-width: 1.8; }
  .im-row .im-ava.mk, .ab-ava.mk { background: var(--wb-brand-grad) !important; }
  .brand .mark.emo, .a-msg .avatar.emo, .user-chip .ava.emo, .um-head .ava.emo { font-size: 15px; }
  .ab-ava { width: 17px; height: 17px; border-radius: var(--radius-sm); display: inline-flex; align-items: center; justify-content: center; overflow: hidden; vertical-align: -4px; font-size: 14px; }
  .ab-ava.emo { background: none !important; }
  /* 头像候选：等大方格 + 自动铺满的网格，一格一个候选。
     老版本是 flex 里一串行内 <span>，三类候选（猫标 25px / 图标 / 表情 17px）尺寸互不相同，
     眼睛得一格一格地对。更要命的是图标那格：.ava-ic 用 62% 量自己，而行内元素没有宽度，
     百分比找不到参照物，浏览器就退回 SVG 的默认尺寸 300×150 —— 助理设置里每个候选都有巴掌大
     （用户原话：「待选的这些图片 svg 都很大」）。格子定死之后百分比才有参照，三类也终于一样大。 */
  .ava-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); justify-items: center;
              gap: 4px; max-height: 132px; overflow-y: auto; padding: 8px;
              border: 1px solid var(--wb-border); border-radius: var(--radius-xl); background: var(--wb-bg-side); }
  .ava-pick { width: 36px; height: 36px; padding: 0; display: flex; align-items: center; justify-content: center;
              cursor: pointer; font-size: 20px; line-height: 1; border-radius: var(--radius-lg); border: 1px solid transparent;
              background: none; color: inherit; font-family: inherit; }
  .ava-pick.mk { background: var(--wb-brand-grad); }
  .ava-pick:hover { background: var(--wb-bg-hover); border-color: var(--wb-border); }
  .ava-pick.on { border-color: var(--wb-brand-text); background: var(--wb-brand-weak); color: var(--wb-brand-text); }
  /* 猫标那格本来就是渐变底，选中/悬停不换底色——换了就看不出那是同一只猫 */
  .ava-pick.mk.on, .ava-pick.mk:hover { background: var(--wb-brand-grad); }
  /* 头像编辑器（助理设置 / 个人资料共用）：左边一格实时预览，右边分类胶囊 + 网格 */
  .ava-ed { display: flex; gap: 12px; align-items: flex-start; }
  .ava-ed-prev { width: 56px; height: 56px; flex: none; border-radius: var(--radius-2xl); background: var(--wb-brand-grad);
                 color: #fff; display: flex; align-items: center; justify-content: center;
                 font-size: 26px; font-weight: 600; overflow: hidden; }
  .ava-ed-main { flex: 1; min-width: 0; }
  .ava-ed-main > [data-t][hidden] { display: none; } /* .ava-grid 是 display:grid，会盖掉 hidden 的默认样式 */
  .ava-tabs { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .ava-tabs .chip { padding: 3px 12px; font-size: 12px; }
  .ava-reset { margin-left: auto; padding: 4px; border: none; background: none; cursor: pointer;
               font-size: 12px; color: var(--wb-text-2); }
  .ava-reset:hover { color: var(--wb-brand-text); background: none; }
  .ava-any { margin-top: 8px; max-width: 320px; }
  /* 图片那一页：整块虚线框自己就是那颗按钮，点哪儿都能挑图，拖进来也认。
     以前框里孤零零站着一颗「选一张图片」——虚线框看着是能拖的，点框里的空白却没反应，
     只有那颗按钮管用，所以它看着突兀（用户原话：「特别是这个选一张图片看着有点突兀」）。 */
  .ava-drop { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
              width: 100%; min-height: 116px; padding: 16px; text-align: center; cursor: pointer;
              border: 1px dashed var(--wb-border); border-radius: var(--radius-xl); background: var(--wb-bg-side);
              color: var(--wb-text-2); font-family: inherit; font-size: 13px; }
  .ava-drop:hover, .ava-drop.over { border-color: var(--wb-brand-text); background: var(--wb-brand-weak); }
  .i.ava-drop-ic { width: 22px; height: 22px; opacity: .65; }
  .ava-drop-t { font-size: 13px; color: var(--wb-text); }
  .ava-drop:hover .ava-drop-t, .ava-drop.over .ava-drop-t { color: var(--wb-brand-text); }
  .ava-tip { font-size: 12px; color: var(--wb-text-2); }
  /* 编辑器里的头像预览，跟卡片上那格同一个样子，改完立刻看得见 */
  .ava-prev { width: 38px; height: 38px; border-radius: var(--radius-lg); background: var(--wb-brand-weak); color: var(--wb-brand-text);
              display: flex; align-items: center; justify-content: center; font-size: 19px; }
  .a-text { line-height: 1.7; word-break: break-word; overflow-wrap: anywhere; margin: 3px 0 6px; }
  .a-text p { margin: 6px 0; }
  /* 流式期间正文被拆成「已定稿 / 正在写」两截（app-01.js paintStream）：display:contents
     让这两个壳子不生成盒子，排版和「一次渲染完」完全一样，.a-text p 这类选择器也照样命中 */
  .a-text > .md-done, .a-text > .md-live { display: contents; }
  .a-text h1, .a-text h2, .a-text h3, .a-text h4 { margin: 12px 0 6px; font-size: var(--wb-fs); }
  .a-text h1 { font-size: calc(var(--wb-fs) + 2px); }
  .a-text h2 { font-size: calc(var(--wb-fs) + 1px); }
  .a-text ul, .a-text ol { margin: 6px 0; padding-left: 22px; }
  .a-text li { margin: 3px 0; }
  /* markdown 里的图：不许撑破容器，也别顶到贴边 */
  .md-img { display: block; max-width: 100%; height: auto; margin: 10px 0; border-radius: var(--radius-lg); border: 1px solid var(--wb-border); }
  .a-text blockquote { border-left: 3px solid var(--wb-brand); background: var(--wb-brand-weak); padding: 8px 12px; margin: 8px 0; border-radius: 0 var(--radius-md) var(--radius-md) 0; color: var(--wb-text-2); }
  .a-text blockquote p { margin: 2px 0; }
  /* 提示条：系统插在正文里的那几条（核验没过 / 还没做完 / 原地打转）。
     图标靠左顶格，正文另起一列——比整段文字挤在一行好扫 */
  .a-text blockquote.cal { display: flex; gap: 8px; align-items: flex-start; border-left-width: 3px; }
  .a-text blockquote.cal .cal-i { flex: 0 0 auto; width: 16px; height: 16px; margin-top: 3px; }
  .a-text blockquote.cal > p { flex: 1 1 auto; min-width: 0; }
  .a-text blockquote.cal-warn { border-left-color: var(--wb-warn, #d97706); background: color-mix(in srgb, var(--wb-warn, #d97706) 10%, transparent); }
  .a-text blockquote.cal-warn .cal-i { color: var(--wb-warn, #d97706); }
  .a-text blockquote.cal-stop { border-left-color: var(--wb-err, #dc2626); background: color-mix(in srgb, var(--wb-err, #dc2626) 10%, transparent); }
  .a-text blockquote.cal-stop .cal-i { color: var(--wb-err-text, #bf3035); }
  .a-text blockquote.cal-ok { border-left-color: var(--wb-ok, #16a34a); background: color-mix(in srgb, var(--wb-ok, #16a34a) 10%, transparent); }
  .a-text blockquote.cal-ok .cal-i { color: var(--wb-ok-text, #127538); }
  .a-text blockquote.cal-wait .cal-i { color: var(--wb-brand-text); }
  .a-text code { background: var(--wb-bg-hover); border-radius: var(--radius-xs); padding: 1px 5px; font-size: calc(var(--wb-fs) - 2px); font-family: var(--font-mono); }
  .a-text pre { background: var(--wb-code-bg); color: var(--wb-code-text); border-radius: var(--radius-md); padding: 12px; overflow-x: auto; margin: 8px 0; }
  .a-text pre code { background: none; color: inherit; padding: 0; }
  /* ---------- 模型直接画在正文里的 SVG 信息图 ---------- */
  .svg-fig { margin: 12px 0; border: 1px solid var(--wb-border); border-radius: var(--radius-xl); background: var(--wb-bg);
    overflow: hidden; position: relative; }
  .svg-fig > .svg-body { padding: 8px 10px; overflow-x: auto; }
  .svg-fig svg { display: block; max-width: 100%; height: auto; }
  .svg-fig .svg-acts { display: flex; gap: 6px; justify-content: flex-end; align-items: center;
    padding: 5px 8px; border-top: 1px solid var(--wb-border); background: var(--wb-bg-side); }
  .svg-fig .svg-acts button { font-size: 12px; color: var(--wb-text-2); background: none; border: 1px solid var(--wb-border);
    border-radius: var(--radius-sm); padding: 3px 9px; cursor: pointer; }
  .svg-fig .svg-acts button:hover { background: var(--wb-bg-hover); color: var(--wb-text); }
  .svg-fig .svg-acts .growing { margin-right: auto; font-size: 12px; color: var(--wb-text-3); }
  .svg-fig .svg-acts .growing::after { content: "▍"; animation: svgblink 1s steps(2) infinite; }
  @keyframes svgblink { 50% { opacity: 0; } }
  /* 停笔之后的「没画完」：一句实话，不闪、不转、不装作还在动 */
  .svg-fig .svg-acts .partial { margin-right: auto; font-size: 12px; color: var(--wb-text-3); cursor: help; }
  .svg-fig .svg-raw { margin: 0; border-top: 1px solid var(--wb-border); border-radius: 0; max-height: 300px; font-size: 13px; }
  /* 「放大看」：图铺满屏，滚轮缩放、按住拖动、Esc 退出。
     对话列里图被挤成窄窄一条，坐标轴和小字根本看不清，总不能让人把窗口拉宽再拉回来。 */
  .fig-zoom { position: fixed; inset: 0; z-index: 900; display: flex; flex-direction: column;
    background: rgba(16,18,24,.86); backdrop-filter: blur(3px); animation: figfade .14s ease-out; }
  @keyframes figfade { from { opacity: 0; } }
  .fig-zoom .fz-bar { flex: none; display: flex; align-items: center; gap: 8px; justify-content: flex-end;
    padding: 10px 14px; color: #e8eaf2; }
  .fig-zoom .fz-tip { margin-right: auto; font-size: 13px; color: #a8adbd; }
  .fig-zoom .fz-pct { font-size: 13px; min-width: 46px; text-align: center; color: #c9cddb;
    font-variant-numeric: tabular-nums; }
  .fig-zoom .fz-bar button { font-size: 13px; line-height: 1; color: #e8eaf2; background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.16); border-radius: var(--radius-md); padding: 7px 12px; cursor: pointer; }
  .fig-zoom .fz-bar button:hover { background: rgba(255,255,255,.18); }
  .fig-zoom .fz-stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    overflow: hidden; padding: 0 16px 16px; cursor: grab; touch-action: none; }
  .fig-zoom .fz-stage.dragging { cursor: grabbing; }
  .fig-zoom .fz-inner { background: #fff; border-radius: var(--radius-lg); padding: 12px; transform-origin: center center; }
  .fig-zoom .fz-inner svg { display: block; width: 100%; height: 100%; }
  /* ---------- 来源 ---------- */
  .src-block { margin: 12px 0 4px; border-top: 1px solid var(--wb-border); padding-top: 8px; }
  .src-hd { font-size: 13px; color: var(--wb-text-2); margin-bottom: 6px; cursor: pointer; user-select: none; }
  .src-hd::before { margin-right: 3px; }
  .src-block.open .src-hd::before { transform: rotate(90deg); }
  .src-list { display: none; flex-wrap: wrap; gap: 6px; }
  .src-block.open .src-list { display: flex; }
  .src-item { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; font-size: 13px;
    color: var(--wb-text-2); text-decoration: none; background: var(--wb-bg-side);
    border: 1px solid var(--wb-border); border-radius: var(--radius-full); padding: 3px 10px; }
  .src-item:hover { background: var(--wb-bg-hover); color: var(--wb-text); }
  .src-item .n { color: var(--wb-text-3); font-variant-numeric: tabular-nums; }
  .src-item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 320px; }
  .code-wrap { margin: 8px 0; border-radius: var(--radius-md); overflow: hidden; border: 1px solid rgba(255,255,255,.06); }
  .code-head { display: flex; justify-content: space-between; align-items: center; background: #23252e; color: #8b92a5; font-size: 12px; padding: 5px 12px; font-family: Consolas, ui-monospace, monospace; }
  .code-head .code-copy { cursor: pointer; color: #8b92a5; user-select: none; }
  .code-head .code-copy:hover { color: #fff; }
  .code-wrap pre { margin: 0; border-radius: 0; }
  .md-table-wrap { overflow-x: auto; margin: 8px 0; }
  .a-text table { border-collapse: collapse; font-size: 14px; min-width: 60%; }
  .a-text th, .a-text td { border: 1px solid var(--wb-border); padding: 5px 10px; text-align: left; overflow-wrap: anywhere; }
  .a-text th { background: var(--wb-bg-hover); font-weight: 600; }
  .a-text hr { border: none; border-top: 1px solid var(--wb-border); margin: 10px 0; }
  .a-text a { color: var(--wb-brand-text); overflow-wrap: anywhere; }
  /* 正文里提到的产出文件名：点一下就在右边打开。做成"带下划虚线的实体"而不是普通蓝链，
     免得跟正文里的外部网址混淆——一个跳出去，一个在应用里打开 */
  .a-text .file-ln { color: var(--wb-brand-text); cursor: pointer; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 3px; border-radius: var(--radius-xs); padding: 0 2px; overflow-wrap: anywhere; }
  .a-text .file-ln:hover { background: var(--wb-brand-weak); text-decoration-style: solid; }
  .a-text .file-ln:focus-visible { outline: 2px solid var(--wb-brand-text); outline-offset: 1px; }
  /* 卡片底色原来写死成近白的 #fbfcfe，深色模式下它不翻——每张过程卡都是一块刺眼的白板
     （压深色页面底 17.43:1），上面的字又是深色主题那档浅灰，白底浅灰只有 2.29:1，基本读不了。 */
  .step-card { border: 1px solid var(--wb-border); border-radius: var(--radius-lg); margin: 8px 0; overflow: hidden; background: var(--wb-card); }
  .step-card .head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; user-select: none; font-size: 14px; }
  .tag { font-size: 12px; padding: 2px 9px; border-radius: var(--radius-lg); background: var(--wb-brand-weak); color: var(--wb-brand-text); white-space: nowrap; }
  /* 底色不能写死浅绿/浅红：深色主题下字色跟着令牌变亮，压在浅底上就成了白纸写黄字。
     改成 color-mix 叠在当前表面上，两套主题各自成立 */
  .tag.ok { background: color-mix(in srgb, var(--success) 14%, transparent); color: var(--wb-ok-text); }
  .tag.err { background: color-mix(in srgb, var(--destructive) 14%, transparent); color: var(--wb-err-text); }
  .step-card.failed { border-color: color-mix(in srgb, var(--destructive) 40%, var(--wb-border)); }
  .step-card .desc { color: var(--wb-text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  /* 结果摘要跟在同一行末尾：成功报量、失败报原因，不用一张张点开看 */
  .step-card .out { color: var(--wb-text-3); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46%; }
  .step-card .out.err { color: var(--wb-err-text); }
  .step-card pre { display: none; background: var(--wb-code-bg); color: var(--wb-code-text); padding: 12px; font-size: 13px; line-height: 1.5; max-height: 320px; overflow: auto; }
  .step-card.open pre { display: block; }
  /* 执行过程折叠条（仿官方「已完成 12s ›」） */
  .proc-wrap { margin: 2px 0 8px; }
  .proc-head { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--wb-text-3); cursor: pointer; user-select: none; padding: 2px 0; }
  .proc-head:hover { color: var(--wb-text-2); }
  /* 跑的时候这一行钉在视口顶：过程区展开得再长，也一眼看得到跑到第几步、几步出错、产出几件 */
  .proc-wrap.running .proc-head { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; padding: 5px 0;
    background: var(--wb-bg); box-shadow: 0 1px 0 var(--wb-border); }
  .proc-head .arrow { display: inline-flex; align-items: center; transition: transform var(--wb-t-fast) var(--wb-ease); }
  .proc-wrap.open .proc-head .arrow { transform: rotate(90deg); }
  .proc-warn { color: var(--wb-err-text); background: rgba(229,72,77,.12); border-radius: var(--radius-sm); padding: 0 6px; font-size: 12px; }
  .proc-body { display: none; padding-left: 10px; border-left: 2px solid var(--wb-border); margin: 4px 0 4px 4px; }
  /* 轨迹条：折叠条上的工具徽章。跑着的亮蓝、栽了的标红、其余灰底不抢眼 */
  .proc-head .trail { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  /* 里程碑常驻行：占满一行挤到折叠条下面，跟着它一起 sticky —— 过程收着也看得见跑到哪了 */
  .proc-head .ms-live { flex-basis: 100%; width: 100%; font-size: 12px; color: var(--wb-brand-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 「此刻在干什么」常驻行：跟里程碑行一样占满一行、跟着折叠条一起钉在顶上。
     过程区收着也一直看得见 agent 在动——不然长任务就只剩一个转圈的「运行中」。
     跑完就撤掉：那时候该看的是「已完成 3m20s · 产出 2 件」，不是最后一句旁白 */
  .proc-head .act-live { flex-basis: 100%; width: 100%; font-size: 12px; color: var(--wb-text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proc-head .act-live:empty, .proc-wrap:not(.running) .proc-head .act-live { display: none; }
  .proc-head .tc { font-size: 11px; line-height: 18px; padding: 0 7px; border-radius: var(--radius-lg); background: var(--wb-bg-hover); color: var(--wb-text-3); white-space: nowrap; cursor: pointer; }
  .proc-head .tc b { font-weight: 600; margin-left: 2px; }
  .proc-head .tc:hover { color: var(--wb-text); }
  .proc-head .tc.run { color: var(--wb-brand-text); background: var(--wb-brand-weak); }
  .proc-head .tc.err { color: var(--wb-err-text); background: color-mix(in srgb, var(--destructive) 14%, transparent); }
  .proc-head .tc.abort { text-decoration: line-through; }
  .proc-head .tc.more { cursor: default; }
  /* 评测页的用户反馈汇总 */
  .ev-fb-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 0 0 10px; }
  .ev-fb-card { background: var(--wb-card); border: 1px solid var(--wb-line); border-radius: var(--radius-lg); padding: 10px 12px; }
  .ev-fb-card .k { font-size: 12px; color: var(--wb-text-3); }
  .ev-fb-card .v { font-size: 20px; font-weight: 700; color: var(--wb-text); margin: 2px 0; }
  .ev-fb-card .s { font-size: 11px; color: var(--wb-text-3); }
  .ev-fb-empty { padding: 12px 14px; background: var(--wb-card); border: 1px dashed var(--wb-line); border-radius: var(--radius-lg); line-height: 1.7; }
  .ev-fb-tab { width: 100%; border-collapse: collapse; font-size: 12px; margin: 0 0 8px; }
  .ev-fb-tab th, .ev-fb-tab td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--wb-line); }
  .ev-fb-tab th { color: var(--wb-text-3); font-weight: 500; }
  .ev-bar { display: inline-block; width: 60px; height: 6px; background: var(--wb-bg-hover); border-radius: var(--radius-full); margin-right: 6px; vertical-align: middle; overflow: hidden; }
  .ev-bar i { display: block; height: 100%; background: var(--success); }
  .ev-fb-down { display: grid; grid-template-columns: 76px 120px 1fr 1fr auto; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--wb-line); font-size: 12px; align-items: center; }
  .ev-fb-down .m, .ev-fb-down .task, .ev-fb-down .note { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev-fb-down .note { color: var(--wb-text); }
  .ev-fb-down a { color: var(--wb-brand-text); text-decoration: none; white-space: nowrap; }
  .proc-wrap.open .proc-body { display: block; }
  .proc-body .a-text { color: var(--wb-text-2); font-size: 14px; }
  /* 本次产出：把成果文件直接摆在对话里，点开就看，不用去右侧文件面板翻 */
  .out-block { margin: 12px 0 4px; }
  .out-hd { font-size: 13px; color: var(--wb-text-3); margin-bottom: 8px; }
  .out-hd.out-main, .out-hd.out-more { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 4px; }
  /* display:flex 会盖掉 hidden 属性自带的 display:none。没折起东西时那条「还有 N 个文件」
     文字是空的，但盒子还在——一条看不见却点得着的横条，鼠标划过去还会亮底色 */
  .out-hd[hidden] { display: none; }
  .out-hd.out-main:hover, .out-hd.out-more:hover { color: var(--wb-text-2); }
  /* 整块收起：卡片区和变更清单一起按下去，只留标题这一行 */
  .out-block.packed .out-body { display: none; }
  .out-hd.out-main { margin-bottom: 6px; color: var(--wb-text-2); }
  .out-hd.out-more { margin: 2px 0 0; padding: 3px 8px; border-radius: var(--radius-md); }
  .out-hd.out-more:hover { background: var(--wb-bg-hover); }
  .out-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .out-grid:empty { display: none; }
  /* 变更清单：紧凑行，不是一堆方框卡片 */
  .out-list { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .out-row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: var(--radius-md); font-size: 13px; color: var(--wb-text-2); cursor: pointer; }
  .out-row:hover { background: var(--wb-bg-hover); }
  /* 目录省略、文件名保全：一行放不下时先吃掉前面的目录，文件名是用来认东西的那半截 */
  .out-row .nm { flex: 1; min-width: 0; display: flex; align-items: baseline; overflow: hidden; white-space: nowrap; }
  .out-row .nm .dim { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .out-row .nm .bs { flex: 0 0 auto; overflow: hidden; text-overflow: ellipsis; }
  .out-row.hid, .out-row.carded { display: none; }
  /* PROGRESS.md 这类过程账本：压暗、缩一号，排在真正的产出后面 */
  .out-row.sub { font-size: 12px; opacity: .68; }
  .out-row .sz { color: var(--wb-text-3); flex: none; }
  .out-row .dl { color: var(--wb-text-3); text-decoration: none; padding: 0 2px; flex: none; }
  .out-row .dl:hover { color: var(--wb-brand-text); }
  /* 中途造出来又被删掉的文件：行留着（发生过就是发生过），但删掉线 + 摘掉入口，点了不会 404 */
  .out-row.gone { cursor: default; opacity: .55; }
  .out-row.gone:hover { background: transparent; }
  .out-row.gone .nm { text-decoration: line-through; }
  /* 产出 chip：一行一件，小缩略图/文件图标 + 名字 + 大小 + 三个图标钮。
     以前是 240px 大卡内嵌 iframe 缩略图：一回合出三个网页就在对话里跑三个小浏览器，又慢又挡正文 */
  .out-card { position: relative; display: flex; flex-direction: column; width: 168px; padding: 0; overflow: hidden; border: 1px solid var(--wb-border); border-radius: var(--radius-xl); background: var(--wb-bg); cursor: pointer; box-sizing: border-box; transition: border-color var(--wb-t-fast) var(--wb-ease), background var(--wb-t-fast) var(--wb-ease); }
  .out-card:hover, .out-card:focus-visible { border-color: var(--wb-brand-text); background: var(--wb-brand-weak); outline: none; }
  .out-thumb { position: relative; width: 100%; height: 92px; flex: none; background: var(--wb-bg-side); border-bottom: 1px solid var(--wb-border); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .out-thumb img, .out-thumb video { width: 100%; height: 100%; object-fit: cover; }
  .out-thumb video { background: #000; }
  /* 视频缩略图上那枚播放标：纯 CSS 一个圆加一个三角，不占图标也不用 emoji */
  .out-thumb .vd-play { position: absolute; width: 28px; height: 28px; border-radius: 50%; background: rgba(0, 0, 0, .52); box-shadow: 0 0 0 1px rgba(255, 255, 255, .35); pointer-events: none; }
  .out-thumb .vd-play::after { content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-40%, -50%); border-style: solid; border-width: 5px 0 5px 8px; border-color: transparent transparent transparent #fff; }
  .out-card.thumb-dead .vd-play { display: none; }
  .out-thumb .ph { font-size: 30px; line-height: 1; }
  /* 缩略图读不出来时退回的那张卡：图标淡一点，别假装自己是张图 */
  .out-card.thumb-dead .out-thumb { background: var(--wb-bg-hover); }
  .out-card.thumb-dead .ph { opacity: .55; }
  .out-info { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0; padding: 7px 9px 0; }
  .out-name { font-size: 13px; font-weight: 500; color: var(--wb-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  /* 两件产出重名时才会出现的目录前缀：压暗，别抢文件名 */
  .out-name .dim { color: var(--wb-text-3); font-weight: 400; }
  .out-meta { font-size: 12px; color: var(--wb-text-3); white-space: nowrap; }
  .out-acts { display: flex; gap: 2px; flex: none; margin-top: auto; padding: 3px 5px 5px 6px; }
  /* 回复底部操作条（复制/评价/重新生成 + 消耗/模型，仿官方） */
  .turn-actions { display: flex; align-items: center; gap: 2px; margin-top: 10px; }
  .ta-btn { border: none; background: none; cursor: pointer; font-size: 14px; color: var(--wb-text-3); padding: 4px 7px; border-radius: var(--radius-sm); line-height: 1; }
  .ta-btn:hover { background: var(--wb-bg-hover); color: var(--wb-text); }
  .ta-btn.on { color: var(--wb-brand-text); }
  .ta-meta { margin-left: auto; font-size: 13px; color: var(--wb-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fb-note { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .fb-note input { flex: 1; min-width: 0; height: 30px; padding: 0 10px; font-size: 13px; color: var(--wb-text); background: var(--wb-bg-side); border: 1px solid var(--wb-border); border-radius: var(--radius-md); outline: none; }
  .fb-note input:focus { border-color: var(--wb-brand-text); }
  .fb-note button { height: 30px; padding: 0 12px; font-size: 13px; color: #fff; background: var(--wb-brand); border: none; border-radius: var(--radius-md); cursor: pointer; }
  .fb-thanks { font-size: 13px; color: var(--wb-text-3); }
  /* 本地助理主视图消息行 */
  .im-row { display: flex; gap: 8px; margin: 2px 0; }
  .im-row.out { justify-content: flex-end; }
  .im-row .im-ava { width: 26px; height: 26px; border-radius: var(--radius-md); background: var(--wb-bg-hover); display: flex; align-items: center; justify-content: center; font-size: 15px; flex: none; }
  .assist-page .im-feed { max-height: none; overflow: visible; }
  .im-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .im-head .btn-plain { flex: none; font-size: 13px; padding: 6px 12px; }
  .im-head .picker { flex: none; }
  #ab-ic .ab-ava { width: 18px; height: 18px; font-size: 15px; vertical-align: -4px; }
  #ab-ic .ab-ava img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--radius-sm); }
  /* 侧栏项目列表 */
  .proj-item { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: var(--radius-md); font-size: 14px; color: var(--wb-text-2); cursor: pointer; }
  .proj-item:hover { background: var(--wb-bg-hover); }
  .proj-item.active { background: var(--wb-brand-weak); color: var(--wb-text); font-weight: 600; box-shadow: inset 3px 0 0 var(--wb-brand); }
  .proj-item .pn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj-item .del { visibility: hidden; color: var(--wb-text-3); padding: 0 2px; }
  .proj-item:hover .del { visibility: visible; }
  .proj-item .del:hover { color: var(--wb-err-text); }
  .im-row .m { font-size: 12px; color: var(--wb-text-3); margin-bottom: 2px; }
  #send.stop { background: var(--wb-err); font-size: 12px; }
  .hist-item { display: flex; align-items: center; gap: 4px; }
  .hist-item .ht { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-item .hrun { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: var(--wb-brand); animation: hrun-pulse 1.2s ease-in-out infinite; }
  @keyframes hrun-pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .hist-item .hx { visibility: hidden; color: var(--wb-text-3); padding: 0 3px; border-radius: var(--radius-xs); flex: none; }
  .hist-item:hover .hx { visibility: visible; }
  .hist-item .hx:hover { color: var(--wb-err-text); }
  .hist-item .hx .i { width: 13px; height: 13px; display: block; }
  /* 工程线顶上那一撮：这台机器的终端此刻正在跑的活儿，跟存下来的历史分开列 */
  .hist-group { padding: 6px 10px 3px; font-size: 11px; font-weight: 600; letter-spacing: .02em; color: var(--wb-text-3); }
  /* 空态要能换行：它写的是「在终端里跑 wb 你的活儿」，一句话比一行宽 */
  .hist-empty { font-size: 12px; line-height: 1.7; color: var(--wb-text-3); padding: 6px 10px; white-space: normal; }
  .hist-empty code { font-family: var(--font-mono); font-size: 11px; background: var(--wb-bg-hover); border-radius: var(--radius-xs); padding: 1px 5px; }
  .lib-cols { display: flex; gap: 16px; align-items: flex-start; }
  .lib-cols > div { flex: 1; min-width: 0; }
  .lib-row { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--wb-border); border-radius: var(--radius-md); margin-bottom: 6px; font-size: 14px; }
  .lib-row .ln { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lib-row .lm { color: var(--wb-text-3); font-size: 12px; flex: none; }
  .lib-note { border: 1px solid var(--wb-border); border-radius: var(--radius-md); padding: 8px 10px; margin-bottom: 6px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .lib-note .lm { color: var(--wb-text-3); font-size: 12px; margin-top: 4px; display: flex; gap: 10px; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--wb-brand-weak); border-top-color: var(--wb-brand-text); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* ---------- 输入区（仿官方：大卡片 + 底部工具行 + 卡片下快捷栏） ---------- */
  .input-wrap { padding: 8px 20px 14px; }
  .input-inner { max-width: var(--wb-content-w); margin: 0 auto; }
  .input-card { border: 1.5px solid var(--wb-border); border-radius: var(--radius-2xl); background: var(--wb-bg); padding: 14px 16px 10px; box-shadow: var(--shadow-menu); transition: border-color var(--wb-t-fast) var(--wb-ease); }
  .input-card:focus-within { border-color: var(--wb-brand-text); }
  textarea#input { width: 100%; border: none; outline: none; resize: none; max-height: 160px; background: transparent; color: var(--wb-text); }
  textarea#input::placeholder { color: var(--wb-text-3); }
  .card-toolbar { display: flex; align-items: center; margin-top: 8px; gap: 8px; }
  .icon-btn { width: 32px; height: 32px; border: none; background: transparent; border-radius: var(--radius-md); font-size: 18px; color: var(--wb-text-2); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .icon-btn:hover { background: var(--wb-bg-hover); }
  /* chip 里的「前移 / 移除」：外面那颗 32 见方的通用图标键会把 chip 整个撑开 */
  .chip .icon-btn { width: 18px; height: 18px; flex: none; }
  .opendir .i { width: 13px; height: 13px; display: block; }
  .mcp-docs-link .i { width: 12px; height: 12px; vertical-align: -.16em; margin-left: 2px; }
  .card-toolbar .grow { flex: 1; }
  .picker { position: relative; }
  .picker-btn { display: flex; align-items: center; gap: 5px; border: none; background: transparent; border-radius: var(--radius-md); padding: 6px 10px; font-size: 14px; color: var(--wb-text-2); cursor: pointer; }
  .picker-btn:hover { background: var(--wb-bg-hover); }
  .picker-menu { display: none; position: absolute; bottom: 40px; right: 0; min-width: 200px; background: var(--wb-bg); border: 1px solid var(--wb-border); border-radius: var(--radius-xl); box-shadow: var(--shadow-menu); padding: 6px; z-index: 30; }
  .picker-menu.up-left { right: auto; left: 0; }
  /* 默认那套是给输入框用的（菜单往上弹）；顶栏里的按钮得往下弹，不然掀到窗口外面去了 */
  .picker-menu.down { top: 36px; bottom: auto; max-height: 60vh; overflow-y: auto; }
  .picker-menu.show { display: block; }
  .picker-menu .mi { padding: 8px 12px; border-radius: var(--radius-md); font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .picker-menu .mi:hover { background: var(--wb-bg-hover); }
  .picker-menu .mi.on { color: var(--wb-brand-text); background: var(--wb-brand-weak); }
  .picker-menu .mi .sub { font-size: 12px; color: var(--wb-text-3); }
  /* 只读项：多人服务器上普通成员看到的档位菜单——照样告诉他现在是哪档，但别装成能点的 */
  .picker-menu .mi.ro { cursor: default; }
  .picker-menu .mi.ro:hover { background: transparent; }
  .picker-menu .mi.ro[data-cur] { color: var(--wb-brand-text); }
  .picker-menu .mi.sub-only { display: block; white-space: normal; font-size: 12px; color: var(--wb-text-3); border-top: 1px solid var(--wb-border); margin-top: 4px; padding-top: 8px; }
  /* 兜底：任何一条菜单项都不许把菜单撑出屏幕。以前没有上限，一段长说明就能把它撑到
     一千多像素宽，右对齐的菜单于是往左飞出可视区，字被裁掉一半 */
  .picker-menu { max-width: min(340px, calc(100vw - 24px)); }
  .picker-menu .mi > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  /* 本机 CLI 在跑时：这张卡回答的是「谁在跑、花不花钱、去哪儿改」，不是一排可选项 */
  .picker-menu.eng { width: 272px; }
  .picker-menu.eng .ep-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: var(--radius-md); background: var(--wb-brand-weak); color: var(--wb-brand-text); }
  .picker-menu.eng .ep-ic { font-size: 16px; line-height: 1; }
  .picker-menu.eng .ep-name { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; }
  .picker-menu.eng .ep-model { display: block; font-weight: 400; font-size: 12px; color: var(--wb-text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .picker-menu.eng .ep-on { color: var(--wb-ok-text); font-size: 13px; }
  .picker-menu.eng .ep-why { padding: 8px 10px 4px; font-size: 12px; line-height: 1.6; color: var(--wb-text-3); white-space: normal; }
  .picker-menu.eng .ep-free { display: inline-block; margin-right: 6px; padding: 1px 6px; border-radius: var(--radius-sm); background: color-mix(in srgb, var(--success) 14%, transparent); color: var(--wb-ok-text); font-size: 11.5px; font-weight: 600; }
  .picker-menu.eng .ep-act { margin-top: 4px; border-top: 1px solid var(--wb-border); border-radius: 0 0 var(--radius-md) var(--radius-md); color: var(--wb-text-2); }
  /* 「这趟活谁在跑」的常驻小牌子：一行、低调、不抢正文，但一直在 */
  .run-eng { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; margin: 0 0 8px; padding: 3px 10px 3px 6px; border: 1px solid var(--wb-border); border-radius: var(--radius-full); background: var(--wb-bg-side); font-size: 12px; color: var(--wb-text-2); }
  .run-eng .re-ic { font-size: 13px; line-height: 1; }
  .run-eng .re-name { font-weight: 600; color: var(--wb-text); }
  .run-eng .re-sub { color: var(--wb-text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 冷启动那几秒：同一枚牌子，🖥 换成转圈。init 一到原地换回来，位置和尺寸都不动 */

  /* 左右两栏拖着改宽：抓边上那条 7px 的缝，双击回默认，←/→ 也能推。
     宽度写在 :root 的变量里（JS 存 localStorage），CSS 里的默认值就是没拖过时的样子。
     拖的时候把 width 过渡关掉，否则手在动、栏在追，跟手感全没了 */
  .rsz { position: absolute; top: 0; bottom: 0; width: 7px; z-index: 6; cursor: col-resize; touch-action: none; }
  .rsz.r { right: -4px; }
  .rsz.l { left: 0; }
  .rsz::after { content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 1px; background: transparent; transition: background var(--wb-t-fast) var(--wb-ease); }
  .rsz:hover::after, .rsz:focus-visible::after, .rsz.on::after { background: var(--wb-brand); }
  .rsz:focus-visible { outline: none; }
  body.rsz-on { cursor: col-resize; user-select: none; }
  body.rsz-on aside, body.rsz-on .preview-panel, body.rsz-on .files-panel { transition: none; }

  .sc-kbd { background: var(--wb-bg-hover); border: 1px solid var(--wb-border); border-radius: var(--radius-sm); padding: 3px 10px; font-size: 13px; font-family: inherit; min-width: 52px; text-align: center; display: inline-block; }

  /* 审批条：任务停在这儿等人点头，是整屏最该被一眼看到的东西，可它原来是全站最不显眼的一块——
     底色和边框都写死成浅橙（#fff7ed / #fdba74），那根边框压在页面底上只有 1.56:1，
     等于没画；写死的另一个后果是深浅两套皮各写一遍，改一处忘一处。
     现在整块跟着 --wb-warn 走：底色是它 10% 的淡染，边框直接用原色，压页面底 3.92 / 7.96:1，

  .ap-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap;

  /* 三个按钮的盒子尺寸必须一模一样，不然一行里高低差 1px，谁都说不出哪里别扭。
     主按钮不需要边框，但得占同样的 1px，所以给一圈透明的 */
  .ap-row .ap-ok { background: var(--wb-brand); color: #fff; border: 1px solid transparent; }
  /* 两个次要按钮原来用的是 --wb-bg-hover + --wb-border，这两档是照着页面底算出来的冷灰，
     摆到暖橙的条上既跳色又几乎没有边（按钮底压条底 1.07:1，「拒绝」干脆连边框都没有，

  /* ---------- 输入框 @文件 //技能 token 高亮（镜像层） ---------- */

  /* 镜像层和 textarea 必须共用同一套字号 / 行高 / 折行规则，而且都得是 var，不能写死。
     写死 15px 的后果：设置里把字号调到 16 或 18，只有 textarea 跟着变，底色停在旧尺寸上，
