<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenWorkBuddy</title>
<link rel="icon" href="/icon.png">
<link rel="stylesheet" href="/css/ui.css">
<style>
  :root {
    /* --wb-* 一律指向 ui.css 里的 shadcn 令牌。老名字留着是为了不动那八百行既有样式，
       但值只有一处（ui.css），改主题不用两边同步，也就不会两边各说各的。 */
    --wb-brand: var(--primary); --wb-brand-weak: var(--ring-weak); --wb-brand-grad: linear-gradient(135deg,#5b5ff7,#8b5cf6);
    --wb-bg: var(--background); --wb-bg-side: var(--muted); --wb-bg-hover: var(--accent);
    --wb-border: var(--border); --wb-text: var(--foreground); --wb-text-2: var(--muted-foreground); --wb-text-3: var(--subtle-foreground);
    --wb-ok: var(--success); --wb-err: var(--destructive);
    /* 填充色和文字色得分开：同一个紫/红，当背景够用，当文字在浅底上不够。见 ui.css 的 --brand-text/--danger-text */
    --wb-brand-text: var(--brand-text); --wb-err-text: var(--danger-text); --wb-ok-text: var(--success-text);
    /* 底色被写死成白的那几处（比如 IM 气泡里的选中态），字色也不能跟着主题走 */
    --wb-brand-on-white: #5155e8;
    --wb-content-w: 832px; --wb-code-bg: #16181f; --wb-code-text: #d5dcec;
    /* 这四个一直被 JS 里的内联样式引用，却从来没人定义过——评测页、运行记录页的边框和卡片底色
       就这么一路空着（跟之前「生成的网页黑底黑字」是同一类毛病）。补上，并同样接到令牌上 */
    --wb-line: var(--border); --wb-card: var(--card); --wb-warn: var(--warning); --mono: var(--font-mono);
    /* 给模型画的内联 SVG 信息图用的一套语义色/字体变量。图里写 var(--color-text-primary)
       而不是写死 #333，暗色模式下才不会变成黑底黑字。名字沿用通行叫法，模型不用学新词。 */
    --color-text-primary: #2c2c2a; --color-text-secondary: #5f5e5a; --color-text-tertiary: #888780;
    --color-border-primary: #b4b2a9; --color-border-secondary: #d3d1c7; --color-border-tertiary: #e4e2da;
    --color-bg-subtle: #f7f8fa;
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  /* ---------- 外观偏好：app-02.js 的 applyLook() 把选择写到 根元素 html 的 data-fs / data-skin / data-font / data-density 属性 ----------
     字号只改一个 --wb-fs：正文、输入框、标题、行内代码、左栏历史都按 calc 跟着走，四档之间比例不变 */
  :root { --wb-fs: 15px; }
  html[data-fs="s"] { --wb-fs: 14px; }
  html[data-fs="l"] { --wb-fs: 16px; }
  html[data-fs="xl"] { --wb-fs: 18px; }
  html[data-font="serif"] { --font-sans: Georgia, "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", SimSun, serif; }
  html[data-font="mono"] { --font-sans: var(--font-mono); }
  /* 皮肤：只换品牌色那一组令牌，版式一点不动。字色单独给（浅底要深、暗底要亮），别拿填充色当字色——
     每套在浅/暗两个主题下的 --brand-text 对比度都有测试盯着（≥4.5），白字压 --primary 也要 ≥3 */
  html[data-skin="ocean"] { --primary: #0284c7; --ring: #0284c7; --ring-weak: #e0f2fe; --brand-text: #0369a1; --wb-brand-on-white: #0369a1; --wb-brand-grad: linear-gradient(135deg,#0284c7,#06b6d4); }
  html[data-theme="dark"][data-skin="ocean"] { --ring: #38bdf8; --ring-weak: #0c2a3d; --brand-text: #7dd3fc; }
  html[data-skin="forest"] { --primary: #059669; --ring: #059669; --ring-weak: #d1fae5; --brand-text: #047857; --wb-brand-on-white: #047857; --wb-brand-grad: linear-gradient(135deg,#059669,#14b8a6); }
  html[data-theme="dark"][data-skin="forest"] { --ring: #34d399; --ring-weak: #0b2e24; --brand-text: #6ee7b7; }
  html[data-skin="sunset"] { --primary: #ea580c; --ring: #ea580c; --ring-weak: #ffedd5; --brand-text: #c2410c; --wb-brand-on-white: #c2410c; --wb-brand-grad: linear-gradient(135deg,#ea580c,#f59e0b); }
  html[data-theme="dark"][data-skin="sunset"] { --ring: #fb923c; --ring-weak: #3a2410; --brand-text: #fdba74; }
  html[data-skin="rose"] { --primary: #e11d48; --ring: #e11d48; --ring-weak: #ffe4e6; --brand-text: #be123c; --wb-brand-on-white: #be123c; --wb-brand-grad: linear-gradient(135deg,#e11d48,#ec4899); }
  html[data-theme="dark"][data-skin="rose"] { --ring: #fb7185; --ring-weak: #3d1520; --brand-text: #fda4af; }
  html[data-skin="graphite"] { --primary: #4b5563; --ring: #4b5563; --ring-weak: #e5e7eb; --brand-text: #1f2937; --wb-brand-on-white: #1f2937; --wb-brand-grad: linear-gradient(135deg,#4b5563,#6b7280); }
  html[data-theme="dark"][data-skin="graphite"] { --primary: #6b7280; --ring: #9ca3af; --ring-weak: #2b2d34; --brand-text: #d1d5db; }
  /* 密度：紧凑只收间距和行高，不动字号 */
  html[data-density="compact"] .turn { margin-bottom: 12px; }
  html[data-density="compact"] .a-msg { margin-top: 8px; }
  html[data-density="compact"] .a-text { line-height: 1.55; }
  html[data-density="compact"] .u-msg .bubble { padding: 7px 12px; line-height: 1.5; }
  html[data-density="compact"] .hist-item { padding: 5px 10px; }
  html[data-density="compact"] .card-item { padding: 8px 12px; margin-bottom: 6px; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    /* -apple-system 排在 PingFang 前面：这样拉丁字母走 SF（苹果自己的界面字），
       中文再落回 PingFang——同一句中英混排，各拿各最合适的那套。
       反过来写（PingFang 在前）拉丁字母会用 PingFang 自带的西文，字重和字距都偏「网页」。 */
    font-family: var(--font-sans);
    background: var(--wb-bg); color: var(--wb-text); display: flex; overflow: hidden; font-size: var(--wb-fs);
  }
  input, select, textarea, button { font-family: inherit; }
  /* ---------- 左侧导航 ---------- */
  aside { position: relative; width: var(--wb-side-w, 250px); flex-shrink: 0; background: var(--wb-bg-side); border-right: 1px solid var(--wb-border); display: flex; flex-direction: column; padding: 14px 10px; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 14px; }
  .brand .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--wb-brand-grad); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
  .brand .name { font-size: 15px; font-weight: 600; }
  .brand .tag { font-size: 11px; color: var(--wb-text-2); }
  /* 里程碑时间线卡片（长跑可见性）：过程区里原地刷新的 PROGRESS.md 打勾清单 */
  .ms-card { margin: 6px 0; padding: 8px 10px; border: 1px solid var(--wb-border); border-radius: 8px; font-size: 13px; }
  .ms-card .ms-head { font-weight: 600; margin-bottom: 4px; }
  .ms-card .ms-file { color: var(--wb-text-3); font-weight: 400; font-size: 12px; }
  .ms-card .ms-item { padding: 1px 0; color: var(--wb-text-2); }
  .ms-card .ms-item.done { color: var(--wb-text-3); }
  #new-task { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 0 4px 14px; padding: 9px; border: none; border-radius: 10px; background: var(--wb-brand-grad); color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; }
  .ab-head { display: flex; align-items: center; justify-content: space-between; font-size: 13px; font-weight: 600; padding: 2px 4px 6px; cursor: pointer; user-select: none; }
  .ab-head .ab-sub { font-weight: 400; font-size: 12px; color: var(--wb-text-3); }
  .ab-ch { display: flex; align-items: center; gap: 6px; padding: 5px 4px; border-radius: 6px; font-size: 13px; cursor: pointer; }
  .ab-ch:hover { background: var(--wb-bg-hover); }
  .ab-ch .st { margin-left: auto; font-size: 12px; color: var(--wb-text-3); }
  .ab-ch .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--wb-text-3); flex: none; }
  .ab-ch .dot.ok { background: var(--wb-ok); }
  .ab-ch .dot.err { background: var(--wb-err); }
  .ab-empty { font-size: 12px; color: var(--wb-text-3); padding: 4px; }
  .im-strip { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 10px; border: 1px solid var(--wb-border); border-radius: 10px; font-size: 14px; margin-bottom: 12px; }
  .im-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; color: var(--wb-text-2); }
  .im-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--wb-text-3); }
  .im-chip .dot.ok { background: var(--wb-ok); }
  .im-chip .dot.err { background: var(--wb-err); }
  .im-feed { display: flex; flex-direction: column; gap: 8px; max-height: 55vh; overflow-y: auto; padding: 4px 2px; }
  .im-b { max-width: 76%; padding: 8px 12px; border-radius: 10px; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .im-b.in { align-self: flex-start; background: var(--wb-bg-hover); }
  .im-b.out { align-self: flex-end; background: var(--wb-brand-weak); }
  .im-b.error { align-self: center; color: var(--wb-err-text); font-size: 13px; background: none; }
  .im-b .m { font-size: 12px; color: var(--wb-text-3); margin-bottom: 2px; }
  .side-label { font-size: 12px; color: var(--wb-text-3); padding: 4px 10px 6px; }
  #history { flex: 1; overflow-y: auto; min-height: 0; }
  .hist-item { padding: 8px 10px; border-radius: 8px; font-size: calc(var(--wb-fs) - 1px); color: var(--wb-text-2); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist-item:hover { background: var(--wb-bg-hover); }
  /* 这几类行是 div，补了 tabindex 才能 Tab 到；浏览器不给 div 画默认焦点圈，得自己画。
     用 outline 不用 box-shadow：选中态的左侧指示条正占着 box-shadow。 */
  .hist-item:focus-visible, .proj-item:focus-visible, .side-nav .item:focus-visible,
  .out-card:focus-visible, .proc-head:focus-visible, .out-more:focus-visible, .out-main:focus-visible,
  .src-hd:focus-visible, .user-chip:focus-visible {
    outline: 2px solid var(--wb-brand); outline-offset: -2px;
  }
  /* 选中态不拿品牌色当文字：品牌紫压在自己的浅紫底上只有 4.86:1，比同一列表里
     未选中项的 5.75:1 还低——当前项成了整列最不清楚的一行，层级是反的。
     改成 shadcn sidebar 的做法：文字用 accent-foreground（最重），品牌色退回去
     当左侧指示条（填充色的正确用法），选中与 hover 靠指示条区分，不靠色相。 */
  .hist-item.active { background: var(--wb-brand-weak); color: var(--wb-text); font-weight: 600; box-shadow: inset 3px 0 0 var(--wb-brand); }
  .side-nav { border-top: 1px solid var(--wb-border); padding-top: 8px; margin-top: 8px; }
  /* 主导航挪到「项目」下面，跟任务历史之间用一条线隔开（历史是列表，导航是入口，别混在一起） */
  .side-nav.top { border-top: none; border-bottom: 1px solid var(--wb-border); padding: 0 0 8px; margin: 6px 0 8px; }
  .side-nav .item { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 8px; font-size: 14px; color: var(--wb-text-2); cursor: pointer; }
  .side-nav .item:hover { background: var(--wb-bg-hover); color: var(--wb-text); }
  .side-nav .item.active { background: var(--wb-brand-weak); color: var(--wb-text); font-weight: 600; box-shadow: inset 3px 0 0 var(--wb-brand); }
  /* 官方 WorkBuddy 的侧栏项是两行：主标题 + 灰色副标题（专家/技能·连接器、自动化/定时任务、更多/资料库·灵感） */
  .side-nav .item .tx { display: flex; flex-direction: column; line-height: 1.35; min-width: 0; }
  .side-nav .item .tx .sub { font-size: 12px; color: var(--wb-text-3); font-weight: 400; }
  .side-nav .item.active .tx .sub { color: var(--wb-brand-text); opacity: .82; }
  .side-nav .more-toggle { justify-content: space-between; color: var(--wb-text-3); }
  .side-nav .more-toggle .caret { margin-left: auto; }
  /* 项目表头：点整行进项目页，点 ＋ 快速新建 */
  .side-nav .nav-head { cursor: pointer; }
  .side-nav .nav-head #proj-add { margin-left: auto; text-decoration: none; color: var(--wb-text-3); font-size: 15px; padding: 0 4px; border-radius: 6px; }
  .side-nav .nav-head #proj-add:hover { background: var(--wb-bg-hover); color: var(--wb-text); }
  .side-nav #proj-list { margin: 0 0 4px; }
  .side-nav .more-toggle .caret { font-size: 11px; transition: transform var(--wb-t-fast) var(--wb-ease); }
  .side-nav .more-toggle.open .caret { transform: rotate(180deg); }
  .more-box { display: none; padding-left: 8px; }
  .more-box.open { display: block; }
  /* ---------- 主区域 ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { height: 56px; flex: 0 0 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--wb-border); }
  .topbar .title { font-size: 15px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar .right { display: flex; align-items: center; gap: 10px; }
  #toggle-files { border: 1px solid var(--wb-border); background: var(--wb-bg); border-radius: 8px; padding: 5px 12px; font-size: 13px; color: var(--wb-text-2); cursor: pointer; position: relative; }
  /* 「成果文件」角标：这回合来了几件还没看过的新产出。面板一开就摘掉 */
  #toggle-files .fb-badge { position: absolute; top: -7px; right: -7px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--wb-brand); color: #fff; font-size: 11px; font-weight: 600; line-height: 18px; text-align: center; box-sizing: border-box; }
  #chat-scroll { flex: 1; overflow-y: auto; min-height: 0; scrollbar-gutter: stable both-edges; }
  #to-bottom { position: absolute; right: 24px; bottom: 150px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--wb-border); background: var(--wb-bg); color: var(--wb-text-2); font-size: 15px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.12); display: none; z-index: 5; }
  #to-bottom.show { display: block; }
  #to-bottom:hover { color: var(--wb-brand-text); border-color: var(--wb-brand-text); }
  /* 长对话滚动引导：往上翻远了出「回到最前」；人在上面时下面来了新内容，「回到最新」挂红点 */
  #to-top { position: absolute; right: 24px; bottom: 190px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--wb-border); background: var(--wb-bg); color: var(--wb-text-2); font-size: 15px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.12); display: none; z-index: 5; }
  #to-top.show { display: flex; align-items: center; justify-content: center; }
  #to-top:hover { color: var(--wb-brand-text); border-color: var(--wb-brand-text); }
  #to-bottom.new::after { content: ""; position: absolute; top: -3px; right: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--destructive, #e5484d); border: 2px solid var(--wb-bg); }
  /* 列宽要把自己的左右内边距算进去，才能和输入卡片落在同一条竖线上：
     卡片是 832px 整块（428–1260），消息列如果也只有 832px，减掉 20px 内边距后
     内容只剩 448–1240，两端各内缩 20px——头像和用户气泡的边就都对不上卡片的边。 */
  .chat-col { max-width: calc(var(--wb-content-w) + 40px); margin: 0 auto; padding: 24px 20px 12px; }
  /* 广场类页面（专家/技能/连接器、模板库）是卡片网格，832px 的阅读宽度会挤成一列 */
  .chat-col.wide-page { max-width: 1160px; }
  .empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 10vh; }
  .empty h1 { font-size: 34px; font-weight: 700; margin-bottom: 24px; letter-spacing: 1px; }
  .scene-tabs { display: flex; flex-wrap: wrap; justify-content: center; background: var(--wb-bg-side); border-radius: 26px; padding: 4px; gap: 2px; margin-bottom: 34px; }
  .scene-tabs button { border: none; background: transparent; border-radius: 22px; padding: 9px 20px; font-size: 15px; color: var(--wb-text-2); cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .scene-tabs button.active { background: #17181c; color: #fff; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 720px; }
  .chips button { padding: 9px 18px; border-radius: 22px; border: 1px solid var(--wb-border); background: var(--wb-bg); font-size: 14px; color: var(--wb-text); cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .chips button:hover { border-color: var(--wb-brand-text); color: var(--wb-brand-text); background: var(--wb-brand-weak); }
  .scene-tag { display: inline-flex; align-items: center; gap: 6px; background: #d7f5e9; color: #0f8a5f; font-size: 13px; border-radius: 14px; padding: 4px 12px; margin-bottom: 6px; }
  .scene-tag b { cursor: pointer; font-weight: 400; opacity: .7; }
  /* @ / 自动补全菜单 */
  .mention-menu { display: none; position: absolute; bottom: 100%; left: 12px; margin-bottom: 8px; min-width: 260px; max-width: 420px; max-height: 260px; overflow-y: auto; background: var(--wb-bg); border: 1px solid var(--wb-border); border-radius: 12px; box-shadow: 0 10px 32px rgba(23,24,28,.16); padding: 6px; z-index: 40; }
  .mention-menu.show { display: block; }
  .mention-menu .mi { padding: 8px 12px; border-radius: 8px; font-size: 14px; cursor: pointer; }
  .mention-menu .mi:hover, .mention-menu .mi.sel { background: var(--wb-bg-hover); }
  .mention-menu .mi .sub { font-size: 12px; color: var(--wb-text-3); display: block; }
  .mention-menu .mh { font-size: 12px; color: var(--wb-text-3); padding: 4px 12px; }
  .turn { margin-bottom: 22px; }
  .u-msg { display: flex; justify-content: flex-end; }
  .u-msg .bubble { max-width: 78%; background: var(--wb-brand); color: #fff; border-radius: 14px 14px 3px 14px; padding: 10px 15px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .u-msg .bubble .bubble-attach { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .u-msg .bubble .bubble-attach span { font-size: 12px; background: rgba(255,255,255,.18); border-radius: 7px; padding: 2px 8px; white-space: nowrap; }
  .a-msg { display: flex; gap: 10px; margin-top: 16px; }
  .a-msg .avatar { width: 28px; height: 28px; flex-shrink: 0; border-radius: 9px; background: var(--wb-brand-grad); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; }
  .a-msg .body { min-width: 0; flex: 1; }
  /* 头像可以是首字母、emoji 或用户传的图。传了图就让图铺满整块，底下的品牌渐变自然被盖住；
     emoji 则换成中性底，不然彩色 emoji 压在紫色渐变上很脏。 */
  img.ava-img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }
  .emo { background: var(--wb-bg-hover) !important; }
  /* 内置猫标（avatar="@cat"）。跟 emoji 不同，它本来就是白+粉+深灰的三色标，
     压在品牌渐变上正好，所以不换中性底——那样反而糊成一坨。
     82% 是留给圆形容器的：标的外接框是正方形，铺满 100% 耳朵尖会被圆切掉——
     实测（把 symbol 画进 canvas 数落在内切圆外的不透明像素）：100% 时 22/32/52px 三档
     分别有 12.4%/8.4%/5.3% 的像素出界，最远超出 3.8px；82% 时三档都是 0。 */
  .ava-mk { width: 82%; height: 82%; display: block; }
  .im-row .im-ava.mk, .ab-ava.mk { background: var(--wb-brand-grad) !important; }
  .ava-pick.mk { display: inline-flex; align-items: center; justify-content: center; width: 25px; height: 25px;
                 padding: 0; margin: 4px 5px; border-radius: 7px; background: var(--wb-brand-grad); vertical-align: middle; }
  .brand .mark.emo, .a-msg .avatar.emo, .user-chip .ava.emo, .um-head .ava.emo { font-size: 15px; }
  .ab-ava { width: 17px; height: 17px; border-radius: 5px; display: inline-flex; align-items: center; justify-content: center; overflow: hidden; vertical-align: -4px; font-size: 14px; }
  .ab-ava.emo { background: none !important; }
  .ava-pick { cursor: pointer; font-size: 17px; line-height: 1; padding: 4px 5px; border-radius: 7px; border: 1px solid transparent; }
  .ava-pick:hover { background: var(--wb-bg-hover); border-color: var(--wb-border); }
  .a-text { line-height: 1.7; word-break: break-word; margin: 3px 0 6px; }
  .a-text p { margin: 6px 0; }
  .a-text h1, .a-text h2, .a-text h3, .a-text h4 { margin: 12px 0 6px; font-size: var(--wb-fs); }
  .a-text h1 { font-size: calc(var(--wb-fs) + 2px); }
  .a-text h2 { font-size: calc(var(--wb-fs) + 1px); }
  .a-text ul, .a-text ol { margin: 6px 0; padding-left: 22px; }
  .a-text li { margin: 3px 0; }
  /* markdown 里的图：不许撑破容器，也别顶到贴边 */
  .md-img { display: block; max-width: 100%; height: auto; margin: 10px 0; border-radius: 10px; border: 1px solid var(--wb-border); }
  .a-text blockquote { border-left: 3px solid var(--wb-brand); background: var(--wb-brand-weak); padding: 8px 12px; margin: 8px 0; border-radius: 0 8px 8px 0; color: var(--wb-text-2); }
  .a-text blockquote p { margin: 2px 0; }
  .a-text code { background: var(--wb-bg-hover); border-radius: 4px; padding: 1px 5px; font-size: calc(var(--wb-fs) - 2px); font-family: var(--font-mono); }
  .a-text pre { background: var(--wb-code-bg); color: var(--wb-code-text); border-radius: 8px; padding: 12px; overflow-x: auto; margin: 8px 0; }
  .a-text pre code { background: none; color: inherit; padding: 0; }
  /* ---------- 模型直接画在正文里的 SVG 信息图 ---------- */
  .svg-fig { margin: 12px 0; border: 1px solid var(--wb-border); border-radius: 12px; background: var(--wb-bg);
    overflow: hidden; position: relative; }
  .svg-fig > .svg-body { padding: 8px 10px; overflow-x: auto; }
  .svg-fig svg { display: block; max-width: 100%; height: auto; }
  .svg-fig .svg-acts { display: flex; gap: 6px; justify-content: flex-end; align-items: center;
    padding: 5px 8px; border-top: 1px solid var(--wb-border); background: var(--wb-bg-side); }
  .svg-fig .svg-acts button { font-size: 12px; color: var(--wb-text-2); background: none; border: 1px solid var(--wb-border);
    border-radius: 6px; padding: 3px 9px; cursor: pointer; }
  .svg-fig .svg-acts button:hover { background: var(--wb-bg-hover); color: var(--wb-text); }
  .svg-fig .svg-acts .growing { margin-right: auto; font-size: 12px; color: var(--wb-text-3); }
  .svg-fig .svg-acts .growing::after { content: "▍"; animation: svgblink 1s steps(2) infinite; }
  @keyframes svgblink { 50% { opacity: 0; } }
  .svg-fig .svg-raw { margin: 0; border-top: 1px solid var(--wb-border); border-radius: 0; max-height: 300px; font-size: 13px; }
  /* ---------- 来源 ---------- */
  .src-block { margin: 12px 0 4px; border-top: 1px solid var(--wb-border); padding-top: 8px; }
  .src-hd { font-size: 13px; color: var(--wb-text-2); margin-bottom: 6px; cursor: pointer; user-select: none; }
  .src-hd::before { content: "▸ "; }
  .src-block.open .src-hd::before { content: "▾ "; }
  .src-list { display: none; flex-wrap: wrap; gap: 6px; }
  .src-block.open .src-list { display: flex; }
  .src-item { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; font-size: 13px;
    color: var(--wb-text-2); text-decoration: none; background: var(--wb-bg-side);
    border: 1px solid var(--wb-border); border-radius: 999px; padding: 3px 10px; }
  .src-item:hover { background: var(--wb-bg-hover); color: var(--wb-text); }
  .src-item .n { color: var(--wb-text-3); font-variant-numeric: tabular-nums; }
  .src-item .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 320px; }
  .code-wrap { margin: 8px 0; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,.06); }
  .code-head { display: flex; justify-content: space-between; align-items: center; background: #23252e; color: #8b92a5; font-size: 12px; padding: 5px 12px; font-family: Consolas, ui-monospace, monospace; }
  .code-head .code-copy { cursor: pointer; color: #8b92a5; user-select: none; }
  .code-head .code-copy:hover { color: #fff; }
  .code-wrap pre { margin: 0; border-radius: 0; }
  .md-table-wrap { overflow-x: auto; margin: 8px 0; }
  .a-text table { border-collapse: collapse; font-size: 14px; min-width: 60%; }
  .a-text th, .a-text td { border: 1px solid var(--wb-border); padding: 5px 10px; text-align: left; }
  .a-text th { background: var(--wb-bg-hover); font-weight: 600; }
  .a-text hr { border: none; border-top: 1px solid var(--wb-border); margin: 10px 0; }
  .a-text a { color: var(--wb-brand-text); }
  .step-card { border: 1px solid var(--wb-border); border-radius: 10px; margin: 8px 0; overflow: hidden; background: #fbfcfe; }
  .step-card .head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; user-select: none; font-size: 14px; }
  .tag { font-size: 12px; padding: 2px 9px; border-radius: 10px; background: var(--wb-brand-weak); color: var(--wb-brand-text); white-space: nowrap; }
  /* 底色不能写死浅绿/浅红：深色主题下字色跟着令牌变亮，压在浅底上就成了白纸写黄字。
     改成 color-mix 叠在当前表面上，两套主题各自成立 */
  .tag.ok { background: color-mix(in srgb, var(--success) 14%, transparent); color: var(--wb-ok-text); }
  .tag.err { background: color-mix(in srgb, var(--destructive) 14%, transparent); color: var(--wb-err-text); }
  .step-card.failed { border-color: color-mix(in srgb, var(--destructive) 40%, var(--wb-border)); }
  .step-card .desc { color: var(--wb-text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .step-card pre { display: none; background: var(--wb-code-bg); color: var(--wb-code-text); padding: 12px; font-size: 13px; line-height: 1.5; max-height: 320px; overflow: auto; }
  .step-card.open pre { display: block; }
  /* 执行过程折叠条（仿官方「已完成 12s ›」） */
  .proc-wrap { margin: 2px 0 8px; }
  .proc-head { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--wb-text-3); cursor: pointer; user-select: none; padding: 2px 0; }
  .proc-head:hover { color: var(--wb-text-2); }
  .proc-head .arrow { font-size: 13px; display: inline-block; transition: transform var(--wb-t-fast) var(--wb-ease); }
  .proc-wrap.open .proc-head .arrow { transform: rotate(90deg); }
  .proc-warn { color: var(--wb-err-text); background: rgba(229,72,77,.12); border-radius: 6px; padding: 0 6px; font-size: 12px; }
  .proc-body { display: none; padding-left: 10px; border-left: 2px solid var(--wb-border); margin: 4px 0 4px 4px; }
  /* 轨迹条：折叠条上的工具徽章。跑着的亮蓝、栽了的标红、其余灰底不抢眼 */
  .proc-head .trail { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .proc-head .tc { font-size: 11px; line-height: 18px; padding: 0 7px; border-radius: 9px; background: var(--wb-bg-hover); color: var(--wb-text-3); white-space: nowrap; cursor: pointer; }
  .proc-head .tc b { font-weight: 600; margin-left: 2px; }
  .proc-head .tc:hover { color: var(--wb-text); }
  .proc-head .tc.run { color: var(--wb-brand-text); background: var(--wb-brand-weak); }
  .proc-head .tc.err { color: var(--wb-err-text); background: color-mix(in srgb, var(--destructive) 14%, transparent); }
  .proc-head .tc.abort { text-decoration: line-through; }
  .proc-head .tc.more { cursor: default; }
  /* 评测页的用户反馈汇总 */
  .ev-fb-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 0 0 10px; }
  .ev-fb-card { background: var(--wb-card); border: 1px solid var(--wb-line); border-radius: 10px; padding: 10px 12px; }
  .ev-fb-card .k { font-size: 12px; color: var(--wb-text-3); }
  .ev-fb-card .v { font-size: 20px; font-weight: 700; color: var(--wb-text); margin: 2px 0; }
  .ev-fb-card .s { font-size: 11px; color: var(--wb-text-3); }
  .ev-fb-empty { padding: 12px 14px; background: var(--wb-card); border: 1px dashed var(--wb-line); border-radius: 10px; line-height: 1.7; }
  .ev-fb-tab { width: 100%; border-collapse: collapse; font-size: 12px; margin: 0 0 8px; }
  .ev-fb-tab th, .ev-fb-tab td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--wb-line); }
  .ev-fb-tab th { color: var(--wb-text-3); font-weight: 500; }
  .ev-bar { display: inline-block; width: 60px; height: 6px; background: var(--wb-bg-hover); border-radius: 3px; margin-right: 6px; vertical-align: middle; overflow: hidden; }
  .ev-bar i { display: block; height: 100%; background: var(--success); }
  .ev-fb-down { display: grid; grid-template-columns: 76px 120px 1fr 1fr auto; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--wb-line); font-size: 12px; align-items: center; }
  .ev-fb-down .m, .ev-fb-down .task, .ev-fb-down .note { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ev-fb-down .note { color: var(--wb-text); }
  .ev-fb-down a { color: var(--wb-brand-text); text-decoration: none; white-space: nowrap; }
  .proc-wrap.open .proc-body { display: block; }
  .proc-body .a-text { color: var(--wb-text-2); font-size: 14px; }
  /* 本次产出：把成果文件直接摆在对话里，点开就看，不用去右侧文件面板翻 */
  .out-block { margin: 12px 0 4px; }
  .out-hd { font-size: 13px; color: var(--wb-text-3); margin-bottom: 8px; }
  .out-hd.out-main, .out-hd.out-more { cursor: pointer; user-select: none; display: flex; align-items: center; gap: 4px; }
  .out-hd.out-main:hover, .out-hd.out-more:hover { color: var(--wb-text-2); }
  /* 整块收起：卡片区和变更清单一起按下去，只留标题这一行 */
  .out-block.packed .out-body { display: none; }
  .out-hd.out-main { margin-bottom: 6px; color: var(--wb-text-2); }
  .out-hd.out-more { margin: 2px 0 0; padding: 3px 8px; border-radius: 8px; }
  .out-hd.out-more:hover { background: var(--wb-bg-hover); }
  .out-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .out-grid:empty { display: none; }
  /* 变更清单：紧凑行，不是一堆方框卡片 */
  .out-list { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
  .out-row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 8px; font-size: 13px; color: var(--wb-text-2); cursor: pointer; }
  .out-row:hover { background: var(--wb-bg-hover); }
  /* 目录省略、文件名保全：一行放不下时先吃掉前面的目录，文件名是用来认东西的那半截 */
  .out-row .nm { flex: 1; min-width: 0; display: flex; align-items: baseline; overflow: hidden; white-space: nowrap; }
  .out-row .nm .dim { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .out-row .nm .bs { flex: 0 0 auto; overflow: hidden; text-overflow: ellipsis; }
  .out-row.hid { display: none; }
  /* PROGRESS.md 这类过程账本：压暗、缩一号，排在真正的产出后面 */
  .out-row.sub { font-size: 12px; opacity: .68; }
  .out-row .sz { color: var(--wb-text-3); flex: none; }
  .out-row .dl { color: var(--wb-text-3); text-decoration: none; padding: 0 2px; flex: none; }
  .out-row .dl:hover { color: var(--wb-brand-text); }
  /* 中途造出来又被删掉的文件：行留着（发生过就是发生过），但删掉线 + 摘掉入口，点了不会 404 */
  .out-row.gone { cursor: default; opacity: .55; }
  .out-row.gone:hover { background: transparent; }
  .out-row.gone .nm { text-decoration: line-through; }
  /* 产出 chip：一行一件，小缩略图/文件图标 + 名字 + 大小 + 三个图标钮。
     以前是 240px 大卡内嵌 iframe 缩略图：一回合出三个网页就在对话里跑三个小浏览器，又慢又挡正文 */
  .out-card { position: relative; display: flex; flex-direction: column; width: 168px; padding: 0; overflow: hidden; border: 1px solid var(--wb-border); border-radius: 12px; background: var(--wb-bg); cursor: pointer; box-sizing: border-box; transition: border-color var(--wb-t-fast) var(--wb-ease), background var(--wb-t-fast) var(--wb-ease); }
  .out-card:hover, .out-card:focus-visible { border-color: var(--wb-brand-text); background: var(--wb-brand-weak); outline: none; }
  .out-thumb { width: 100%; height: 92px; flex: none; background: var(--wb-bg-side); border-bottom: 1px solid var(--wb-border); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .out-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .out-thumb .ph { font-size: 30px; line-height: 1; }
  .out-info { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-width: 0; padding: 7px 9px 0; }
  .out-name { font-size: 13px; font-weight: 500; color: var(--wb-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  /* 两件产出重名时才会出现的目录前缀：压暗，别抢文件名 */
  .out-name .dim { color: var(--wb-text-3); font-weight: 400; }
  .out-meta { font-size: 12px; color: var(--wb-text-3); white-space: nowrap; }
  .out-acts { display: flex; gap: 2px; flex: none; margin-top: auto; padding: 3px 5px 5px 6px; }
  /* 回复底部操作条（复制/评价/重新生成 + 消耗/模型，仿官方） */
  .turn-actions { display: flex; align-items: center; gap: 2px; margin-top: 10px; }
  .ta-btn { border: none; background: none; cursor: pointer; font-size: 14px; color: var(--wb-text-3); padding: 4px 7px; border-radius: 6px; line-height: 1; }
  .ta-btn:hover { background: var(--wb-bg-hover); color: var(--wb-text); }
  .ta-btn.on { color: var(--wb-brand-text); }
  .ta-meta { margin-left: auto; font-size: 13px; color: var(--wb-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fb-note { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  .fb-note input { flex: 1; min-width: 0; height: 30px; padding: 0 10px; font-size: 13px; color: var(--wb-text); background: var(--wb-bg-side); border: 1px solid var(--wb-border); border-radius: 8px; outline: none; }
  .fb-note input:focus { border-color: var(--wb-brand-text); }
  .fb-note button { height: 30px; padding: 0 12px; font-size: 13px; color: #fff; background: var(--wb-brand); border: none; border-radius: 8px; cursor: pointer; }
  .fb-thanks { font-size: 13px; color: var(--wb-text-3); }
  /* 本地助理主视图消息行 */
  .im-row { display: flex; gap: 8px; margin: 2px 0; }
  .im-row.out { justify-content: flex-end; }
  .im-row .im-ava { width: 26px; height: 26px; border-radius: 8px; background: var(--wb-bg-hover); display: flex; align-items: center; justify-content: center; font-size: 15px; flex: none; }
  .assist-page .im-feed { max-height: none; overflow: visible; }
  .im-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .im-head .btn-plain { flex: none; font-size: 13px; padding: 6px 12px; }
  .im-head .picker { flex: none; }
  #ab-ic .ab-ava { width: 18px; height: 18px; font-size: 15px; vertical-align: -4px; }
  #ab-ic .ab-ava img { width: 100%; height: 100%; object-fit: cover; border-radius: 5px; }
  /* 侧栏项目列表 */
  .proj-item { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; font-size: 14px; color: var(--wb-text-2); cursor: pointer; }
  .proj-item:hover { background: var(--wb-bg-hover); }
  .proj-item.active { background: var(--wb-brand-weak); color: var(--wb-text); font-weight: 600; box-shadow: inset 3px 0 0 var(--wb-brand); }
  .proj-item .pn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj-item .del { visibility: hidden; color: var(--wb-text-3); padding: 0 2px; }
  .proj-item:hover .del { visibility: visible; }
  .proj-item .del:hover { color: var(--wb-err-text); }
  .im-row .m { font-size: 12px; color: var(--wb-text-3); margin-bottom: 2px; }
  #send.stop { background: var(--wb-err); font-size: 12px; }
  .hist-item { display: flex; align-items: center; gap: 4px; }
  .hist-item .ht { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-item .hrun { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; background: var(--wb-brand); animation: hrun-pulse 1.2s ease-in-out infinite; }
  @keyframes hrun-pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .hist-item .hx { visibility: hidden; color: var(--wb-text-3); padding: 0 3px; border-radius: 4px; flex: none; }
  .hist-item:hover .hx { visibility: visible; }
  .hist-item .hx:hover { color: var(--wb-err-text); }
  .lib-cols { display: flex; gap: 16px; align-items: flex-start; }
  .lib-cols > div { flex: 1; min-width: 0; }
  .lib-row { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--wb-border); border-radius: 8px; margin-bottom: 6px; font-size: 14px; }
  .lib-row .ln { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lib-row .lm { color: var(--wb-text-3); font-size: 12px; flex: none; }
  .lib-note { border: 1px solid var(--wb-border); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .lib-note .lm { color: var(--wb-text-3); font-size: 12px; margin-top: 4px; display: flex; gap: 10px; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--wb-brand-weak); border-top-color: var(--wb-brand-text); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* ---------- 输入区（仿官方：大卡片 + 底部工具行 + 卡片下快捷栏） ---------- */
  .input-wrap { padding: 8px 20px 14px; }
  .input-inner { max-width: var(--wb-content-w); margin: 0 auto; }
  .input-card { border: 1.5px solid var(--wb-border); border-radius: 18px; background: var(--wb-bg); padding: 14px 16px 10px; box-shadow: 0 6px 24px rgba(23,24,28,.05); transition: border-color var(--wb-t-fast) var(--wb-ease); }
  .input-card:focus-within { border-color: var(--wb-brand-text); }
  textarea#input { width: 100%; border: none; outline: none; resize: none; font-size: var(--wb-fs); line-height: 1.6; max-height: 160px; background: transparent; color: var(--wb-text); }
  textarea#input::placeholder { color: var(--wb-text-3); }
  .card-toolbar { display: flex; align-items: center; margin-top: 8px; gap: 8px; }
  .icon-btn { width: 32px; height: 32px; border: none; background: transparent; border-radius: 8px; font-size: 18px; color: var(--wb-text-2); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .icon-btn:hover { background: var(--wb-bg-hover); }
  .card-toolbar .grow { flex: 1; }
  .picker { position: relative; }
  .picker-btn { display: flex; align-items: center; gap: 5px; border: none; background: transparent; border-radius: 8px; padding: 6px 10px; font-size: 14px; color: var(--wb-text-2); cursor: pointer; }
  .picker-btn:hover { background: var(--wb-bg-hover); }
  .picker-menu { display: none; position: absolute; bottom: 40px; right: 0; min-width: 200px; background: var(--wb-bg); border: 1px solid var(--wb-border); border-radius: 12px; box-shadow: 0 10px 32px rgba(23,24,28,.14); padding: 6px; z-index: 30; }
  .picker-menu.up-left { right: auto; left: 0; }
  /* 默认那套是给输入框用的（菜单往上弹）；顶栏里的按钮得往下弹，不然掀到窗口外面去了 */
  .picker-menu.down { top: 36px; bottom: auto; max-height: 60vh; overflow-y: auto; }
  .picker-menu.show { display: block; }
  .picker-menu .mi { padding: 8px 12px; border-radius: 8px; font-size: 14px; cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .picker-menu .mi:hover { background: var(--wb-bg-hover); }
  .picker-menu .mi.on { color: var(--wb-brand-text); background: var(--wb-brand-weak); }
  .picker-menu .mi .sub { font-size: 12px; color: var(--wb-text-3); }
  #send { width: 34px; height: 34px; border: none; border-radius: 50%; background: var(--wb-brand-grad); color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #send:disabled { opacity: .45; cursor: not-allowed; }

  /* ---------- 右侧成果面板 ---------- */
  .files-panel { position: relative; width: 0; flex-shrink: 0; border-left: 1px solid var(--wb-border); background: var(--wb-bg-side); overflow: hidden; transition: width var(--wb-t-slow) var(--wb-ease-out); display: flex; flex-direction: column; }

  /* 左右两栏拖着改宽：抓边上那条 7px 的缝，双击回默认，←/→ 也能推。
     宽度写在 :root 的变量里（JS 存 localStorage），CSS 里的默认值就是没拖过时的样子。
     拖的时候把 width 过渡关掉，否则手在动、栏在追，跟手感全没了 */
  .rsz { position: absolute; top: 0; bottom: 0; width: 7px; z-index: 6; cursor: col-resize; touch-action: none; }
  .rsz.r { right: -4px; }
  .rsz.l { left: 0; }
  .rsz::after { content: ""; position: absolute; top: 0; bottom: 0; left: 3px; width: 1px; background: transparent; transition: background var(--wb-t-fast) var(--wb-ease); }
  .rsz:hover::after, .rsz:focus-visible::after, .rsz.on::after { background: var(--wb-brand); }
  .rsz:focus-visible { outline: none; }
  body.rsz-on { cursor: col-resize; user-select: none; }
  body.rsz-on aside, body.rsz-on .preview-panel, body.rsz-on .files-panel { transition: none; }

  /* ---------- 弹窗 ---------- */
  /* 浮层一律毛玻璃：底下的内容糊掉但还在，视线知道自己没离开原来那一页。
     只给这几层加——顶栏、侧栏都在文档流里，底下没有东西可糊，加了只是白付一份合成开销。
     backdrop-filter 不支持时退化成原来的半透明色，不会变成一块实心板。 */
  .modal-mask { display: none; position: fixed; inset: 0; background: rgba(23,24,28,.35); backdrop-filter: saturate(150%) blur(6px); -webkit-backdrop-filter: saturate(150%) blur(6px); z-index: 50; align-items: center; justify-content: center; }
  .modal-mask.show { display: flex; }
  .modal { width: 640px; max-width: 94vw; max-height: 82vh; background: var(--wb-bg); border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(23,24,28,.2); }
  .modal.wide { width: 920px; } /* 设置页要放得下双栏通道卡（去掉 160 导航 + 40 内边距，正文还剩 720） */
  .m-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--wb-border); flex-shrink: 0; }

  .m-body input:focus, .m-body textarea:focus { border-color: var(--wb-brand-text); }
  .btn-brand { border: none; background: var(--wb-brand-grad); color: #fff; border-radius: 8px; padding: 8px 18px; font-size: 14px; cursor: pointer; }
  .btn-plain { border: 1px solid var(--wb-border); background: var(--wb-bg); border-radius: 8px; padding: 7px 14px; font-size: 13px; cursor: pointer; color: var(--wb-text-2); }
  .link { color: var(--wb-brand-text); cursor: pointer; text-decoration: none; }
  .link.danger { color: var(--wb-err-text); }
  .settings-layout { display: flex; height: 60vh; }
  .settings-nav { width: 160px; flex-shrink: 0; border-right: 1px solid var(--wb-border); padding: 12px 8px; overflow-y: auto; }
  .settings-nav .cat { padding: 8px 12px; border-radius: 8px; font-size: 14px; color: var(--wb-text-2); cursor: pointer; margin-bottom: 2px; }
  .settings-nav .cat:hover { background: var(--wb-bg-hover); }
  .settings-nav .cat.active { background: var(--wb-brand-weak); color: var(--wb-text); font-weight: 600; box-shadow: inset 3px 0 0 var(--wb-brand); }
  .settings-nav .cat .ci { display: inline-block; width: 22px; }
  /* 外观页：分段按钮 + 色板。全是「点一下立刻生效」的选项，没有保存键 */
  .look-seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .look-seg button { flex: 1; min-width: 88px; border: 1px solid var(--wb-border); background: var(--wb-card); color: var(--wb-text-2); border-radius: 10px; padding: 10px 8px; cursor: pointer; font: inherit; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; min-height: 62px; transition: border-color var(--wb-t-fast) var(--wb-ease), background var(--wb-t-fast) var(--wb-ease); }
  .look-seg button:hover { border-color: var(--wb-text-3); }
  .look-seg button.on { border-color: var(--wb-brand); background: var(--wb-brand-weak); color: var(--wb-text); font-weight: 600; }
  .look-seg button .ic { font-size: 20px; line-height: 1; }
  .look-seg button b { line-height: 1; font-weight: 600; }
  .look-f { font-size: 18px; }
  .look-f-serif { font-family: Georgia, "Songti SC", "Noto Serif CJK SC", SimSun, serif; }
  .look-f-mono { font-family: var(--font-mono); }
  .look-skins { display: flex; gap: 8px; flex-wrap: wrap; }
  .look-skin { width: 72px; border: 1px solid var(--wb-border); border-radius: 10px; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 7px; cursor: pointer; background: var(--wb-card); color: var(--wb-text-2); font: inherit; font-size: 12px; transition: border-color var(--wb-t-fast) var(--wb-ease); }
  .look-skin i { width: 26px; height: 26px; border-radius: 50%; box-shadow: 0 0 0 2px var(--wb-card); }
  .look-skin:hover { border-color: var(--wb-text-3); }
  .look-skin.on { border-color: var(--wb-brand); color: var(--wb-text); font-weight: 600; }
  .look-skin.on i { box-shadow: 0 0 0 2px var(--wb-card), 0 0 0 4px var(--wb-brand); }
  .look-prev { margin-top: 10px; border: 1px dashed var(--wb-border); border-radius: 10px; padding: 10px 14px; font-size: var(--wb-fs); line-height: 1.7; color: var(--wb-text); }
  .look-prev code { background: var(--wb-bg-hover); border-radius: 4px; padding: 1px 5px; font-size: calc(var(--wb-fs) - 2px); font-family: var(--font-mono); }
  .look-note { color: var(--wb-text-3); font-size: 12px; margin-top: 8px; }
  .settings-pane { flex: 1; padding: 16px 20px; overflow-y: auto; font-size: 14px; }
  .form-row { display: flex; gap: 8px; }
  .form-row > * { flex: 1; }
  .ok-msg { font-size: 13px; color: var(--wb-ok-text); margin-left: 8px; }
  /* ---------- 账号 / 积分 ---------- */
  .user-chip { display: flex; align-items: center; gap: 8px; margin: 8px 4px 0; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--wb-border); background: var(--wb-bg); font-size: 13px; cursor: pointer; }
  .user-chip:hover { background: var(--wb-bg-hover); }
  .user-chip .ava { width: 26px; height: 26px; border-radius: 50%; background: var(--wb-brand-grad); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex: none; }
  .user-chip .un { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-chip .uc { margin-left: auto; color: var(--wb-brand-text); font-weight: 600; flex: none; }
  .auth-mask { position: fixed; inset: 0; z-index: 200; background: rgba(247,248,250,.78); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); display: none; align-items: center; justify-content: center; }
  .auth-mask.show { display: flex; }
  .auth-card { width: 340px; background: var(--wb-bg); border: 1px solid var(--wb-border); border-radius: 16px; padding: 28px 26px; box-shadow: 0 12px 40px rgba(0,0,0,.08); }

  .auth-card button.go { width: 100%; padding: 10px; border: none; border-radius: 10px; background: var(--wb-brand-grad); color: #fff; font-size: 15px; cursor: pointer; }
  .auth-card .alt { font-size: 13px; color: var(--wb-text-3); text-align: center; margin-top: 12px; }

  .auth-card .err { font-size: 13px; color: var(--wb-err-text); min-height: 16px; margin-bottom: 6px; }
  /* 首次开箱向导：一步一件事，步骤条在顶上；行式清单和助理设置页的卡片同一套视觉 */
  .onb-card { width: 520px; max-width: calc(100vw - 32px); max-height: calc(100vh - 40px); overflow: auto; }
  .onb-steps { display: flex; gap: 4px; margin: -6px 0 18px; }
  .onb-lang { flex-basis: 100%; display: flex; justify-content: flex-end; gap: 4px; margin: -4px 0 8px; }
  .onb-lang button { font-size: 11px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--wb-border); background: transparent; color: var(--wb-text-3); cursor: pointer; }
  .onb-lang button.on { background: var(--wb-brand-weak); color: var(--wb-brand-text); border-color: transparent; font-weight: 600; }
  .onb-step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; border-radius: 10px; font-size: 11px; color: var(--wb-text-3); cursor: default; }
  .onb-step i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--wb-bg-hover); font-size: 13px; }
  .onb-step.cur { color: var(--wb-brand-text); font-weight: 600; }
  .onb-step.cur i { background: var(--wb-brand-weak); }
  .onb-step.done { color: var(--wb-ok-text); cursor: pointer; }
  .onb-step.done i { background: color-mix(in srgb, var(--wb-ok) 18%, transparent); color: var(--wb-ok-text); }
  .onb-h { display: flex; align-items: center; gap: 8px; }
  .onb-h h2 { margin: 0; }
  .onb-tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--wb-bg-hover); color: var(--wb-text-3); }
  .onb-tag.must { background: color-mix(in srgb, var(--wb-err) 14%, transparent); color: var(--wb-err-text); }
  .onb-tag.rec { background: color-mix(in srgb, var(--wb-warn) 18%, transparent); color: var(--wb-warn); }
  .onb-card .sub { margin-top: 6px; }
  .onb-card .onb-lb { display: block; font-size: 13px; color: var(--wb-text-2); margin: 10px 0 6px; }
  .onb-card select { width: 100%; padding: 10px 12px; border: 1px solid var(--wb-border); border-radius: 10px; font-size: 14px; background: var(--wb-bg); color: var(--wb-text); }
  .onb-card .onb-tip { font-size: 13px; color: var(--wb-text-3); margin-top: 6px; line-height: 1.6; }
  .onb-card .onb-tip a { color: var(--wb-brand-text); }
  /* 「去拿 Key ↗」：向导、模型/搜索/IM 面板共用的小胶囊链接，一眼能点、不跟正文糊在一起 */
  .get-key { display: inline-flex; align-items: center; gap: 2px; margin-left: 6px; padding: 1px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; line-height: 20px; white-space: nowrap; text-decoration: none; color: var(--wb-brand-text); border: 1px solid color-mix(in srgb, var(--wb-brand) 40%, transparent); background: color-mix(in srgb, var(--wb-brand) 8%, transparent); vertical-align: middle; }
  .get-key:hover { background: color-mix(in srgb, var(--wb-brand) 16%, transparent); text-decoration: none; }
  .onb-presets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }

  .onb-preset { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--wb-border); background: var(--wb-bg); color: var(--wb-text-2); cursor: pointer; }
  .onb-preset:hover { border-color: var(--wb-brand); color: var(--wb-brand-text); }
  .onb-preset.on { border-color: var(--wb-brand); color: var(--wb-brand-text); background: color-mix(in srgb, var(--wb-brand) 10%, transparent); }
  .onb-im-src { font-size: 12px; color: var(--wb-text-3); display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .onb-im-src .get-key { margin-left: 2px; }
  .onb-ok { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--wb-ok) 12%, transparent); color: var(--wb-ok-text); font-size: 13px; margin-bottom: 6px; }
  .onb-ok a { margin-left: auto; color: var(--wb-brand-text); cursor: pointer; font-size: 12px; }
  .onb-seg { display: flex; gap: 6px; margin-top: 4px; }
  .onb-seg button { flex: 1; padding: 9px 10px; border: 1px solid var(--wb-border); border-radius: 10px; background: var(--wb-bg); color: var(--wb-text-2); font-size: 13px; cursor: pointer; }
  .onb-seg button.on { border-color: var(--wb-brand); color: var(--wb-brand-text); background: var(--wb-brand-weak); font-weight: 600; }
  .onb-radio { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--wb-border); border-radius: 10px; margin-top: 8px; font-size: 13px; cursor: pointer; }
  .onb-radio span { margin-left: auto; color: var(--wb-text-3); font-size: 12px; }
  .onb-rows { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .onb-row { border: 1px solid var(--wb-border); border-radius: 10px; background: var(--wb-card); }
  .onb-row-h { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }

  .onb-row-h .tt b { display: block; font-size: 13px; }
  .onb-row-h .tt span { display: block; font-size: 12px; color: var(--wb-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .onb-chip { font-size: 12px; color: var(--wb-text-3); flex: none; }
  .onb-chip.ok { color: var(--wb-ok-text); }
  .onb-chip.warn { color: var(--wb-warn); }
  .onb-row-h .btn-plain { height: 28px; padding: 0 10px; font-size: 12px; flex: none; }
  .onb-row-b { border-top: 1px solid var(--wb-border); padding: 10px 12px 12px; }

  .onb-foot a { font-size: 13px; color: var(--wb-text-3); cursor: pointer; }

  .onb-card button.go { width: auto; min-width: 140px; padding: 10px 18px; margin: 0; }

  /* ---------- 排队 / 插队 ---------- */
  .queue-bar { display: none; flex-wrap: wrap; gap: 6px; align-items: center; padding: 0 2px 6px; font-size: 13px; color: var(--wb-text-3); }
  .queue-bar.show { display: flex; }
  .q-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 260px; padding: 4px 10px; border-radius: 999px; background: var(--wb-brand-weak); color: var(--wb-brand-text); font-size: 13px; }

  .qb-stop { border: 1px solid color-mix(in srgb, var(--wb-err) 45%, transparent); background: color-mix(in srgb, var(--wb-err) 8%, transparent); color: var(--wb-err-text); border-radius: 999px; padding: 2px 10px; font-size: 12px; cursor: pointer; }

  #send.interject { box-shadow: 0 0 0 3px var(--wb-brand-weak); }
  #interject-btn { display: none; border: 1px solid var(--wb-brand); color: var(--wb-brand-text); background: none; border-radius: 8px; padding: 4px 10px; font-size: 13px; cursor: pointer; }
  #interject-btn.show { display: inline-block; }
  .interject-note { align-self: flex-end; max-width: 70%; margin: 6px 0; padding: 8px 12px; border-radius: 10px; background: var(--wb-brand-weak); color: var(--wb-brand-text); font-size: 14px; }

  .interject-note.pending { opacity: .6; }
  /* AI 拿不准时的提问卡：一条选项一行（短语 + 选它意味着什么），键盘 1/2/3/4 直选 */
  .ask-card { align-self: stretch; margin: 12px 0; padding: 14px 16px 12px; border: 1px solid var(--wb-border); border-left: 3px solid var(--wb-brand); border-radius: 12px; background: var(--wb-bg); box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .ask-hd { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--wb-text-3); margin-bottom: 8px; }
  .ask-hd .ask-lb { flex: 1; }
  .ask-timer { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--wb-text-3); }
  .ask-timer.hot { color: var(--wb-err-text); }

  .ask-opt:hover, .ask-opt:focus-visible { border-color: var(--wb-brand-text); background: var(--wb-brand-weak); outline: none; }

  .ask-opt:hover .kk { border-color: var(--wb-brand-text); color: var(--wb-brand-text); }
  .ask-opt .tx { flex: 1; min-width: 0; }
  .ask-opt .lb { display: block; font-size: 14px; font-weight: 500; color: var(--wb-text); }
  .ask-opt .dt { display: block; font-size: 13px; color: var(--wb-text-3); line-height: 1.5; margin-top: 2px; }
  .ask-opt .go { flex: none; font-size: 12px; color: transparent; align-self: center; }
  .ask-opt:hover .go { color: var(--wb-brand-text); }
  .ask-free { display: flex; gap: 8px; margin-top: 12px; }
  .ask-free input { flex: 1; min-width: 0; border: 1px solid var(--wb-border); border-radius: 10px; padding: 8px 12px; font-size: 13px; background: var(--wb-bg); color: var(--wb-text); }
  .ask-free input:focus { outline: none; border-color: var(--wb-brand-text); }
  .ask-free button { flex: none; border: 1px solid var(--wb-border); background: var(--wb-bg); color: var(--wb-text-2); border-radius: 10px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
  .ask-free button:hover { border-color: var(--wb-brand-text); color: var(--wb-brand-text); }
  .ask-card.sending { opacity: .6; pointer-events: none; }
  /* 答完就缩成一行：问题留着（回头看得懂当时在纠结什么），选项和输入框收走 */
  .ask-card.done { border-left-color: var(--wb-border); background: var(--wb-bg-side); }
  .ask-card.done .ask-opts, .ask-card.done .ask-free, .ask-card.done .ask-timer { display: none; }
  .ask-card.done .ask-q { font-weight: 500; font-size: 14px; margin-bottom: 6px; }
  .ask-ans:empty { display: none; }
  .ask-ans { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--wb-text-2); }
  .ask-ans b { color: var(--wb-text); font-weight: 600; }
  /* ---------- 用量面板 ---------- */
  .usage-grid { display: flex; gap: 10px; margin-bottom: 12px; }
  .usage-cell { flex: 1; border: 1px solid var(--wb-border); border-radius: 10px; padding: 10px 12px; }

  .usage-cell .l { font-size: 12px; color: var(--wb-text-3); margin-top: 2px; }

  .usage-bars .b { flex: 1; background: var(--wb-brand-weak); border-radius: 4px 4px 0 0; position: relative; min-height: 2px; }
  .usage-bars .b i { position: absolute; bottom: -16px; left: 0; right: 0; text-align: center; font-style: normal; font-size: 11px; color: var(--wb-text-3); }
