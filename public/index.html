<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkBuddy 复刻版</title>
<style>
  :root {
    --wb-brand: #5b5ff7; --wb-brand-weak: #eef0ff; --wb-brand-grad: linear-gradient(135deg,#5b5ff7,#8b5cf6);
    --wb-bg: #ffffff; --wb-bg-side: #f7f8fa; --wb-bg-hover: #eef0f4;
    --wb-border: #e9ebf0; --wb-text: #17181c; --wb-text-2: #6a6f7d; --wb-text-3: #9aa0ad;
    --wb-ok: #16a34a; --wb-err: #e5484d;
    --wb-content-w: 832px; --wb-code-bg: #16181f; --wb-code-text: #d5dcec;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--wb-bg); color: var(--wb-text); display: flex; overflow: hidden; font-size: 14px;
  }
  input, select, textarea, button { font-family: inherit; }
  /* ---------- 左侧导航 ---------- */
  aside { width: 250px; flex-shrink: 0; background: var(--wb-bg-side); border-right: 1px solid var(--wb-border); display: flex; flex-direction: column; padding: 14px 10px; }
  .brand { display: flex; align-items: center; gap: 9px; padding: 4px 8px 14px; }
  .brand .mark { width: 30px; height: 30px; border-radius: 9px; background: var(--wb-brand-grad); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; }
  .brand .name { font-size: 14px; font-weight: 600; }
  .brand .tag { font-size: 10px; color: var(--wb-text-3); }
  #new-task { display: flex; align-items: center; justify-content: center; gap: 6px; margin: 0 4px 14px; padding: 9px; border: none; border-radius: 10px; background: var(--wb-brand-grad); color: #fff; font-size: 13px; font-weight: 500; cursor: pointer; }
  .assist-box { margin: 0 4px 14px; border: 1px solid var(--wb-border); border-radius: 10px; padding: 8px; background: var(--wb-bg); }
  .ab-head { display: flex; align-items: center; justify-content: space-between; font-size: 12px; font-weight: 600; padding: 2px 4px 6px; cursor: pointer; user-select: none; }
  .ab-head .ab-sub { font-weight: 400; font-size: 11px; color: var(--wb-text-3); }
  .ab-ch { display: flex; align-items: center; gap: 6px; padding: 5px 4px; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .ab-ch:hover { background: var(--wb-bg-hover); }
  .ab-ch .st { margin-left: auto; font-size: 11px; color: var(--wb-text-3); }
  .ab-ch .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--wb-text-3); flex: none; }
  .ab-ch .dot.ok { background: var(--wb-ok); }
  .ab-ch .dot.err { background: var(--wb-err); }
  .ab-empty { font-size: 11px; color: var(--wb-text-3); padding: 4px; }
  .im-strip { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 10px; border: 1px solid var(--wb-border); border-radius: 10px; font-size: 13px; margin-bottom: 12px; }
  .im-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--wb-text-2); }
  .im-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--wb-text-3); }
  .im-chip .dot.ok { background: var(--wb-ok); }
  .im-chip .dot.err { background: var(--wb-err); }
  .im-feed { display: flex; flex-direction: column; gap: 8px; max-height: 55vh; overflow-y: auto; padding: 4px 2px; }
  .im-b { max-width: 76%; padding: 8px 12px; border-radius: 10px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .im-b.in { align-self: flex-start; background: var(--wb-bg-hover); }
  .im-b.out { align-self: flex-end; background: var(--wb-brand-weak); }
  .im-b.error { align-self: center; color: var(--wb-err); font-size: 12px; background: none; }
  .im-b .m { font-size: 11px; color: var(--wb-text-3); margin-bottom: 2px; }
  .side-label { font-size: 11px; color: var(--wb-text-3); padding: 4px 10px 6px; }
  #history { flex: 1; overflow-y: auto; min-height: 0; }
  .hist-item { padding: 8px 10px; border-radius: 8px; font-size: 13px; color: var(--wb-text-2); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hist-item:hover { background: var(--wb-bg-hover); }
  .hist-item.active { background: var(--wb-brand-weak); color: var(--wb-brand); }
  .side-nav { border-top: 1px solid var(--wb-border); padding-top: 8px; margin-top: 8px; }
  .side-nav .item { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 8px; font-size: 13px; color: var(--wb-text-2); cursor: pointer; }
  .side-nav .item:hover { background: var(--wb-bg-hover); color: var(--wb-text); }
  /* ---------- 主区域 ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar { height: 56px; flex: 0 0 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--wb-border); }
  .topbar .title { font-size: 14px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topbar .right { display: flex; align-items: center; gap: 10px; }
  #toggle-files { border: 1px solid var(--wb-border); background: var(--wb-bg); border-radius: 8px; padding: 5px 12px; font-size: 12px; color: var(--wb-text-2); cursor: pointer; }
  #chat-scroll { flex: 1; overflow-y: auto; min-height: 0; }
  .chat-col { max-width: var(--wb-content-w); margin: 0 auto; padding: 24px 20px 12px; }
  .empty { display: flex; flex-direction: column; align-items: center; text-align: center; padding-top: 10vh; }
  .empty h1 { font-size: 34px; font-weight: 700; margin-bottom: 24px; letter-spacing: 1px; }
  .scene-tabs { display: flex; background: var(--wb-bg-side); border-radius: 26px; padding: 4px; gap: 2px; margin-bottom: 34px; }
  .scene-tabs button { border: none; background: transparent; border-radius: 22px; padding: 9px 22px; font-size: 14px; color: var(--wb-text-2); cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .scene-tabs button.active { background: #17181c; color: #fff; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 720px; }
  .chips button { padding: 9px 18px; border-radius: 22px; border: 1px solid var(--wb-border); background: var(--wb-bg); font-size: 13.5px; color: var(--wb-text); cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .chips button:hover { border-color: var(--wb-brand); color: var(--wb-brand); background: var(--wb-brand-weak); }
  .scene-tag { display: inline-flex; align-items: center; gap: 6px; background: #d7f5e9; color: #0f8a5f; font-size: 12.5px; border-radius: 14px; padding: 4px 12px; margin-bottom: 6px; }
  .scene-tag b { cursor: pointer; font-weight: 400; opacity: .7; }
  /* @ / 自动补全菜单 */
  .mention-menu { display: none; position: absolute; bottom: 100%; left: 12px; margin-bottom: 8px; min-width: 260px; max-width: 420px; max-height: 260px; overflow-y: auto; background: var(--wb-bg); border: 1px solid var(--wb-border); border-radius: 12px; box-shadow: 0 10px 32px rgba(23,24,28,.16); padding: 6px; z-index: 40; }
  .mention-menu.show { display: block; }
  .mention-menu .mi { padding: 8px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .mention-menu .mi:hover, .mention-menu .mi.sel { background: var(--wb-bg-hover); }
  .mention-menu .mi .sub { font-size: 11px; color: var(--wb-text-3); display: block; }
  .mention-menu .mh { font-size: 11px; color: var(--wb-text-3); padding: 4px 12px; }
  .turn { margin-bottom: 22px; }
  .u-msg { display: flex; justify-content: flex-end; }
  .u-msg .bubble { max-width: 78%; background: var(--wb-brand); color: #fff; border-radius: 14px 14px 3px 14px; padding: 10px 15px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .a-msg { display: flex; gap: 10px; margin-top: 16px; }
  .a-msg .avatar { width: 28px; height: 28px; flex-shrink: 0; border-radius: 9px; background: var(--wb-brand-grad); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; }
  .a-msg .body { min-width: 0; flex: 1; }
  .a-text { line-height: 1.7; word-break: break-word; margin: 3px 0 6px; }
  .a-text p { margin: 6px 0; }
  .a-text h1, .a-text h2, .a-text h3, .a-text h4 { margin: 12px 0 6px; font-size: 15px; }
  .a-text h1 { font-size: 17px; }
  .a-text h2 { font-size: 16px; }
  .a-text ul, .a-text ol { margin: 6px 0; padding-left: 22px; }
  .a-text li { margin: 3px 0; }
  .a-text blockquote { border-left: 3px solid var(--wb-brand); background: var(--wb-brand-weak); padding: 8px 12px; margin: 8px 0; border-radius: 0 8px 8px 0; color: var(--wb-text-2); }
  .a-text blockquote p { margin: 2px 0; }
  .a-text code { background: var(--wb-bg-hover); border-radius: 4px; padding: 1px 5px; font-size: 12.5px; font-family: Consolas, monospace; }
  .a-text pre { background: var(--wb-code-bg); color: var(--wb-code-text); border-radius: 8px; padding: 12px; overflow-x: auto; margin: 8px 0; }
  .a-text pre code { background: none; color: inherit; padding: 0; }
  .code-wrap { margin: 8px 0; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,.06); }
  .code-head { display: flex; justify-content: space-between; align-items: center; background: #23252e; color: #8b92a5; font-size: 11px; padding: 5px 12px; font-family: Consolas, ui-monospace, monospace; }
  .code-head .code-copy { cursor: pointer; color: #8b92a5; user-select: none; }
  .code-head .code-copy:hover { color: #fff; }
  .code-wrap pre { margin: 0; border-radius: 0; }
  .md-table-wrap { overflow-x: auto; margin: 8px 0; }
  .a-text table { border-collapse: collapse; font-size: 13px; min-width: 60%; }
  .a-text th, .a-text td { border: 1px solid var(--wb-border); padding: 5px 10px; text-align: left; }
  .a-text th { background: var(--wb-bg-hover); font-weight: 600; }
  .a-text hr { border: none; border-top: 1px solid var(--wb-border); margin: 10px 0; }
  .a-text a { color: var(--wb-brand); }
  .step-card { border: 1px solid var(--wb-border); border-radius: 10px; margin: 8px 0; overflow: hidden; background: #fbfcfe; }
  .step-card .head { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; user-select: none; font-size: 13px; }
  .tag { font-size: 11px; padding: 2px 9px; border-radius: 10px; background: var(--wb-brand-weak); color: var(--wb-brand); white-space: nowrap; }
  .tag.ok { background: #e6f6ec; color: var(--wb-ok); }
  .tag.err { background: #fdebec; color: var(--wb-err); }
  .step-card .desc { color: var(--wb-text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .step-card pre { display: none; background: var(--wb-code-bg); color: var(--wb-code-text); padding: 12px; font-size: 12px; line-height: 1.5; max-height: 320px; overflow: auto; }
  .step-card.open pre { display: block; }
  /* 执行过程折叠条（仿官方「已完成 12s ›」） */
  .proc-wrap { margin: 2px 0 8px; }
  .proc-head { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--wb-text-3); cursor: pointer; user-select: none; padding: 2px 0; }
  .proc-head:hover { color: var(--wb-text-2); }
  .proc-head .arrow { font-size: 12px; display: inline-block; transition: transform .15s; }
  .proc-wrap.open .proc-head .arrow { transform: rotate(90deg); }
  .proc-body { display: none; padding-left: 10px; border-left: 2px solid var(--wb-border); margin: 4px 0 4px 4px; }
  .proc-wrap.open .proc-body { display: block; }
  .proc-body .a-text { color: var(--wb-text-2); font-size: 13px; }
  /* 回复底部操作条（复制/评价/重新生成 + 消耗/模型，仿官方） */
  .turn-actions { display: flex; align-items: center; gap: 2px; margin-top: 10px; }
  .ta-btn { border: none; background: none; cursor: pointer; font-size: 13px; color: var(--wb-text-3); padding: 4px 7px; border-radius: 6px; line-height: 1; }
  .ta-btn:hover { background: var(--wb-bg-hover); color: var(--wb-text); }
  .ta-btn.on { color: var(--wb-brand); }
  .ta-meta { margin-left: auto; font-size: 12px; color: var(--wb-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 本地助理主视图消息行 */
  .im-row { display: flex; gap: 8px; margin: 2px 0; }
  .im-row.out { justify-content: flex-end; }
  .im-row .im-ava { width: 26px; height: 26px; border-radius: 8px; background: var(--wb-bg-hover); display: flex; align-items: center; justify-content: center; font-size: 14px; flex: none; }
  .assist-page .im-feed { max-height: none; overflow: visible; }
  /* 侧栏项目列表 */
  .proj-item { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 8px; font-size: 13px; color: var(--wb-text-2); cursor: pointer; }
  .proj-item:hover { background: var(--wb-bg-hover); }
  .proj-item.active { background: var(--wb-brand-weak); color: var(--wb-brand); font-weight: 600; }
  .proj-item .pn { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj-item .del { visibility: hidden; color: var(--wb-text-3); padding: 0 2px; }
  .proj-item:hover .del { visibility: visible; }
  .proj-item .del:hover { color: var(--wb-err); }
  .im-row .m { font-size: 11px; color: var(--wb-text-3); margin-bottom: 2px; }
  #send.stop { background: var(--wb-err); font-size: 11px; }
  .hist-item { display: flex; align-items: center; gap: 4px; }
  .hist-item .ht { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hist-item .hx { visibility: hidden; color: var(--wb-text-3); padding: 0 3px; border-radius: 4px; flex: none; }
  .hist-item:hover .hx { visibility: visible; }
  .hist-item .hx:hover { color: var(--wb-err); }
  .lib-cols { display: flex; gap: 16px; align-items: flex-start; }
  .lib-cols > div { flex: 1; min-width: 0; }
  .lib-row { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--wb-border); border-radius: 8px; margin-bottom: 6px; font-size: 13px; }
  .lib-row .ln { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lib-row .lm { color: var(--wb-text-3); font-size: 11px; flex: none; }
  .lib-note { border: 1px solid var(--wb-border); border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; font-size: 13px; white-space: pre-wrap; word-break: break-word; }
  .lib-note .lm { color: var(--wb-text-3); font-size: 11px; margin-top: 4px; display: flex; gap: 10px; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--wb-brand-weak); border-top-color: var(--wb-brand); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* ---------- 输入区（仿官方：大卡片 + 底部工具行 + 卡片下快捷栏） ---------- */
  .input-wrap { padding: 8px 20px 14px; }
  .input-inner { max-width: var(--wb-content-w); margin: 0 auto; }
  .input-card { border: 1.5px solid var(--wb-border); border-radius: 18px; background: var(--wb-bg); padding: 14px 16px 10px; box-shadow: 0 6px 24px rgba(23,24,28,.05); transition: border-color .15s; }
  .input-card:focus-within { border-color: var(--wb-brand); }
  textarea#input { width: 100%; border: none; outline: none; resize: none; font-size: 14px; line-height: 1.6; max-height: 160px; background: transparent; color: var(--wb-text); }
  textarea#input::placeholder { color: var(--wb-text-3); }
  .card-toolbar { display: flex; align-items: center; margin-top: 8px; gap: 8px; }
  .icon-btn { width: 32px; height: 32px; border: none; background: transparent; border-radius: 8px; font-size: 18px; color: var(--wb-text-2); cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .icon-btn:hover { background: var(--wb-bg-hover); }
  .card-toolbar .grow { flex: 1; }
  .picker { position: relative; }
  .picker-btn { display: flex; align-items: center; gap: 5px; border: none; background: transparent; border-radius: 8px; padding: 6px 10px; font-size: 13px; color: var(--wb-text-2); cursor: pointer; }
  .picker-btn:hover { background: var(--wb-bg-hover); }
  .picker-menu { display: none; position: absolute; bottom: 40px; right: 0; min-width: 200px; background: var(--wb-bg); border: 1px solid var(--wb-border); border-radius: 12px; box-shadow: 0 10px 32px rgba(23,24,28,.14); padding: 6px; z-index: 30; }
  .picker-menu.up-left { right: auto; left: 0; }
  .picker-menu.show { display: block; }
  .picker-menu .mi { padding: 8px 12px; border-radius: 8px; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .picker-menu .mi:hover { background: var(--wb-bg-hover); }
  .picker-menu .mi.on { color: var(--wb-brand); background: var(--wb-brand-weak); }
  .picker-menu .mi .sub { font-size: 11px; color: var(--wb-text-3); }
  #send { width: 34px; height: 34px; border: none; border-radius: 50%; background: var(--wb-brand-grad); color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #send:disabled { opacity: .45; cursor: not-allowed; }
  .quick-bar { display: flex; align-items: center; gap: 4px; padding: 8px 6px 0; }
  .quick-bar .picker-btn { font-size: 12.5px; }
  .plan-list { border: 1px solid var(--wb-border); border-radius: 10px; padding: 10px 14px; margin: 8px 0; background: var(--wb-bg-side); }
  .plan-list .pl-head { font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .plan-list .pl-item { display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; font-size: 13px; cursor: pointer; }
  .plan-list .pl-item input { margin-top: 3px; accent-color: var(--wb-brand); }
  .plan-list .pl-item input:checked + span { color: var(--wb-text-3); text-decoration: line-through; }
  .plan-list .pl-run { margin-top: 8px; border: none; background: var(--wb-brand); color: #fff; border-radius: 8px; padding: 6px 14px; font-size: 12px; cursor: pointer; }
  .attach-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .attach-chips span { font-size: 12px; background: var(--wb-bg-hover); border-radius: 8px; padding: 3px 10px; color: var(--wb-text-2); }
  /* ---------- 右侧预览面板（HTML/图片/文档实时预览） ---------- */
  .main { min-width: 460px; }
  .preview-panel { width: 0; flex-shrink: 0; border-left: 1px solid var(--wb-border); background: var(--wb-bg); overflow: hidden; transition: width .2s; display: flex; flex-direction: column; }
  .preview-panel.show { width: 44%; min-width: 360px; max-width: calc(100vw - 250px - 470px); }
  .pv-head { height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-bottom: 1px solid var(--wb-border); font-size: 13px; }
  .pv-head .pv-name { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pv-head button { border: none; background: transparent; font-size: 14px; cursor: pointer; color: var(--wb-text-2); padding: 4px 8px; border-radius: 6px; }
  .pv-head button:hover { background: var(--wb-bg-hover); }
  #pv-body { flex: 1; min-height: 0; overflow: auto; }
  #pv-body iframe { width: 100%; height: 100%; border: none; background: #fff; }
  #pv-body img { max-width: 100%; display: block; margin: 20px auto; }
  #pv-body .pv-text { padding: 16px 20px; font-size: 13px; line-height: 1.7; }
  /* ---------- 右侧成果面板 ---------- */
  .files-panel { width: 0; flex-shrink: 0; border-left: 1px solid var(--wb-border); background: var(--wb-bg-side); overflow: hidden; transition: width .2s; display: flex; flex-direction: column; }
  .files-panel.show { width: 280px; }
  /* ---- 快捷键 / 对话内搜索 / 命令审批 / 侧栏折叠 ---- */
  body.side-collapsed aside { display: none; }
  .main { position: relative; }
  /* ---------- 响应式：窗口任意拉伸自适应 ---------- */
  #toggle-side { border: none; background: transparent; font-size: 16px; color: var(--wb-text-2); cursor: pointer; padding: 4px 10px; border-radius: 8px; margin-left: -8px; }
  #toggle-side:hover { background: var(--wb-bg-hover); }
  .topbar .title { flex: 1; margin: 0 12px; }
  @media (min-width: 1720px) { :root { --wb-content-w: 1020px; } }
  @media (max-width: 1180px) {
    aside { width: 210px; }
    .topbar { padding: 0 14px; }
    .preview-panel.show { min-width: 300px; max-width: calc(100vw - 210px - 320px); }
  }
  @media (max-width: 900px) {
    .main { min-width: 0; }
    aside { display: none; }
    body.side-open aside { display: flex; position: fixed; left: 0; top: 0; bottom: 0; z-index: 45; box-shadow: 8px 0 28px rgba(23,24,28,.22); }
    .files-panel.show { position: fixed; right: 0; top: 56px; bottom: 0; width: min(280px, 86vw); z-index: 40; box-shadow: -8px 0 28px rgba(23,24,28,.15); }
    .preview-panel.show { position: fixed; right: 0; top: 56px; bottom: 0; width: min(520px, 92vw); min-width: 0; max-width: none; z-index: 39; box-shadow: -8px 0 28px rgba(23,24,28,.15); }
    .chat-col { padding: 16px 12px 8px; }
    .empty { padding-top: 5vh; }
    .empty h1 { font-size: 26px; }
    .scene-tabs { flex-wrap: wrap; justify-content: center; }

<script>
// ================= 基础状态 =================
let sessionId = null;
let currentMode = "craft";
let settingsCache = null;
let projects = [];
let activeProject = "默认项目"; // 必须在任何 renderHistory() 调用前声明（初始化就会用到）
let currentUser = null; // 登录后由 initAuth() 填充
let SESS_KEY = "wb_sessions"; // 登录后切换为 wb_sessions:<用户名>（每人一份任务历史）
let sessions = JSON.parse(localStorage.getItem(SESS_KEY) || "[]");
const chatCol = document.getElementById("chat-col");
const chatScroll = document.getElementById("chat-scroll");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const mask = document.getElementById("modal-mask");
const modalBox = document.getElementById("modal-box");
const mTitle = document.getElementById("m-title");
const mBody = document.getElementById("m-body");

function saveSessions() { localStorage.setItem(SESS_KEY, JSON.stringify(sessions.slice(0, 50))); }
function esc(s) { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }
function scrollBottom() { chatScroll.scrollTop = chatScroll.scrollHeight; }

// ================= Markdown 渲染（先转义防注入） =================
// 模型偶尔输出「裸语言名 + 无围栏代码」（DeepSeek 常见）：识别后补成 ``` 围栏再走正常渲染
function repairBareCode(str) {
  const LANG = /^(text|plaintext|javascript|js|typescript|ts|python|py|bash|sh|shell|zsh|json|html|xml|svg|css|scss|sql|yaml|yml|java|go|rust|cpp|csharp|ruby|php|swift|kotlin|jsx|tsx|markdown|md)$/i;
  // 「像代码/命令/文件树/日志」的行（文本已 HTML 转义）：缩进、注释、树形符、路径、标记符号、常见命令与语法开头
  const CODE = /^(\s+\S|[│├└─┌┬┴┼]|\/[\w.]|\/\/|#|&lt;|&gt;|["']|\{|\}|\(|\)|\[|`|[■□▶◆●]|[-*]\s|\d+[.)]\s|(const|let|var|function|import|export|from|class|def|async|await|print|python3?|node|npm|npx|pnpm|pip3?|git|cd|ls|cat|curl|wget|brew|docker|ffmpeg|mkdir|cp|mv|echo|source|ssh|chmod)\s|return\b|if\s*\(|for\s*\(|while\s*\(|console\.|\$|[A-Za-z_$][\w$.]*\s*[=({:.]|-{2,})/;
  const lines = str.split("\n");
  const out = [];
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    const t = l.trim();
    if (LANG.test(t)) {
      // 语言名后允许隔 1-2 个空行再开始代码
      let j = i + 1, blanks = 0;
      while (j < lines.length && lines[j].trim() === "" && blanks < 2) { j++; blanks++; }
      if (j < lines.length && CODE.test(lines[j])) {
        const buf = [];
        while (j < lines.length) {
          const cur = lines[j];
          if (cur.trim() === "") {
            // 空行后若还是代码行则把空行收进块内，否则代码块到此结束
            let k = j + 1;
            while (k < lines.length && lines[k].trim() === "") k++;
            if (k < lines.length && CODE.test(lines[k])) { while (j < k) buf.push(lines[j++]); continue; }
            break;
          }
          if (!CODE.test(cur)) break;
          buf.push(cur); j++;
        }
        if (buf.length >= 1) {
          out.push("```" + t.toLowerCase(), ...buf, "```");
          i = j - 1;
          continue;
        }
      }
    }
    out.push(l);
  }
  return out.join("\n");
}

function renderMd(src) {
  if (!src) return "";
  let s = esc(src);
  const codeBlocks = [];
  const pushCode = (lang, code) => {
    codeBlocks.push(`<div class="code-wrap"><div class="code-head"><span>${esc(lang || "")}</span><a class="code-copy" title="复制代码">复制</a></div><pre><code>${code.replace(/\n$/, "")}</code></pre></div>`);
    return `\x00CODE${codeBlocks.length - 1}\x00`;
  };
  const extract = (str) => str.replace(/```(\w*)[^\S\n]*\n?([\s\S]*?)```/g, (_, lang, code) => pushCode(lang, code));
  s = extract(s);
  s = repairBareCode(s);
  s = extract(s);
  // 未闭合围栏（流式输出中 / 模型忘了闭合）：从 ``` 到文末也按代码块渲染
  s = s.replace(/(^|\n)```(\w*)[^\S\n]*\n?([\s\S]*)$/, (_, pre, lang, code) => pre + pushCode(lang, code));
  s = s.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, "$1<em>$2</em>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  const lines = s.split("\n");
  const out = [];
  let listType = null, inQuote = false, para = [], tableRows = null;
  const flushPara = () => { if (para.length) { out.push("<p>" + para.join("<br>") + "</p>"); para = []; } };
  const closeList = () => { if (listType) { out.push(listType === "ul" ? "</ul>" : "</ol>"); listType = null; } };
  const closeQuote = () => { if (inQuote) { out.push("</blockquote>"); inQuote = false; } };
  const closeTable = () => {
    if (!tableRows) return;
    const [head, ...rest] = tableRows;
    out.push('<div class="md-table-wrap"><table><thead><tr>' + head.map(c => `<th>${c}</th>`).join("") + "</tr></thead><tbody>"
      + rest.map(r => "<tr>" + r.map(c => `<td>${c}</td>`).join("") + "</tr>").join("") + "</tbody></table></div>");
    tableRows = null;
  };
  for (let raw of lines) {
    const line = raw.replace(/\s+$/, "");
    let m;
    // 表格：| a | b | 行；分隔行 |---|---| 跳过
    if (/^\s*\|.*\|\s*$/.test(line)) {
      const cells = line.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      if (cells.every(c => /^:?-{3,}:?$/.test(c))) continue;
      flushPara(); closeList(); closeQuote();
      (tableRows = tableRows || []).push(cells);
      continue;
    }
    closeTable();
    // 代码块占位符独立成块，不并进段落（<div> 不能进 <p>）
    if (/^\s*\x00CODE\d+\x00\s*$/.test(line)) {
      flushPara(); closeList(); closeQuote();
      out.push(line.trim());
      continue;
    }
    if ((m = line.match(/^(?:&gt;)\s?(.*)$/))) {
      flushPara(); closeList();
      if (!inQuote) { out.push("<blockquote>"); inQuote = true; }
      out.push("<p>" + (m[1] || "") + "</p>");
      continue;
    }
    closeQuote();
    if ((m = line.match(/^(#{1,4})\s+(.*)$/))) {
      flushPara(); closeList();
      out.push(`<h${m[1].length}>${m[2]}</h${m[1].length}>`);
    } else if (/^(-{3,}|\*{3,})$/.test(line)) {
      flushPara(); closeList(); out.push("<hr>");
    } else if ((m = line.match(/^\s*[-*]\s+(.*)$/))) {
      flushPara();
      if (listType !== "ul") { closeList(); out.push("<ul>"); listType = "ul"; }
      out.push("<li>" + m[1] + "</li>");
    } else if ((m = line.match(/^\s*\d+[.、]\s+(.*)$/))) {
      flushPara();
      if (listType !== "ol") { closeList(); out.push("<ol>"); listType = "ol"; }
      out.push("<li>" + m[1] + "</li>");
    } else if (line.trim() === "") {
      flushPara(); closeList();
    } else {
      closeList();
      para.push(line);
    }
  }
  flushPara(); closeList(); closeQuote(); closeTable();
  return out.join("\n").replace(/\x00CODE(\d+)\x00/g, (_, i) => codeBlocks[+i]);
}

// ================= 回合渲染（实时流式与历史回放共用） =================
function createTurnUI(userText, turnMode) {
  document.getElementById("empty")?.remove();
  const turn = document.createElement("div");
  turn.className = "turn";
  turn.innerHTML = `<div class="u-msg"><div class="bubble"></div></div>
    <div class="a-msg"><div class="avatar">W</div><div class="body"></div></div>`;
  turn.querySelector(".bubble").innerHTML = hlTokens(userText, "tk-b");
  chatCol.appendChild(turn);
  // 新回合出现后，旧回合的「重新生成」按钮全部撤掉（只允许重生成最后一轮）
  chatCol.querySelectorAll(".turn-actions [data-a=regen]").forEach(b => { if (!turn.contains(b)) b.remove(); });
  const body = turn.querySelector(".body");
  turn._userText = userText;
  turn._mode = turnMode;
  let currentText = null;

  // 执行过程折叠区（仿官方「已完成 12s ›」）：过程卡片都收进去，正文文本在外面
  let procWrap = null, procBody = null, procTimer = null;
  const t0 = Date.now();
  const fmtDur = (ms) => { const s = Math.max(1, Math.round(ms / 1000)); return s < 60 ? s + "s" : Math.floor(s / 60) + "m" + (s % 60) + "s"; };
  const ensureProc = () => {
    if (!procBody) {
      procWrap = document.createElement("div");
      procWrap.className = "proc-wrap open";
      procWrap.innerHTML = `<div class="proc-head"><span class="spinner"></span><span class="pt">运行中…</span><span class="arrow">›</span></div><div class="proc-body"></div>`;
      procBody = procWrap.querySelector(".proc-body");
      procWrap.querySelector(".proc-head").onclick = () => procWrap.classList.toggle("open");
      // 追加（不是 prepend）：开场白留在折叠区上方可见，仿官方「先说在做什么 → 过程收起 → 结论在外」
      body.appendChild(procWrap);
      procTimer = setInterval(() => {
        const pt = procWrap.querySelector(".pt");
        if (pt) pt.textContent = `运行中 ${fmtDur(Date.now() - t0)}`;
      }, 1000);
    }
    return procBody;
  };

  const ensureText = () => {
    if (!currentText) {
      currentText = document.createElement("div");
      currentText.className = "a-text";
      currentText._raw = "";
      // 过程区一旦出现，后续文字都算"过程叙述"进折叠区；finish() 会把最后一段（最终结论）提出来
      (procBody || body).appendChild(currentText);
    }
    return currentText;
  };
  const appendText = (delta) => {
    const el = ensureText();
    el._raw += delta;
    el.innerHTML = renderMd(el._raw);
  };

  function handleEvent(ev) {
    if (ev.type === "step_start") {
      if (ev.depth > 0) return;
      body.querySelector(".thinking-hint")?.remove();
      const hint = document.createElement("div");
      hint.className = "thinking-hint";
      hint.style.cssText = "font-size:12px;color:var(--wb-text-3);margin:6px 0;display:flex;align-items:center;gap:6px";
      hint.innerHTML = `<span class="spinner"></span> 第 ${ev.step} 步 · 思考规划中…`;
      // 首步的提示放正文（此时还没有过程区，别为它建一个）；后续步的提示进过程区
      (procBody || body).appendChild(hint);
      currentText = null;
    } else if (ev.type === "text") {
      if (ev.depth > 0) return;
      body.querySelector(".thinking-hint")?.remove();
      appendText(ev.delta);
    } else if (ev.type === "expert_start") {
      currentText = null;
      const banner = document.createElement("div");
      banner.className = "step-card";
      banner.innerHTML = `<div class="head"><span class="tag">👥 ${esc(ev.expert)}</span><span class="desc">专家接手子任务：${esc((ev.task || "").slice(0, 60))}</span></div>`;
      ensureProc().appendChild(banner);
    } else if (ev.type === "tool_use") {
      body.querySelector(".thinking-hint")?.remove();
      currentText = null;
      const card = document.createElement("div");
      card.className = "step-card";
      const who = ev.expert ? `${esc(ev.expert)} · ` : "";
      card.innerHTML =
        `<div class="head"><span class="tag">⚙ ${who}${esc(ev.name)}</span>` +
        `<span class="desc">${esc(ev.purpose || "")}</span><span class="spinner"></span></div>` +
        `<pre>${esc(ev.input_preview || "")}</pre>`;
      card.querySelector(".head").onclick = () => card.classList.toggle("open");
      ensureProc().appendChild(card);
      // 未完成卡片入栈；专家的内层工具卡与协调者的委派卡按 depth 区分，防止张冠李戴
      card._depth = ev.depth || 0;
      (body._openCards = body._openCards || []).push(card);
    } else if (ev.type === "tool_result") {
      const stack = body._openCards || [];
      let card = null;
      for (let i = stack.length - 1; i >= 0; i--) {
        if (stack[i]._depth === (ev.depth || 0)) { card = stack.splice(i, 1)[0]; break; }
      }
      if (!card) card = stack.pop();
      if (card) {
        card.querySelector(".spinner")?.remove();
        const tag = document.createElement("span");
        tag.className = "tag " + (ev.isError ? "err" : "ok");
        tag.textContent = ev.isError ? "失败" : "完成";
        card.querySelector(".head").appendChild(tag);
        card.querySelector("pre").textContent += "\n\n── 执行结果 ──\n" + (ev.preview || "");
        if (ev.isError) card.classList.add("open");
      }
    } else if (ev.type === "limit") {
      currentText = null;
      const note = document.createElement("div");
      note.style.cssText = "font-size:12px;color:var(--wb-err);margin:6px 0";
      note.textContent = `⏱ ${ev.note || "已达执行上限"}，任务强制收尾`;
      ensureProc().appendChild(note);
      procWrap?.classList.add("open");
      turn._limited = true;
    } else if (ev.type === "usage") {
      // 插队会触发多轮 runTask、发多个 usage 事件 → 累加而不是覆盖
      if (!turn._usage) turn._usage = { ...ev };
      else {
        turn._usage.prompt += ev.prompt || 0;
        turn._usage.completion += ev.completion || 0;
        turn._usage.calls += ev.calls || 0;
        turn._usage.elapsed_ms += ev.elapsed_ms || 0;
      }
    } else if (ev.type === "interject") {
      currentText = null;
      const note = document.createElement("div");
      note.className = "interject-note";
      note.innerHTML = `<div class="lb">⚡ 插队补充</div>${esc(ev.text || "")}`;
      body.appendChild(note);
    } else if (ev.type === "credits") {
      turn._credits = ev; // 结束时由操作条展示「扣 X 积分 · 余额 Y」
      if (currentUser) { currentUser.credits = ev.balance; renderUserChip(); }
    } else if (ev.type === "files") {
      renderFiles(ev.files);
      autoPreviewNewHtml(ev.files);
      // 预览打开时不再展开文件面板，避免挤压聊天区
      if (ev.files && ev.files.length && !pvPanel.classList.contains("show")) {
        document.getElementById("files-panel").classList.add("show");
      } else if (pvPanel.classList.contains("show")) {
        document.getElementById("files-panel").classList.remove("show");
      }
    } else if (ev.type === "error") {
      currentText = null;
      const t = document.createElement("div");
      t.className = "a-text";
      t.style.color = "var(--wb-err)";
      t.textContent = "出错了：" + (ev.message || "");
      body.appendChild(t); // 错误必须留在正文可见，不进折叠区
    }
    scrollBottom();
  }

  function finish() {
    body.querySelector(".thinking-hint")?.remove();
    // 回合结束后不允许再有任何转圈（含未收到结果的工具卡，统一标记中止）
    turn.querySelectorAll(".step-card .spinner").forEach(s => {
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = "中止";
      s.closest(".head")?.appendChild(tag);
      s.remove();
    });
    turn.querySelectorAll(".spinner").forEach(s => s.remove());
    // 过程折叠区收尾：停计时、写「已完成 Xs」、默认折叠（出错/被截断则保持展开）
    if (procTimer) { clearInterval(procTimer); procTimer = null; }
    if (procWrap) {
      // 最后一段正文是最终结论 → 提出折叠区保持可见（开场白在上、结论在下、过程收起）
      const texts = procBody.querySelectorAll(":scope > .a-text");
      if (texts.length) body.appendChild(texts[texts.length - 1]);
      if (!procBody.childElementCount) {
        procWrap.remove();
      } else {
        const ms = (turn._usage && turn._usage.elapsed_ms) || Date.now() - t0;
        const n = procBody.querySelectorAll(".step-card").length;
        procWrap.querySelector(".pt").textContent = `已完成 ${fmtDur(ms)}` + (n ? ` · ${n} 步` : "");
        const hasErr = !!procBody.querySelector(".tag.err") || turn._limited;
        if (!hasErr) procWrap.classList.remove("open");
      }
    }
    addActionsBar();
    if (turnMode === "plan") renderPlanChecklist();
  }

  // 官方式回复操作条：复制 / 👍👎 / 重新生成 + 共消耗 tokens · 模型
  function addActionsBar() {
    if (turn.querySelector(".turn-actions")) return;
    const bar = document.createElement("div");
    bar.className = "turn-actions";
    bar.innerHTML =
      `<button class="ta-btn" data-a="copy" title="复制回复">⧉</button>` +
      `<button class="ta-btn" data-a="up" title="有帮助">👍</button>` +
      `<button class="ta-btn" data-a="down" title="没帮助">👎</button>` +
      `<button class="ta-btn" data-a="regen" title="重新生成">↻ 重新生成</button>` +
      `<span class="ta-meta"></span>`;
    const u = turn._usage;
    const meta = bar.querySelector(".ta-meta");
    if (u && (u.prompt || u.completion)) {
      meta.textContent = `共消耗 ✧ ${(u.prompt + u.completion).toLocaleString()} tokens · ${u.provider || ""}（${u.model || ""}）`;
      meta.title = `输入 ${u.prompt.toLocaleString()} + 输出 ${u.completion.toLocaleString()} tokens · ${u.calls} 次模型调用`;
    } else if (u) {
      meta.textContent = `${u.provider || ""}（${u.model || ""}）`;
    }
    if (turn._credits) {
      meta.textContent += `${meta.textContent ? " · " : ""}扣 ${turn._credits.spent} 积分（余 ${(+turn._credits.balance).toLocaleString()}）`;
    }
    bar.querySelector("[data-a=copy]").onclick = (e) => {
      const texts = [...body.querySelectorAll(".a-text")].map(t => t._raw || t.textContent).join("\n\n");
      navigator.clipboard?.writeText(texts).then(() => {
        e.target.textContent = "✓"; setTimeout(() => { e.target.textContent = "⧉"; }, 1200);
      });
    };
    bar.querySelector("[data-a=up]").onclick = (e) => {
      e.target.classList.toggle("on"); bar.querySelector("[data-a=down]").classList.remove("on");
    };
    bar.querySelector("[data-a=down]").onclick = (e) => {
      e.target.classList.toggle("on"); bar.querySelector("[data-a=up]").classList.remove("on");
    };
    bar.querySelector("[data-a=regen]").onclick = () => {
      if (taskBusy) return;
      const text = turn._userText, mode = turn._mode;
      turn.remove();
      doSend(text, mode, true);
    };
    body.appendChild(bar);
  }

  // Plan 模式：把执行计划解析成任务列表卡片
  function renderPlanChecklist() {
    const texts = body.querySelectorAll(".a-text");
    const raw = texts.length ? texts[texts.length - 1]._raw || "" : "";
    let steps = [...raw.matchAll(/^\s*\d+[.、)]\s+(.+)$/gm)].map(m => m[1]);
    if (steps.length < 2) steps = [...raw.matchAll(/^\s*[-*]\s+(.+)$/gm)].map(m => m[1]);
    steps = steps.map(s => s.replace(/\*\*/g, "").trim()).filter(s => s.length > 2).slice(0, 20);
    if (steps.length < 2) return;
    const card = document.createElement("div");
    card.className = "plan-list";
    card.innerHTML = `<div class="pl-head">📋 计划任务列表（${steps.length} 步）</div>`
      + steps.map(s => `<label class="pl-item"><input type="checkbox"> <span>${esc(s)}</span></label>`).join("")
      + `<button class="pl-run">▶ 切换 Craft 按此计划执行</button>`;
    card.querySelector(".pl-run").onclick = () => {
      setMode("craft");
      inputEl.value = "请严格按照以下计划执行，每完成一步简要汇报：\n" + steps.map((s, i) => `${i + 1}. ${s}`).join("\n");
      syncInputHl();
      inputEl.focus();
      scrollBottom();
    };
    body.appendChild(card);
    scrollBottom();
  }
  return { handleEvent, finish };
}

};

  sceneTag = label;

function buildEmpty() {

// ================= @ 引用文件 / 调用技能 自动补全 =================
let filesCache = [], skillsCache = [];
fetch("/api/skills").then(r => r.json()).then(l => skillsCache = l).catch(() => {});
const mentionMenu = document.getElementById("mention-menu");
let mentionState = null; // {trigger:'@'|'/', start, query}

function detectMention() {
  const pos = inputEl.selectionStart;
  const before = inputEl.value.slice(0, pos);
  const m = before.match(/(?:^|[\s（(])([@/])([^\s@/]*)$/);
  if (!m) { mentionState = null; mentionMenu.classList.remove("show"); return; }
  mentionState = { trigger: m[1], query: m[2], start: pos - m[2].length - 1 };
  if (m[1] === "@") refreshFilesCache();
  renderMentionMenu();
}
let filesFetchAt = 0;
function refreshFilesCache() {
  if (Date.now() - filesFetchAt < 3000) return; // 3 秒内不重复拉
  filesFetchAt = Date.now();
  fetch("/api/files").then(r => r.json()).then(f => {
    filesCache = f || [];
    if (mentionState && mentionState.trigger === "@") renderMentionMenu();
  }).catch(() => {});
}
function renderMentionMenu() {
  const { trigger, query } = mentionState;
  let items = [];
  if (trigger === "@") {
    items = filesCache.filter(f => f.name.toLowerCase().includes(query.toLowerCase()))
      .slice(0, 12).map(f => ({ label: `${fileIcon(f.name)} ${f.name}`, insert: "@" + f.name, sub: "工作空间文件" }));
    if (!items.length) items = [{ label: "（工作空间还没有文件，可点 ＋ 上传）", insert: null }];
  } else {
    items = skillsCache.filter(s => s.name.toLowerCase().includes(query.toLowerCase()) || s.description.includes(query))
      .slice(0, 12).map(s => ({ label: "📦 /" + s.name, insert: "/" + s.name, sub: s.description }));
    if (!items.length) items = [{ label: "（没有匹配的技能）", insert: null }];
  }
  mentionMenu.innerHTML = `<div class="mh">${trigger === "@" ? "引用工作空间文件" : "调用技能"}</div>` +
    items.map((it, i) => `<div class="mi ${i === 0 && it.insert ? "sel" : ""}" data-insert="${esc(it.insert || "")}">${it.label}${it.sub ? `<span class="sub">${esc(it.sub)}</span>` : ""}</div>`).join("");
  mentionMenu.classList.add("show");
  mentionMenu.querySelectorAll(".mi").forEach(mi => mi.onclick = () => applyMention(mi.dataset.insert));
}
function applyMention(insert) {
  if (!insert || !mentionState) { mentionMenu.classList.remove("show"); return; }
  const pos = inputEl.selectionStart;
  inputEl.value = inputEl.value.slice(0, mentionState.start) + insert + " " + inputEl.value.slice(pos);

  inputEl.setSelectionRange(newPos, newPos);

  mentionMenu.classList.remove("show");

  syncInputHl();
}

// ================= 成果文件 =================
function fileIcon(name) {
  if (/\.pptx?$/i.test(name)) return "📊";
  if (/\.docx?$/i.test(name)) return "📄";
  if (/\.xlsx?$/i.test(name)) return "📈";
  if (/\.(md|txt)$/i.test(name)) return "📝";
  if (/\.csv$/i.test(name)) return "🗂️";
  return "📎";
}
function fmtSize(n) { return n > 1048576 ? (n/1048576).toFixed(1)+" MB" : n > 1024 ? (n/1024).toFixed(1)+" KB" : n+" B"; }
const openDirs = new Set(); // 记住展开状态，刷新列表不回弹
function renderFiles(files) {
  filesCache = files || [];
  const el = document.getElementById("file-list");
  if (!files || !files.length) { el.innerHTML = '<div style="padding:10px;color:var(--wb-text-3);font-size:12px">暂无成果文件</div>'; return; }
  const fileRow = (f, nested) =>
    `<div class="file-item${nested ? " nested" : ""}" style="cursor:pointer" data-name="${esc(f.name)}" title="${esc(f.name)}">
      <span>${fileIcon(f.name)}</span>
      <span style="min-width:0"><div class="name">${esc(f.name.split("/").pop())}</div><div class="meta">${fmtSize(f.size)}</div></span>
      <a class="dl" href="/api/files/download/${encodeURIComponent(f.name)}" download title="下载">⬇</a>
    </div>`;
  // 根目录文件（智能体产出）置顶按时间排；子目录归成可折叠分组
  const rootFiles = files.filter(f => !f.name.includes("/"));
  const groups = {};
  for (const f of files) {
    if (!f.name.includes("/")) continue;
    const dir = f.name.slice(0, f.name.lastIndexOf("/"));
    (groups[dir] = groups[dir] || []).push(f);
  }
  let html = rootFiles.map(f => fileRow(f, false)).join("");
  for (const dir of Object.keys(groups).sort((a, b) => a.localeCompare(b, "zh"))) {
    const open = openDirs.has(dir);
    html += `<div class="dir-head" data-dir="${esc(dir)}"><span>${open ? "▾" : "▸"}</span><span>📁</span><div class="name">${esc(dir)}</div><span class="cnt">${groups[dir].length}</span></div>`;
    if (open) html += groups[dir].sort((a, b) => a.name.localeCompare(b.name, "zh")).map(f => fileRow(f, true)).join("");
  }
  el.innerHTML = html;
  el.querySelectorAll(".dir-head").forEach(h => h.onclick = () => {
    openDirs.has(h.dataset.dir) ? openDirs.delete(h.dataset.dir) : openDirs.add(h.dataset.dir);
    renderFiles(filesCache);
  });
  el.querySelectorAll(".file-item").forEach(item => item.onclick = (e) => {
    if (e.target.closest(".dl")) return; // 下载按钮不拦截
    e.preventDefault();
    previewFile(item.dataset.name);
  });
}

// ================= 发送（运行中按钮变「停止」） =================
let taskBusy = false;
const msgQueue = []; // 任务运行中新发的消息先排队，当前任务结束后按序自动执行
function setSendBusy(on) {
  taskBusy = on;
  sendBtn.classList.toggle("stop", on);
  sendBtn.textContent = on ? "◼" : "↑";
  sendBtn.title = on ? "停止任务" : "发送";
  document.getElementById("interject-btn").classList.toggle("show", on);
  renderQueueBar();
}
function renderQueueBar() {
  const bar = document.getElementById("queue-bar");
  if (!taskBusy && !msgQueue.length) { bar.classList.remove("show"); bar.innerHTML = ""; return; }
  bar.classList.add("show");
  bar.innerHTML =
    msgQueue.map((m, i) => `<span class="q-chip" title="${esc(m.text)}"><span class="qt">⏳ ${esc(m.text.slice(0, 30))}</span><span class="qx" data-i="${i}" title="取消这条">✕</span></span>`).join("") +
    (taskBusy ? `<span>任务运行中：Enter 发送=排队等下一轮 · ⚡ 插队=立即注入当前任务 · ◼ 停止</span>` : "");
  bar.querySelectorAll(".qx").forEach(x => x.onclick = () => { msgQueue.splice(+x.dataset.i, 1); renderQueueBar(); });
}
function drainQueue() {
  if (taskBusy || !msgQueue.length) return;
  const m = msgQueue.shift();
  renderQueueBar();
  doSend(m.text, m.mode);
}
async function interject() {
  const text = inputEl.value.trim();
  if (!text || !sessionId) return;
  const resp = await fetch("/api/chat/interject", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sessionId, message: text }),
  }).catch(() => null);
  const d = resp ? await resp.json().catch(() => ({})) : {};
  if (resp && resp.ok) {
    inputEl.value = "";
    syncInputHl();
  } else {
    // 任务恰好刚结束 → 转排队立即执行
    msgQueue.push({ text, mode: currentMode });
    inputEl.value = "";
    syncInputHl();
    renderQueueBar();
    drainQueue();
  }
}

async function send() {

// regen=true 表示「重新生成」：服务端回滚最后一轮再重跑同一条消息
async function doSend(text, mode, regen) {
  if (taskBusy) return;
  setSendBusy(true);
  closeAssistView();

  if (!sessionId) {
    sessionId = "s_" + Date.now() + "_" + Math.floor(Math.random() * 1e6);
    sessions.unshift({ id: sessionId, title: text.slice(0, 24), at: Date.now(), project: activeProject });
    saveSessions();
    document.getElementById("session-title").textContent = text.slice(0, 24);
    renderHistory();
  }

  const ui = createTurnUI(text, mode);
  scrollBottom();

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId, message: text, mode, regen: !!regen }),
    });
    if (!resp.ok) {
      const d = await resp.json().catch(() => ({}));
      ui.handleEvent({ type: "error", message: d.error || `请求失败（HTTP ${resp.status}）` });
      if (resp.status === 401) showAuth(!!d.setup);
    } else {
      const reader = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const parts = buf.split("\n\n");
        buf = parts.pop();
        for (const part of parts) {
          if (!part.startsWith("data: ")) continue;
          try { ui.handleEvent(JSON.parse(part.slice(6))); } catch {}
        }
      }
    }
  } catch (e) {
    ui.handleEvent({ type: "error", message: e.message });
  }

  ui.finish();
  setSendBusy(false);
  inputEl.focus();
  drainQueue(); // 运行期间排队的消息按序自动执行
}
sendBtn.onclick = () => (taskBusy ? stopTask() : send());

// [id, 名称, 默认键, 固定?, 系统级?]；用户改绑存 config.shortcuts（只存改过的项）
const SHORTCUT_DEFS = [
  ["open-settings", "打开设置", "Meta+Comma"],
  ["voice-record", "语音录制开关", "Meta+D"],
  ["chat-search", "对话内搜索", "Meta+F"],
  ["send", "发送消息", "Enter", true],
  ["newline", "输入时换行", "Shift+Enter", true],
  ["new-chat", "新建对话", "Meta+N"],
  ["stop", "停止生成 / 关闭弹层", "Escape"],
  ["prev-task", "上一个任务", "Meta+BracketLeft"],
  ["next-task", "下一个任务", "Meta+BracketRight"],
  ["toggle-sidebar", "切换左侧栏", "Meta+B"],
  ["toggle-files", "切换右侧产物面板", "Shift+Meta+B"],
  ["fullscreen", "进入/退出全屏", "Ctrl+Meta+F"],
  ["toggle-window", "唤起/隐藏主窗口", "Shift+Alt+W", false, true],
  ["open-skills", "打开技能库", "Shift+Meta+K"],
  ["open-experts", "打开专家团", "Shift+Meta+E"],
  ["open-library", "打开资料库", "Shift+Meta+L"],
  ["open-sched", "打开定时任务", "Shift+Meta+T"],
  ["open-assistant", "打开本地助理", "Shift+Meta+A"],
];
function canonAccel(a) {
  const mods = [], keys = [];
  for (const p of String(a || "").split("+").map(x => x.trim()).filter(Boolean)) {
    const m = { meta: "Meta", cmd: "Meta", command: "Meta", ctrl: "Ctrl", control: "Ctrl", alt: "Alt", option: "Alt", shift: "Shift" }[p.toLowerCase()];
    if (m) { if (!mods.includes(m)) mods.push(m); } else keys.push(p);
  }
  const order = { Ctrl: 0, Alt: 1, Shift: 2, Meta: 3 };
  mods.sort((x, y) => order[x] - order[y]);
  return mods.concat(keys).join("+");
}
function accelFromEvent(e) {
  if (/^(Meta|Control|Alt|Shift)/.test(e.code)) return null; // 只按了修饰键
  const parts = [];
  if (e.ctrlKey) parts.push("Ctrl");
  if (e.altKey) parts.push("Alt");
  if (e.shiftKey) parts.push("Shift");
  if (e.metaKey) parts.push("Meta");
  parts.push(e.code.replace(/^Key/, "").replace(/^Digit/, ""));
  return parts.join("+");
}
function accelDisplay(a) {
  const KEY = { Comma: ",", Period: ".", BracketLeft: "[", BracketRight: "]", Escape: "Esc", Enter: "⏎", Space: "空格", Minus: "-", Equal: "=", Slash: "/", Backslash: "\\", Semicolon: ";", Quote: "'", Backquote: "`" };
  const MOD = { Meta: "⌘", Ctrl: "⌃", Alt: "⌥", Shift: "⇧" };
  const parts = canonAccel(a).split("+");
  // mac 习惯顺序 ⌃⌥⇧⌘
  const mods = ["Ctrl", "Alt", "Shift", "Meta"].filter(m => parts.includes(m)).map(m => MOD[m]);
  return mods.join("") + parts.filter(p => !MOD[p]).map(p => KEY[p] || p).join("");
}
let toastTimer = null;
function toast(msg) {
  let t = document.getElementById("wb-toast");
  if (!t) { t = document.createElement("div"); t.id = "wb-toast"; document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2200);
}

    else document.documentElement.requestFullscreen().catch(() => {});

}
function navTask(dir) {
  const list = sessions.filter(s => (s.project || "默认项目") === activeProject);
  if (!list.length) return;

}
const SHORTCUT_ACTIONS = {
  "open-settings": () => openModal("settings"),
  "voice-record": () => toast("🎤 语音录制暂未支持（复刻版）"),
  "chat-search": () => openChatSearch(),
  "new-chat": () => document.getElementById("new-task").click(),
  "stop": () => {
    const cs = document.getElementById("chat-search");
    if (mask.classList.contains("show")) mask.classList.remove("show");
    else if (cs && cs.style.display === "flex") closeChatSearch();
    else if (taskBusy) stopTask();
  },
  "prev-task": () => navTask(-1),
  "next-task": () => navTask(1),
  "toggle-sidebar": () => toggleSidebar(),
  "toggle-files": () => document.getElementById("files-panel").classList.toggle("show"),
  "fullscreen": toggleAppFullscreen,
  "toggle-window": () => {}, // 系统级快捷键由桌面版主进程注册，网页端无动作
  "open-skills": () => openModal("skills"),
  "open-experts": () => openModal("experts"),
  "open-library": () => openModal("library"),
  "open-sched": () => openModal("sched"),
  "open-assistant": () => openAssistView(),
};
document.addEventListener("keydown", (e) => {
  if (window.__scRebinding) return; // 设置页改绑捕获中，不触发动作
  const acc = accelFromEvent(e);
  if (!acc) return;
  const canon = canonAccel(acc);
  const inText = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName || "") || e.target.isContentEditable;
  const map = (settingsCache && settingsCache.shortcuts) || {};
  for (const [id, , def, fixed] of SHORTCUT_DEFS) {
    if (fixed || !SHORTCUT_ACTIONS[id]) continue;
    if (canonAccel(map[id] || def) !== canon) continue;
    if (!/Meta|Ctrl|Alt/.test(canon) && inText && canon !== "Escape") return; // 无修饰键的组合在输入框里只放行 Esc
    e.preventDefault();
    SHORTCUT_ACTIONS[id]();
    return;
  }
});

let csMatches = [], csIdx = -1;
function openChatSearch() {
  let bar = document.getElementById("chat-search");
  if (!bar) {
    bar = document.createElement("div");
    bar.id = "chat-search";
    bar.innerHTML = `<input id="cs-input" placeholder="搜索对话内容…"><span id="cs-count" style="color:var(--wb-text-3);font-size:12px;white-space:nowrap"></span><button id="cs-prev" title="上一个">↑</button><button id="cs-next" title="下一个">↓</button><button id="cs-close" title="关闭 (Esc)">✕</button>`;
    document.querySelector(".main").appendChild(bar);
    bar.querySelector("#cs-input").oninput = runChatSearch;
    bar.querySelector("#cs-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); csNav(e.shiftKey ? -1 : 1); }
      if (e.key === "Escape") { e.stopPropagation(); closeChatSearch(); }
    });
    bar.querySelector("#cs-prev").onclick = () => csNav(-1);
    bar.querySelector("#cs-next").onclick = () => csNav(1);
    bar.querySelector("#cs-close").onclick = closeChatSearch;
  }
  bar.style.display = "flex";
  bar.querySelector("#cs-input").focus();
  bar.querySelector("#cs-input").select();
}
function closeChatSearch() {
  const bar = document.getElementById("chat-search");
  if (bar) bar.style.display = "none";
  csMatches.forEach(m => m.classList.remove("search-hit"));
  csMatches = [];
  csIdx = -1;
  inputEl.focus();
}
function runChatSearch() {
  csMatches.forEach(m => m.classList.remove("search-hit"));
  csMatches = [];
  csIdx = -1;
  const q = document.getElementById("cs-input").value.trim().toLowerCase();
  const cnt = document.getElementById("cs-count");
  if (!q) { cnt.textContent = ""; return; }
  for (const el of chatCol.querySelectorAll(".u-msg .bubble, .a-text")) {
    if (el.textContent.toLowerCase().includes(q)) csMatches.push(el);
  }
  cnt.textContent = csMatches.length ? `0/${csMatches.length}` : "无结果";
  if (csMatches.length) csNav(1);
}
function csNav(dir) {
  if (!csMatches.length) return;
  if (csIdx >= 0) csMatches[csIdx].classList.remove("search-hit");
  csIdx = (csIdx + dir + csMatches.length) % csMatches.length;
  csMatches[csIdx].classList.add("search-hit");
  csMatches[csIdx].scrollIntoView({ block: "center", behavior: "smooth" });
  document.getElementById("cs-count").textContent = `${csIdx + 1}/${csMatches.length}`;
}

// 代码块「复制」按钮（事件委托，覆盖所有历史与流式渲染出的代码块）
document.addEventListener("click", (e) => {
  const btn = e.target.closest(".code-copy");
  if (!btn) return;
  const pre = btn.closest(".code-wrap")?.querySelector("pre");
  if (!pre) return;
  const text = pre.textContent || "";
  const done = () => { btn.textContent = "已复制 ✓"; setTimeout(() => { btn.textContent = "复制"; }, 1500); };
  if (navigator.clipboard?.writeText) { navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done)); }
  else fallbackCopy(text, done);
  function fallbackCopy(t, cb) {
    const ta = document.createElement("textarea");
    ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch {}
    document.body.removeChild(ta); cb();
  }
});

  document.getElementById("auth-sub").textContent = setup

    : reg ? "新账号默认为成员（1000 积分）" : "登录后使用你自己的积分与任务历史";
  document.getElementById("auth-go").textContent = reg ? "注册并登录" : "登录";
  document.getElementById("auth-alt").style.display = setup ? "none" : "";

    : '还没有账号？<a id="auth-switch">注册一个</a>';

}
async function submitAuth() {
  const username = document.getElementById("auth-user").value.trim();
  const password = document.getElementById("auth-pass").value;
  const errEl = document.getElementById("auth-err");
  if (!username || !password) { errEl.textContent = "用户名和密码都要填"; return; }
  const resp = await fetch(authMode === "register" ? "/api/auth/register" : "/api/auth/login", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ username, password }),
  }).catch(() => null);
  const d = resp ? await resp.json().catch(() => ({})) : {};
  if (resp && resp.ok) location.reload(); // 带上 cookie 重新初始化整个界面（最省事也最不易漏）
  else errEl.textContent = d.error || "失败了，稍后再试";
}

// ================= 定时任务（可视化，不写 cron） =================
function buildCron() {
  const freq = mBody.querySelector("#sf-freq").value;
  const t = (mBody.querySelector("#sf-time").value || "09:00").split(":");
  const m = +t[1] || 0, h = +t[0] || 9;
  switch (freq) {
    case "daily": return `${m} ${h} * * *`;
    case "workday": return `${m} ${h} * * 1-5`;
    case "weekly": return `${m} ${h} * * ${mBody.querySelector("#sf-dow").value}`;
    case "monthly": return `${m} ${h} ${mBody.querySelector("#sf-dom").value} * *`;
    case "hourly": return `${m} * * * *`;
    case "half-hour": return `*/30 * * * *`;
    case "custom": return mBody.querySelector("#sf-cron").value.trim();
  }
}
function cronToHuman(cron) {
  const m = cron.match(/^(\d+) (\d+) (\S+) \* (\S+)$/);
  if (cron.startsWith("*/30")) return "每 30 分钟";
  if (m) {
    const time = `${m[2].padStart(2,"0")}:${m[1].padStart(2,"0")}`;
    if (m[3] === "*" && m[4] === "*") return `每天 ${time}`;
    if (m[4] === "1-5") return `工作日 ${time}`;
    if (m[3] === "*" && /^\d$/.test(m[4])) return `每周${"日一二三四五六"[+m[4]]} ${time}`;
    if (/^\d+$/.test(m[3])) return `每月 ${m[3]} 日 ${time}`;
  }
  if (/^(\d+) \* \* \* \*$/.test(cron)) return `每小时第 ${cron.split(" ")[0]} 分`;
  return cron;
}

// ================= 快捷键面板 =================
function renderShortcutsPane(pane, s) {
  const cur = { ...(s.shortcuts || {}) };
  pane.innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
      <input id="sc-search" placeholder="搜索快捷键" style="flex:1;margin:0">
      <button class="btn-brand" id="sc-reset" style="white-space:nowrap">全部恢复默认</button>
    </div>
    <div class="d" style="margin-bottom:4px">共 ${SHORTCUT_DEFS.length} 条 · 点击右侧按键，然后直接按下新组合键即可改绑（Esc 取消）。「唤起/隐藏主窗口」是系统级快捷键，仅桌面版生效。</div>
    <div id="sc-list"></div><span class="ok-msg" id="sc-msg" style="display:block;margin-top:8px"></span>`;
  const draw = (filter) => {
    pane.querySelector("#sc-list").innerHTML = SHORTCUT_DEFS
      .filter(([id, label]) => !filter || label.includes(filter) || id.includes(filter.toLowerCase()))
      .map(([id, label, def, fixed, isGlobal]) => {
        const acc = cur[id] || def;
        const changed = cur[id] && canonAccel(cur[id]) !== canonAccel(def);
        return `<div style="display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--wb-border);font-size:13px">
          <span style="flex:1">${esc(label)}${isGlobal ? ' <span style="font-size:11px;color:var(--wb-text-3)">系统级</span>' : ""}${changed ? ` <a href="#" class="link" style="font-size:11px" data-restore="${id}">恢复默认</a>` : ""}</span>
          ${fixed
            ? `<span style="color:var(--wb-text-3);font-size:11px">固定</span><kbd class="sc-kbd">${esc(accelDisplay(acc))}</kbd>`
            : `<kbd class="sc-kbd sc-edit" data-id="${id}" title="点击后按下新组合键">${esc(accelDisplay(acc))}</kbd>`}
        </div>`;
      }).join("") || '<div style="color:var(--wb-text-3);padding:10px 4px;font-size:13px">没有匹配的快捷键</div>';
    bindRows();
  };
  const save = () => saveSettings({ shortcuts: cur }, pane.querySelector("#sc-msg"))
    .then(() => draw(pane.querySelector("#sc-search").value.trim()));
  function bindRows() {
    pane.querySelectorAll("[data-restore]").forEach(a => a.onclick = (e) => { e.preventDefault(); delete cur[a.dataset.restore]; save(); });
    pane.querySelectorAll(".sc-edit").forEach(k => k.onclick = () => {
      if (window.__scRebinding) return;
      window.__scRebinding = true;
      k.textContent = "按下新组合键…";
      k.classList.add("armed");
      const cleanup = () => { document.removeEventListener("keydown", onKey, true); window.__scRebinding = false; };
      const onKey = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (e.key === "Escape" && !e.metaKey && !e.ctrlKey && !e.altKey && !e.shiftKey) { cleanup(); draw(pane.querySelector("#sc-search").value.trim()); return; }
        const acc = accelFromEvent(e);
        if (!acc) return; // 只按了修饰键，继续等主键
        const canon = canonAccel(acc);
        const clash = SHORTCUT_DEFS.find(([id2, , def2]) => id2 !== k.dataset.id && canonAccel(cur[id2] || def2) === canon);
        if (clash) { k.textContent = `与「${clash[1]}」冲突，换一个`; return; }
        cur[k.dataset.id] = canon;
        cleanup();
        save();
      };
      document.addEventListener("keydown", onKey, true);
    });
  }
  pane.querySelector("#sc-search").oninput = (e) => draw(e.target.value.trim());
  pane.querySelector("#sc-reset").onclick = () => {
    if (!confirm("全部恢复默认快捷键？")) return;
    for (const key of Object.keys(cur)) delete cur[key];
    save();
  };
  draw("");
}

async function renderMcpPane(pane) {
  pane.innerHTML = '<div class="ab-empty">加载中…</div>';
  const data = await fetch("/api/mcp").then(r => r.json()).catch(() => ({ servers: [], total_tools: 0 }));
  const dot = ok => `<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(${ok ? "--wb-ok" : "--wb-err"});margin-right:6px"></span>`;
  const rows = data.servers.map((sv, i) => `
    <div class="card-item">
      <div class="t">${dot(sv.connected)}${esc(sv.name)}<button class="btn-brand mcp-del" data-i="${i}" style="float:right;padding:2px 10px;font-size:12px">删除</button></div>
      <div class="d">${esc(sv.command)} ${esc((sv.args || []).join(" "))}</div>
      <div class="d">${sv.connected
        ? `已连接 · ${sv.tools.length} 个工具：${esc(sv.tools.map(t => t.name).join("、"))}`
        : "未连接（命令启动失败或工具握手超时，详见应用日志）"}</div>
    </div>`).join("");
  pane.innerHTML = `
    <div class="card-item">
      <div class="t">MCP 连接器</div>
      <div class="d">通过 Model Context Protocol 给智能体接入外部工具（stdio 方式）。当前 ${data.servers.length} 个服务器 · <b>${data.total_tools}</b> 个工具已注入智能体，任务中可直接调用。增删后自动重连、热生效。</div>
    </div>
    ${rows || ""}
    <div class="card-item">
      <div class="t">添加服务器</div>
      <input id="mcp-name" placeholder="名称，如 filesystem">
      <input id="mcp-cmd" placeholder="命令，如 npx">
      <input id="mcp-args" placeholder="参数（空格分隔），如 -y @modelcontextprotocol/server-filesystem /Users/你的用户名/Documents">
      <div style="margin-top:8px"><button class="btn-brand" id="mcp-add">添加并连接</button><span class="ok-msg" id="mcp-msg"></span></div>
    </div>`;
  const keep = sv => ({ name: sv.name, command: sv.command, args: sv.args, env: sv.env });
  const save = async (servers) => {
    const msg = pane.querySelector("#mcp-msg");
    if (msg) msg.textContent = "连接中…（npx 首次要下载包，最长约 1 分钟）";
    const resp = await fetch("/api/mcp", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ servers }) });
    const d = await resp.json().catch(() => ({}));
    if (!resp.ok) alert(d.error || "保存失败");
    renderMcpPane(pane);
  };
  pane.querySelectorAll(".mcp-del").forEach(b => b.onclick = () => save(data.servers.filter((_, i) => i !== +b.dataset.i).map(keep)));
  pane.querySelector("#mcp-add").onclick = () => {
    const name = pane.querySelector("#mcp-name").value.trim();
    const cmd = pane.querySelector("#mcp-cmd").value.trim();
    const args = pane.querySelector("#mcp-args").value.trim().split(/\s+/).filter(Boolean);
    if (!name || !cmd) { alert("名称和命令必填"); return; }
    save(data.servers.map(keep).concat([{ name, command: cmd, args, env: {} }]));
  };
}
