  html[data-theme="dark"] #input-hl .tk { box-shadow: 0 0 0 2px var(--wb-brand-weak), 0 0 0 3px rgba(139,143,255,.35); }
  .file-item .dl { margin-left: auto; color: var(--wb-text-3); text-decoration: none; padding: 2px 6px; border-radius: var(--radius-sm); }
  .file-item .rv { margin-left: auto; cursor: pointer; font-size: 12px; }
  .file-item .rv + .dl { margin-left: 0; }        /* 两个按钮并排时只让第一个吃掉空白 */
  .out-row .rv { cursor: pointer; font-size: 12px; }
  .file-item .dl:hover { background: var(--wb-border); color: var(--wb-brand-text); }
  .files-panel h2 { font-size: 14px; font-weight: 600; color: var(--wb-text-2); padding: 16px 12px 8px 16px; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  #fp-close { border: none; background: transparent; font-size: 14px; cursor: pointer; color: var(--wb-text-2); padding: 2px 6px; border-radius: var(--radius-sm); }
  #fp-close:hover { background: var(--wb-bg-hover); }
  #file-list { flex: 1; overflow-y: auto; padding: 0 10px 12px; }
  .file-item { display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: var(--radius-md); text-decoration: none; color: var(--wb-text); font-size: 14px; }
  .file-item:hover { background: var(--wb-bg-hover); }
  .file-item .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-item .meta { font-size: 12px; color: var(--wb-text-3); }
  .file-item.nested { padding-left: 30px; }
  /* 成果文件重点标记：一个真实文件夹里 data/ 的十几个 json、几个 .py 会把那份 pptx 冲下去，
     用户原话「pptx 格式文件都没重点标记下啊」。加粗 + 左侧一道品牌色，不新增第五种颜色 */
  .file-item.res .name { font-weight: 600; }
  .file-item.res { position: relative; }
  .file-item.res::before { content: ""; position: absolute; left: 2px; top: 8px; bottom: 8px; width: 2px; border-radius: var(--radius-full); background: var(--wb-brand); opacity: .8; }
  .dir-head .cnt .res-n { color: var(--wb-brand-text); }
  .fp-filter { display: flex; gap: 4px; padding: 0 10px 8px; }
  .fp-seg { flex: 1; padding: 5px 8px; border: 1px solid var(--wb-border); background: transparent; color: var(--wb-text-3); border-radius: var(--radius-md); font-size: 12px; cursor: pointer; }
  .fp-seg:hover { background: var(--wb-bg-hover); }
  .fp-seg.on { background: var(--wb-bg-hover); color: var(--wb-text); border-color: var(--wb-brand); }
  .fp-hidden { padding: 10px; font-size: 12px; color: var(--wb-text-3); }
  .dir-head { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: var(--radius-md); font-size: 14px; cursor: pointer; user-select: none; }
  .dir-head:hover { background: var(--wb-bg-hover); }
  .dir-head .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dir-head .cnt { font-size: 12px; color: var(--wb-text-3); }
  .dup-tidy { margin: 4px 10px 8px; padding: 8px 10px; border-radius: var(--radius-md); background: var(--wb-bg-side); border: 1px solid var(--wb-border); font-size: 12px; color: var(--wb-text-2); line-height: 1.6; }
  .dup-tidy b { color: var(--wb-warn); }
  .dup-tidy button { display: block; margin-top: 6px; padding: 4px 10px; border: 0; border-radius: var(--radius-sm); background: var(--wb-brand); color: #fff; font-size: 12px; cursor: pointer; }
  .dup-tidy button:disabled { opacity: .5; cursor: default; }
  .dir-head.mine .name { color: var(--wb-brand-text); font-weight: 600; }
  .dir-head .mine-tag { display: inline-block; margin-right: 6px; padding: 0 6px; border-radius: var(--radius-full); background: var(--wb-brand); color: #fff; font-size: 11px; line-height: 18px; font-weight: normal; vertical-align: 1px; }
  .dir-head .opendir { color: var(--wb-text-3); padding: 0 2px; }
  .dir-head .opendir:hover { color: var(--wb-brand-text); }
  /* 时间段标题：比文件夹更靠外一层，所以字更小、更淡，且不缩进 */
  .time-head { display: flex; align-items: center; gap: 6px; padding: 10px 10px 4px; font-size: 12px; color: var(--wb-text-3); cursor: pointer; user-select: none; letter-spacing: .02em; }
  .time-head:hover .name { color: var(--wb-text-2); }
  .time-head .name { flex: 1; font-weight: 600; }
  .time-head .cnt { font-size: 11px; color: var(--wb-text-3); }
  .time-head + .dir-head { margin-top: 0; }
  .out-row .nm .dim { color: var(--wb-text-3); }
  /* ---------- 弹窗 ---------- */
  /* 浮层一律毛玻璃：底下的内容糊掉但还在，视线知道自己没离开原来那一页。
     只给这几层加——顶栏、侧栏都在文档流里，底下没有东西可糊，加了只是白付一份合成开销。
     backdrop-filter 不支持时退化成原来的半透明色，不会变成一块实心板。 */
  .modal-mask { display: none; position: fixed; inset: 0; background: rgba(23,24,28,.35); backdrop-filter: saturate(150%) blur(6px); -webkit-backdrop-filter: saturate(150%) blur(6px); z-index: 50; align-items: center; justify-content: center; }
  .modal-mask.show { display: flex; }
  .modal { width: 640px; max-width: 94vw; max-height: min(900px, 90vh); background: var(--wb-bg); border-radius: var(--radius-2xl); display: flex; flex-direction: column; overflow: hidden; box-shadow: var(--shadow-floating); }
  .modal.wide { width: 920px; } /* 设置页要放得下双栏通道卡（去掉 160 导航 + 40 内边距，正文还剩 720） */
  .m-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--wb-border); flex-shrink: 0; }
  .m-head h3 { font-size: 15px; }
  /* 原来是个 18px 的 ✕ 字符，实测点击区只有 14×22——比指尖还窄。
     换成和别处一致的 .icon-btn 尺码（28 见方），并改用 sprite 里的 #i-x */
  .m-close { width: 28px; height: 28px; flex: none; padding: 0; border: none; background: none;
    border-radius: var(--radius-md); cursor: pointer; color: var(--wb-text-3);
    display: inline-flex; align-items: center; justify-content: center; }
  .m-close:hover { background: var(--wb-bg-hover); color: var(--wb-text); }
  .m-close .i { width: 16px; height: 16px; }
  /* 同上：弹窗正文内容长短不定，不留位就会随内容多少左右晃 11px */
  .m-body { padding: 14px 20px 20px; overflow-y: auto; font-size: 14px; flex: 1; scrollbar-gutter: stable; }
  /* 设置页自己带侧栏和内容区的留白，m-body 再包一层 20px 就成了双层：分隔线浮在半空、
     导航整体比弹窗标题右挪 20px（实测标题文字左边缘 280 / 导航图标列左边缘 300）。
     这里让它贴边，导航图标列正好落回 280，和标题文字同一列 */
  .m-body:has(> .settings-layout) { padding: 0; }
  .card-item { border: 1px solid var(--wb-border); border-radius: var(--radius-lg); padding: 12px 14px; margin-bottom: 10px; }
  .card-item .t { font-weight: 600; margin-bottom: 4px; }
  .card-item .d { color: var(--wb-text-2); line-height: 1.6; }
  .m-body input, .m-body textarea, .m-body select { width: 100%; font-size: 14px; padding: 8px 10px; border: 1px solid var(--wb-border); border-radius: var(--radius-md); margin-bottom: 8px; outline: none; background: var(--wb-bg); }
  .m-body input:focus, .m-body textarea:focus { border-color: var(--wb-brand-text); }
  .btn-brand { border: none; background: var(--wb-brand-grad); color: #fff; border-radius: var(--radius-md); padding: 8px 18px; font-size: 14px; cursor: pointer; }
  .btn-plain { border: 1px solid var(--wb-border); background: var(--wb-bg); border-radius: var(--radius-md); padding: 7px 14px; font-size: 13px; cursor: pointer; color: var(--wb-text-2); }
  /* 没带 class 的 <a> 会吃浏览器自带的 #0000ee，暗色底上只有 1.75——基本看不见。
     只兜没 class 的那些，带了 class 的链接照旧走自己的规则 */
  a:not([class]) { color: var(--wb-brand-text); }
  .link { color: var(--wb-brand-text); cursor: pointer; text-decoration: none; }
  .link.danger { color: var(--wb-err-text); }
  /* 模型设置：渠道卡片（折叠）→ 展开看它下面的模型。
     这一块的主要矛盾是密度：一把 OpenRouter 的 Key 挂十个模型，老界面就是十行各自带地址、
     各自喊「未填 Key」。现在 Key 只在渠道那一层提一次，模型行只留名字·型号·战绩，
     编辑/复制/删除收进行尾的 ⋯ 菜单——要动手时才展开，平时一屏看得完。 */
  .ch-card { border: 1px solid var(--wb-border); border-radius: var(--radius-lg); margin-bottom: 8px; background: var(--wb-card); }
  .ch-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; cursor: pointer; user-select: none; border-radius: var(--radius-lg); }
  .ch-head:hover { background: var(--wb-bg-hover); }
  .ch-card.open .ch-head { border-bottom: 1px solid var(--wb-border); border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
  .ch-caret { flex: none; color: var(--wb-text-3); }
  .ch-title { min-width: 0; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .ch-title b { font-weight: 600; }
  .ch-sub, .ch-count { color: var(--wb-text-3); font-size: 12px; }
  .ch-count { margin-left: auto; flex: none; white-space: nowrap; }
  /* 「未填 Key」是可点的：点它展开这张卡、光标落进下面的输入框，别让人拿着 Key 满页找填在哪儿 */
  /* 底色留白：警告色在白底上是 4.75:1，刚过线；垫一层 10% 的警告色底会掉到 3.9，
     12px 的小字本来就吃亏，再压一层就真看不清了。所以悬停靠边框加深，不靠填色 */
  .ch-warn { flex: none; display: inline-flex; align-items: center; gap: 3px; color: var(--wb-warn); font-size: 12px; white-space: nowrap;
    padding: 2px 8px; border-radius: var(--radius-full); border: 1px solid color-mix(in srgb, var(--wb-warn) 35%, transparent);
    background: none; cursor: pointer; font-family: inherit; }
  .ch-warn:hover { border-color: color-mix(in srgb, var(--wb-warn) 75%, transparent); }
  .ch-body { padding: 2px 12px 10px 32px; }
  .ch-note { color: var(--wb-text-3); font-size: 12px; line-height: 1.6; padding: 4px 0; }
  /* 卡里那把 Key：一行摆平，Key 是渠道的属性，所以位置就在渠道卡的第一行 */
  .ch-key { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 0 10px; }
  .ch-key label { flex: none; font-size: 12px; color: var(--wb-text-2); }
  .ch-key .ck-input { flex: 1; min-width: 180px; margin: 0; }
  .ch-key .btn-brand { margin: 0; }
  /* 没填 Key 的渠道收进这一栏：不占主列表，又随时点得开 */
  .idle-sec { margin-top: 10px; }
  .idle-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 12px; border: 1px dashed var(--wb-border);
    border-radius: var(--radius-lg); background: none; color: var(--wb-text-2); font-size: 13px; font-family: inherit; cursor: pointer; text-align: left; }
  .idle-head:hover { background: var(--wb-bg-hover); }
  /* 这一栏里的卡「次一等」，但不能靠 opacity 压——一压，卡上那行 12px 的
     「未填 Key」对比度从 4.75 掉到 3.4，正是最该看清的那句话变糊。虚线框已经把它跟主列表分开了 */
  .idle-body { margin-top: 8px; }
  .mrow { display: flex; align-items: center; gap: 8px; padding: 7px 0; }
  .mrow + .mrow { border-top: 1px solid var(--wb-border); }
  .mrow input[type="radio"] { margin: 0; flex: none; }   /* 宽高交给文末那条统一的 16 见方 */
  .mrow-dot { width: 14px; flex: none; text-align: center; color: var(--wb-brand-text); font-size: 12px; }
  .mrow-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mrow-id { font-family: var(--font-mono); font-size: 12px; color: var(--wb-text-3); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mrow-meta { margin-left: auto; color: var(--wb-text-3); font-size: 12px; white-space: nowrap; }
  /* 行尾的 ⋯ 菜单：贴着行右边弹出来，点别处就收。手机上也点得到（悬停在触屏上不存在） */
  .row-acts { position: relative; flex: none; margin-left: 4px; }
  /* 实测 20×16，鼠标得瞄准才点得中。撑到 24 见方，图标本身不变大 */
  .row-more { width: 24px; height: 24px; flex: none; padding: 0; border: none; background: none;
    cursor: pointer; color: var(--wb-text-3); border-radius: var(--radius-sm);
    display: inline-flex; align-items: center; justify-content: center; }
  .row-more:hover { background: var(--wb-bg-hover); color: var(--wb-text); }
  .row-menu { position: absolute; right: 0; top: 100%; z-index: 30; min-width: 132px; padding: 4px; border: 1px solid var(--wb-border); border-radius: var(--radius-lg); background: var(--wb-card); box-shadow: var(--wb-shadow-md); }
  .row-menu a { display: block; padding: 7px 10px; border-radius: var(--radius-md); font-size: 13px; color: var(--wb-text); text-decoration: none; white-space: nowrap; }
  .row-menu a:hover { background: var(--wb-bg-hover); }
  .row-menu a.danger { color: var(--wb-err-text); }
  /* 媒体那一节的小标题：它不套 .card-item（渠道卡外面再套一圈框太吵），所以字重自己带上。
     图标跟字之间留个 gap——贴在一起会读成「⊠看图」，像个乱码而不是图标 */
  .sec-t { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: 15px; margin: 0 0 4px; }
  .card-item .t > .i { margin-right: 6px; }
  /* 高度别写死：60vh 在 1440×900 上只有 540px，快捷键 19 条露 11 条、关于页最后一张卡被底边切掉。
     取 min(760px, 78vh)——大屏不会长成一条，小屏跟着视口缩，加上标题栏也还在 .modal 的 90vh 里面 */
  .settings-layout { display: flex; height: min(760px, 78vh); }
  .settings-nav { width: 160px; flex-shrink: 0; border-right: 1px solid var(--wb-border); padding: 12px 8px; overflow-y: auto; }
  .settings-nav .cat { padding: 8px 12px; border-radius: var(--radius-md); font-size: 14px; color: var(--wb-text-2); cursor: pointer; margin-bottom: 2px; }
  .settings-nav .cat:hover { background: var(--wb-bg-hover); }
  .settings-nav .cat.active { background: var(--wb-brand-weak); color: var(--wb-text); font-weight: 600; box-shadow: inset 3px 0 0 var(--wb-brand); }
  .settings-nav .cat .ci { display: inline-block; width: 22px; }
  /* 外观页：分段按钮 + 色板。全是「点一下立刻生效」的选项，没有保存键 */
  .look-seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .look-seg button { flex: 1; min-width: 88px; border: 1px solid var(--wb-border); background: var(--wb-card); color: var(--wb-text-2); border-radius: var(--radius-lg); padding: 10px 8px; cursor: pointer; font: inherit; font-size: 13px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px; min-height: 62px; transition: border-color var(--wb-t-fast) var(--wb-ease), background var(--wb-t-fast) var(--wb-ease); }
  .look-seg button:hover { border-color: var(--wb-text-3); }
  .look-seg button.on { border-color: var(--wb-brand); background: var(--wb-brand-weak); color: var(--wb-text); font-weight: 600; }
  .look-seg button .ic { font-size: 20px; line-height: 1; }
  .look-seg button b { line-height: 1; font-weight: 600; }
  .look-f { font-size: 18px; }
  .look-f-serif { font-family: Georgia, "Songti SC", "Noto Serif CJK SC", SimSun, serif; }
  .look-f-mono { font-family: var(--font-mono); }
  .look-skins { display: flex; gap: 8px; flex-wrap: wrap; }
  .look-skin { width: 72px; border: 1px solid var(--wb-border); border-radius: var(--radius-lg); padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 7px; cursor: pointer; background: var(--wb-card); color: var(--wb-text-2); font: inherit; font-size: 12px; transition: border-color var(--wb-t-fast) var(--wb-ease); }
  .look-skin i { width: 26px; height: 26px; border-radius: 50%; box-shadow: 0 0 0 2px var(--wb-card); }
  .look-skin:hover { border-color: var(--wb-text-3); }
  .look-skin.on { border-color: var(--wb-brand); color: var(--wb-text); font-weight: 600; }
  .look-skin.on i { box-shadow: 0 0 0 2px var(--wb-card), 0 0 0 4px var(--wb-brand); }
  .look-prev { margin-top: 10px; border: 1px dashed var(--wb-border); border-radius: var(--radius-lg); padding: 10px 14px; font-size: var(--wb-fs); line-height: 1.7; color: var(--wb-text); }
  .look-prev code { background: var(--wb-bg-hover); border-radius: var(--radius-xs); padding: 1px 5px; font-size: calc(var(--wb-fs) - 2px); font-family: var(--font-mono); }
  .look-note { color: var(--wb-text-3); font-size: 12px; margin-top: 8px; }
  /* 留出滚动条的位置。12 个分页里「模型 / 搜索 / 进化 / 数据」四个内容不够长不出滚动条，
     其余八个出。开了「总是显示滚动条」的机器上来回切，实测整页内容横跳 11px。
     对话区（#chat-scroll）早就这么留了，这里跟上。 */
  .settings-pane { flex: 1; padding: 16px 20px 24px; overflow-y: auto; font-size: 14px; scrollbar-gutter: stable; }
  .form-row { display: flex; gap: 8px; }
  .form-row > * { flex: 1; }
  .ok-msg { font-size: 13px; color: var(--wb-ok-text); margin-left: 8px; }
  /* ---------- 账号 / 积分 ---------- */
  .user-chip { display: flex; align-items: center; gap: 8px; margin: 8px 4px 0; padding: 8px 10px; border-radius: var(--radius-lg); border: 1px solid var(--wb-border); background: var(--wb-bg); font-size: 13px; cursor: pointer; }
  .user-chip:hover { background: var(--wb-bg-hover); }
  .user-chip .ava { width: 26px; height: 26px; border-radius: 50%; background: var(--wb-brand-grad); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; flex: none; }
  .user-chip .un { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-chip .uc { margin-left: auto; color: var(--wb-brand-text); font-weight: 600; flex: none; }
  .auth-mask { position: fixed; inset: 0; z-index: 200; background: rgba(247,248,250,.78); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); display: none; align-items: center; justify-content: center; }
  .auth-mask.show { display: flex; }
  .auth-card { width: 340px; background: var(--wb-bg); border: 1px solid var(--wb-border); border-radius: var(--radius-2xl); padding: 28px 26px; box-shadow: var(--shadow-floating); }
  .auth-card h2 { font-size: 18px; margin-bottom: 4px; }
  .auth-card .sub { font-size: 13px; color: var(--wb-text-3); margin-bottom: 18px; }
  .auth-card input { width: 100%; margin-bottom: 10px; padding: 10px 12px; border: 1px solid var(--wb-border); border-radius: var(--radius-lg); font-size: 14px; }
  .auth-card button.go { width: 100%; padding: 10px; border: none; border-radius: var(--radius-lg); background: var(--wb-brand-grad); color: #fff; font-size: 15px; cursor: pointer; }
  .auth-card .alt { font-size: 13px; color: var(--wb-text-3); text-align: center; margin-top: 12px; }
  .auth-card .alt a { color: var(--wb-brand-text); cursor: pointer; }
  .auth-card .err { font-size: 13px; color: var(--wb-err-text); min-height: 16px; margin-bottom: 6px; }
  /* 首次开箱向导：一步一件事，步骤条在顶上；行式清单和助理设置页的卡片同一套视觉 */
  .onb-card { width: 520px; max-width: calc(100vw - 32px); max-height: calc(100vh - 40px); overflow: auto; }
  .onb-steps { display: flex; gap: 4px; margin: -6px 0 18px; }
  .onb-lang { flex-basis: 100%; display: flex; justify-content: flex-end; gap: 4px; margin: -4px 0 8px; }
  .onb-lang button { font-size: 11px; padding: 3px 10px; border-radius: var(--radius-full); border: 1px solid var(--wb-border); background: transparent; color: var(--wb-text-3); cursor: pointer; }
  .onb-lang button.on { background: var(--wb-brand-weak); color: var(--wb-brand-text); border-color: transparent; font-weight: 600; }
  .onb-step { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 0; border-radius: var(--radius-lg); font-size: 11px; color: var(--wb-text-3); cursor: default; }
  .onb-step i { font-style: normal; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--wb-bg-hover); font-size: 13px; }
  .onb-step.cur { color: var(--wb-brand-text); font-weight: 600; }
  .onb-step.cur i { background: var(--wb-brand-weak); }
  .onb-step.done { color: var(--wb-ok-text); cursor: pointer; }
  .onb-step.done i { background: color-mix(in srgb, var(--wb-ok) 18%, transparent); color: var(--wb-ok-text); }
  .onb-h { display: flex; align-items: center; gap: 8px; }
  .onb-h h2 { margin: 0; }
  .onb-tag { font-size: 11px; padding: 2px 8px; border-radius: var(--radius-full); background: var(--wb-bg-hover); color: var(--wb-text-3); }
  .onb-tag.must { background: color-mix(in srgb, var(--wb-err) 14%, transparent); color: var(--wb-err-text); }
  .onb-tag.rec { background: color-mix(in srgb, var(--wb-warn) 18%, transparent); color: var(--wb-warn); }
  .onb-card .sub { margin-top: 6px; }
  .onb-card .onb-lb { display: block; font-size: 13px; color: var(--wb-text-2); margin: 10px 0 6px; }
  .onb-card select { width: 100%; padding: 10px 12px; border: 1px solid var(--wb-border); border-radius: var(--radius-lg); font-size: 14px; background: var(--wb-bg); color: var(--wb-text); }
  .onb-card .onb-tip { font-size: 13px; color: var(--wb-text-3); margin-top: 6px; line-height: 1.6; }
  .onb-card .onb-tip a { color: var(--wb-brand-text); }
  /* 「去拿 Key ↗」：向导、模型/搜索/IM 面板共用的小胶囊链接，一眼能点、不跟正文糊在一起 */
  .get-key { display: inline-flex; align-items: center; gap: 2px; margin-left: 6px; padding: 1px 10px; border-radius: var(--radius-full); font-size: 12px; font-weight: 500; line-height: 20px; white-space: nowrap; text-decoration: none; color: var(--wb-brand-text); border: 1px solid color-mix(in srgb, var(--wb-brand) 40%, transparent); background: color-mix(in srgb, var(--wb-brand) 8%, transparent); vertical-align: middle; }
  .get-key:hover { background: color-mix(in srgb, var(--wb-brand) 16%, transparent); text-decoration: none; }
  .onb-presets { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
  .onb-presets .onb-tip { margin-top: 0; }
  .onb-preset { font-size: 12px; padding: 3px 10px; border-radius: var(--radius-full); border: 1px solid var(--wb-border); background: var(--wb-bg); color: var(--wb-text-2); cursor: pointer; }
  .onb-preset:hover { border-color: var(--wb-brand); color: var(--wb-brand-text); }
  .onb-preset.on { border-color: var(--wb-brand); color: var(--wb-brand-text); background: color-mix(in srgb, var(--wb-brand) 10%, transparent); }
  .onb-im-src { font-size: 12px; color: var(--wb-text-3); display: flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .onb-im-src .get-key { margin-left: 2px; }
  .onb-ok { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-radius: var(--radius-lg); background: color-mix(in srgb, var(--wb-ok) 12%, transparent); color: var(--wb-ok-text); font-size: 13px; margin-bottom: 6px; }
  .onb-ok a { margin-left: auto; color: var(--wb-brand-text); cursor: pointer; font-size: 12px; }
  .onb-seg { display: flex; gap: 6px; margin-top: 4px; }
  .onb-seg button { flex: 1; padding: 9px 10px; border: 1px solid var(--wb-border); border-radius: var(--radius-lg); background: var(--wb-bg); color: var(--wb-text-2); font-size: 13px; cursor: pointer; }
  .onb-seg button.on { border-color: var(--wb-brand); color: var(--wb-brand-text); background: var(--wb-brand-weak); font-weight: 600; }
  .onb-radio { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border: 1px solid var(--wb-border); border-radius: var(--radius-lg); margin-top: 8px; font-size: 13px; cursor: pointer; }
  .onb-radio span { margin-left: auto; color: var(--wb-text-3); font-size: 12px; }
  .onb-rows { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .onb-row { border: 1px solid var(--wb-border); border-radius: var(--radius-lg); background: var(--wb-card); }
  .onb-row-h { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
  .onb-row-h .ic { width: 28px; height: 28px; border-radius: var(--radius-md); background: var(--wb-bg-hover); display: grid; place-items: center; font-style: normal; font-size: 15px; flex: none; }
  .onb-row-h .tt { flex: 1; min-width: 0; }
  .onb-row-h .tt b { display: block; font-size: 13px; }
  .onb-row-h .tt span { display: block; font-size: 12px; color: var(--wb-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .onb-chip { font-size: 12px; color: var(--wb-text-3); flex: none; }
  .onb-chip.ok { color: var(--wb-ok-text); }
  .onb-chip.warn { color: var(--wb-warn); }
  .onb-row-h .btn-plain { height: 28px; padding: 0 10px; font-size: 12px; flex: none; }
  .onb-row-b { border-top: 1px solid var(--wb-border); padding: 10px 12px 12px; }
  .onb-row-b input { display: block; width: 100%; margin-bottom: 6px; font-size: 13px; padding: 7px 10px; }
  .onb-act { display: flex; align-items: center; gap: 8px; }
  .onb-act .err { margin: 0; min-height: 0; }
  .onb-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; }
  .onb-foot a { font-size: 13px; color: var(--wb-text-3); cursor: pointer; }
  .onb-foot a:hover { color: var(--wb-brand-text); }
  .onb-card button.go { width: auto; min-width: 140px; padding: 10px 18px; margin: 0; }
  .onb-card button.go:disabled { opacity: .6; cursor: default; }
  /* ---------- 排队 / 插队 ---------- */
  .queue-bar { display: none; flex-wrap: wrap; gap: 6px; align-items: center; padding: 0 2px 6px; font-size: 13px; color: var(--wb-text-3); }
  .queue-bar.show { display: flex; }
  .q-chip { display: inline-flex; align-items: center; gap: 6px; max-width: 260px; padding: 4px 10px; border-radius: var(--radius-full); background: var(--wb-brand-weak); color: var(--wb-brand-text); font-size: 13px; }
  .q-chip .qt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .q-chip .qx { cursor: pointer; opacity: .7; }
  .qb-hint { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; line-height: 1.5; }
  .qb-stop { border: 1px solid color-mix(in srgb, var(--wb-err) 45%, transparent); background: color-mix(in srgb, var(--wb-err) 8%, transparent); color: var(--wb-err-text); border-radius: var(--radius-full); padding: 2px 10px; font-size: 12px; cursor: pointer; }
  .qb-stop:hover { background: color-mix(in srgb, var(--wb-err) 16%, transparent); }
  #send.interject { box-shadow: 0 0 0 3px var(--wb-brand-weak); }
  #interject-btn { display: none; border: 1px solid var(--wb-brand); color: var(--wb-brand-text); background: none; border-radius: var(--radius-md); padding: 4px 10px; font-size: 13px; cursor: pointer; }
  #interject-btn.show { display: inline-block; }
  .interject-note { align-self: flex-end; max-width: 70%; margin: 6px 0; padding: 8px 12px; border-radius: var(--radius-lg); background: var(--wb-brand-weak); color: var(--wb-brand-text); font-size: 14px; }
  .interject-note .lb { font-size: 12px; opacity: .75; margin-bottom: 2px; }
  .interject-note.pending { opacity: .6; }
  /* AI 拿不准时的提问卡：一条选项一行（短语 + 选它意味着什么），键盘 1/2/3/4 直选 */
  .ask-card { align-self: stretch; margin: 12px 0; padding: 14px 16px 12px; border: 1px solid var(--wb-border); border-left: 3px solid var(--wb-brand); border-radius: var(--radius-xl); background: var(--wb-bg); box-shadow: var(--shadow-surface); }
  .ask-hd { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--wb-text-3); margin-bottom: 8px; }
  .ask-hd .ask-lb { flex: 1; }
  .ask-timer { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--wb-text-3); }
  .ask-timer.hot { color: var(--wb-err-text); }
  .ask-q { font-size: 15px; font-weight: 600; color: var(--wb-text); line-height: 1.5; margin-bottom: 12px; }
  .ask-opts { display: flex; flex-direction: column; gap: 8px; }
  .ask-opt { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; border: 1px solid var(--wb-border); border-radius: var(--radius-lg); background: var(--wb-bg); cursor: pointer; transition: border-color var(--wb-t-fast) var(--wb-ease), background var(--wb-t-fast) var(--wb-ease); }
  .ask-opt:hover, .ask-opt:focus-visible { border-color: var(--wb-brand-text); background: var(--wb-brand-weak); outline: none; }
  .ask-opt .kk { flex: none; width: 20px; height: 20px; border-radius: var(--radius-sm); background: var(--wb-bg-side); border: 1px solid var(--wb-border); color: var(--wb-text-3); font-size: 12px; line-height: 18px; text-align: center; }
  .ask-opt:hover .kk { border-color: var(--wb-brand-text); color: var(--wb-brand-text); }
  .ask-opt .tx { flex: 1; min-width: 0; }
  .ask-opt .lb { display: block; font-size: 14px; font-weight: 500; color: var(--wb-text); }
  .ask-opt .dt { display: block; font-size: 13px; color: var(--wb-text-3); line-height: 1.5; margin-top: 2px; }
  .ask-opt .go { flex: none; font-size: 12px; color: transparent; align-self: center; }
  .ask-opt:hover .go { color: var(--wb-brand-text); }
  .ask-free { display: flex; gap: 8px; margin-top: 12px; }
  .ask-free input { flex: 1; min-width: 0; border: 1px solid var(--wb-border); border-radius: var(--radius-lg); padding: 8px 12px; font-size: 13px; background: var(--wb-bg); color: var(--wb-text); }
  .ask-free input:focus { outline: none; border-color: var(--wb-brand-text); }
  .ask-free button { flex: none; border: 1px solid var(--wb-border); background: var(--wb-bg); color: var(--wb-text-2); border-radius: var(--radius-lg); padding: 8px 16px; font-size: 13px; cursor: pointer; }
  .ask-free button:hover { border-color: var(--wb-brand-text); color: var(--wb-brand-text); }
  .ask-card.sending { opacity: .6; pointer-events: none; }
  /* 答完就缩成一行：问题留着（回头看得懂当时在纠结什么），选项和输入框收走 */
  .ask-card.done { border-left-color: var(--wb-border); background: var(--wb-bg-side); }
  .ask-card.done .ask-opts, .ask-card.done .ask-free, .ask-card.done .ask-timer { display: none; }
  .ask-card.done .ask-q { font-weight: 500; font-size: 14px; margin-bottom: 6px; }
  .ask-ans:empty { display: none; }
  .ask-ans { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--wb-text-2); }
  .ask-ans b { color: var(--wb-text); font-weight: 600; }
  /* ---------- 用量面板 ---------- */
  .usage-grid { display: flex; gap: 10px; margin-bottom: 12px; }
  .usage-cell { flex: 1; border: 1px solid var(--wb-border); border-radius: var(--radius-lg); padding: 10px 12px; }
  .usage-cell .n { font-size: 18px; font-weight: 700; }
  .usage-cell .l { font-size: 12px; color: var(--wb-text-3); margin-top: 2px; }
  .usage-bars { display: flex; align-items: flex-end; gap: 6px; height: 64px; margin: 6px 0 2px; }
  .usage-bars .b { flex: 1; background: var(--wb-brand-weak); border-radius: var(--radius-xs) var(--radius-xs) 0 0; position: relative; min-height: 2px; }
  .usage-bars .b i { position: absolute; bottom: -16px; left: 0; right: 0; text-align: center; font-style: normal; font-size: 11px; color: var(--wb-text-3); }
  .usage-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .usage-table th, .usage-table td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--wb-border); white-space: nowrap; }
  .usage-table th { color: var(--wb-text-3); font-weight: 500; }
  /* ---------- 专家 · 技能 · 连接器（主区页面） ---------- */
  .hub-head { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .hub-tabs { display: flex; gap: 4px; background: var(--wb-bg-side); border-radius: var(--radius-lg); padding: 3px; }
  .hub-tabs button { border: none; background: transparent; border-radius: var(--radius-md); padding: 7px 16px; font-size: 14px; color: var(--wb-text-2); cursor: pointer; }
  .hub-tabs button.active { background: var(--wb-bg); color: var(--wb-text); font-weight: 600; box-shadow: var(--shadow-surface); }
  /* 搜索框的宽度只在这儿定。以前项目页内联 260、自动化页内联 240、技能中心和模板页
     干脆不写，flex:1 一路撑到 746——同一个控件量出四种宽度。260 是这里最长的
     占位文案「搜索专家职称或描述」加上放大镜留白之后的舒服值，再宽就只剩空框。 */
  .hub-search { flex: 1; min-width: 160px; max-width: 260px; position: relative; }
  .hub-search input { width: 100%; padding: 8px 12px 8px 30px; border: 1px solid var(--wb-border); border-radius: var(--radius-lg); font-size: 14px; background: var(--wb-bg); }
  /* 放大镜原来是 ::before 的 content:"🔍"——伪元素塞不进 svg，所以改成真节点：

  .hub-search > .i { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 13px; opacity: .5; pointer-events: none; }
  .hub-sec-title { font-size: 15px; font-weight: 600; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
  .hub-sec-title .sub { font-size: 12px; font-weight: 400; color: var(--wb-text-3); }
  /* 精选场景：横滑不换行，窄屏也不撑破主区 */
  .feat-scroll { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 10px; margin-bottom: 6px; scrollbar-width: thin; }
  .feat-card { flex: 0 0 232px; border: 1px solid var(--wb-border); border-radius: var(--radius-xl); padding: 12px 14px; cursor: pointer; background: var(--wb-bg); transition: border-color var(--wb-t-fast) var(--wb-ease), transform var(--wb-t-fast) var(--wb-ease); }
  .feat-card:hover { border-color: var(--wb-brand-text); transform: translateY(-1px); }
  .feat-card .ic { font-size: 20px; margin-bottom: 6px; }
  .feat-card .tt { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
  .feat-card .dd { font-size: 13px; color: var(--wb-text-2); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .feat-card .go { font-size: 12px; color: var(--wb-brand-text); margin-top: 8px; }
  .hub-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 14px 0 12px; }
  .hub-sub { display: flex; gap: 16px; }
  .hub-sub button { border: none; background: none; padding: 4px 0; font-size: 15px; font-weight: 600; color: var(--wb-text-3); cursor: pointer; border-bottom: 2px solid transparent; }
  .hub-sub button.active { color: var(--wb-text); border-bottom-color: var(--wb-brand-text); }
  /* 叫 hub-chips 不叫 chips：首屏空状态那套 .chips 是居中 + max-width:720px 的，重名会串味 */
  .hub-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--wb-border); background: var(--wb-bg); border-radius: var(--radius-full); padding: 4px 12px; font-size: 13px; color: var(--wb-text-2); cursor: pointer; line-height: 1.6; }
  .chip:hover { border-color: var(--wb-brand-text); color: var(--wb-brand-text); }
  .chip.active { background: var(--wb-brand-weak); border-color: var(--wb-brand-text); color: var(--wb-brand-text); font-weight: 500; }
  .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(248px, 1fr)); gap: 12px; }
  .ex-card { border: 1px solid var(--wb-border); border-radius: var(--radius-xl); padding: 14px; background: var(--wb-bg); display: flex; flex-direction: column; gap: 8px; position: relative; }
  .ex-card:hover { border-color: var(--wb-brand-text); }
  .ex-card .hd { display: flex; align-items: center; gap: 10px; }
  .ex-card .av { width: 38px; height: 38px; flex: none; border-radius: var(--radius-lg); background: var(--wb-brand-weak); color: var(--wb-brand-text); display: flex; align-items: center; justify-content: center; font-size: 19px; }
  .ex-card .nm { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 6px; min-width: 0; flex-wrap: wrap; }
  .ex-card .nm span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 右边的状态字长的时候，别把名字挤成 0 宽（连接器卡片踩过这个坑） */
  .ex-card .nm > span:first-child { flex: 1 1 auto; min-width: 4em; }
  .ex-card .al { font-size: 12px; color: var(--wb-text-3); font-weight: 400; flex: none; }
  .ex-card .ds { font-size: 13px; color: var(--wb-text-2); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; min-height: 40px; }
  .ex-card .tg { display: flex; gap: 5px; flex-wrap: wrap; }
  .ex-card .tg i { font-style: normal; font-size: 12px; color: var(--wb-text-3); background: var(--wb-bg-side); border-radius: var(--radius-sm); padding: 2px 7px; }
  .ex-card .ops { display: flex; gap: 6px; margin-top: auto; padding-top: 4px; }
  .ex-card .ops button { flex: 1; border: 1px solid var(--wb-border); background: var(--wb-bg); border-radius: var(--radius-md); padding: 5px 0; font-size: 13px; color: var(--wb-text-2); cursor: pointer; }
  .ex-card .ops button:hover { border-color: var(--wb-brand-text); color: var(--wb-brand-text); }
  .ex-card .ops button.primary { background: var(--wb-brand); border-color: var(--wb-brand-text); color: #fff; }
  .ex-card.add { align-items: center; justify-content: center; border-style: dashed; cursor: pointer; color: var(--wb-text-3); min-height: 150px; text-align: center; }
  .ex-card.add:hover { color: var(--wb-brand-text); }
  .ex-card.add .add-sub { display: block; margin-top: 6px; font-size: 12px; color: var(--wb-text-3); }
  .hub-sub button .beta { font-style: normal; font-size: 11px; font-weight: 600; color: var(--wb-brand-text); background: var(--wb-brand-weak); border-radius: var(--radius-xs); padding: 1px 4px; vertical-align: 2px; }
  .hub-count { grid-column: 1 / -1; font-size: 13px; color: var(--wb-text-3); padding: 4px 2px 0; }
  .hub-desc { font-size: 13px; color: var(--wb-text-3); margin: -4px 0 10px; }
  .ex-card .flag { position: absolute; top: 10px; right: 10px; font-size: 11px; color: var(--wb-text-3); background: var(--wb-bg-side); border-radius: var(--radius-sm); padding: 1px 6px; }
  .ex-card .sk-preview { margin: 0; max-height: 260px; overflow: auto; background: var(--wb-bg-side); padding: 10px; border-radius: var(--radius-md); font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  /* 技能卡「立即使用」展开区：先摆几个具体能干的事，挑一个才进任务框 */
  .ex-card .sk-start { background: var(--wb-bg-side); border-radius: var(--radius-md); padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
  .ex-card .sk-start-hint { font-size: 12px; color: var(--wb-text-3); }

  .ex-card .sk-eg .chip { text-align: left; }
  .ex-card .sk-own { align-self: flex-start; border: 0; background: none; padding: 0; font-size: 12px; color: var(--wb-brand-text); cursor: pointer; }
  .hub-empty { color: var(--wb-text-3); font-size: 14px; padding: 30px; text-align: center; }
  /* 专家编辑抽屉 */
  .ex-editor { border: 1px solid var(--wb-brand); border-radius: var(--radius-xl); padding: 16px; margin-bottom: 14px; background: var(--wb-bg); }
  .ex-editor .row { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .ex-editor .row > * { min-width: 0; }
  .ex-editor label { display: block; font-size: 13px; color: var(--wb-text-2); margin-bottom: 4px; }

  .sk-pick { display: flex; gap: 6px; flex-wrap: wrap; }
  .sk-pick label { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--wb-border); border-radius: var(--radius-full); padding: 4px 11px; font-size: 13px; cursor: pointer; margin: 0; }
  .sk-pick label.on { background: var(--wb-brand-weak); border-color: var(--wb-brand-text); color: var(--wb-brand-text); }
  .sk-pick input { display: none; }
  /* ---------- 参考模板库 ---------- */
  .tpl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
  .tpl-card { border: 1px solid var(--wb-border); border-radius: var(--radius-xl); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .tpl-card .hd { display: flex; align-items: center; gap: 7px; }
  .tpl-card .ic { font-size: 16px; }
  .tpl-card .tt { font-size: 14px; font-weight: 600; }
  .tpl-card .ct { margin-left: auto; font-size: 12px; color: var(--wb-text-3); background: var(--wb-bg-side); border-radius: var(--radius-sm); padding: 1px 7px; }
  .tpl-card { cursor: pointer; }
  .tpl-card .dd { font-size: 13px; color: var(--wb-text-2); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  /* 提示词全文默认收起：一屏几十段全文密集恐。点卡片单张展开 */
  .tpl-card pre { display: none; background: var(--wb-bg-side); border-radius: var(--radius-md); padding: 10px 12px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto; color: var(--wb-text); }
  .tpl-card.open pre { display: block; animation: wbFade .18s var(--wb-ease); }
  .tpl-card .chev { display: inline-flex; align-items: center; color: var(--wb-text-3); transition: transform .18s var(--wb-ease); }
  .tpl-card.open .chev { transform: rotate(90deg); }
  .tpl-card .ops { display: flex; gap: 6px; margin-top: auto; }
  .tpl-card .ops button { border: 1px solid var(--wb-border); background: var(--wb-bg); border-radius: var(--radius-md); padding: 5px 12px; font-size: 13px; cursor: pointer; color: var(--wb-text-2); }
  .tpl-card .ops button.primary { background: var(--wb-brand); border-color: var(--wb-brand-text); color: #fff; }

  /* ===== 项目页 ===== */
  .pg-hero { margin: 4px 0 18px; }
  .pg-hero h1 { font-size: 26px; margin: 0 0 4px; }
  .pg-hero .sub { color: var(--wb-text-2); font-size: 14px; }
  .proj-card { border: 1px solid var(--wb-border); border-radius: var(--radius-xl); padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; background: var(--wb-bg); transition: box-shadow var(--wb-t-fast) var(--wb-ease); }
  .proj-card:hover { box-shadow: var(--shadow-menu); }
  .proj-card.active { border-color: var(--wb-brand-text); }
  .proj-card .tt { font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .proj-card .tt .badge { font-size: 11px; color: var(--wb-brand-text); background: var(--wb-brand-weak); border-radius: var(--radius-sm); padding: 1px 6px; font-weight: 600; }
  .proj-card .dd { font-size: 13px; color: var(--wb-text-3); }
  .proj-card .ops { display: flex; gap: 10px; font-size: 13px; margin-top: 2px; }
  .proj-form label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 6px; }
  .proj-form .cnt { float: right; font-weight: 400; font-size: 12px; color: var(--wb-text-3); }
  .proj-form .picks { display: flex; flex-wrap: wrap; gap: 6px; }
  .proj-form .picks .pk { border: 1px solid var(--wb-border); border-radius: var(--radius-md); padding: 4px 10px; font-size: 13px; cursor: pointer; color: var(--wb-text-2); user-select: none; }
  .proj-form .picks .pk.on { border-color: var(--wb-brand-text); color: var(--wb-brand-text); background: var(--wb-brand-weak); }
  .proj-form .foot { display: flex; align-items: center; gap: 10px; margin-top: 18px; }
  .proj-form .foot .hint { font-size: 13px; color: var(--wb-text-3); margin-right: auto; }

  /* ===== 自动化页 ===== */
  .at-row { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-bottom: 1px solid var(--wb-border); font-size: 14px; }
  .at-row:hover { background: var(--wb-bg-hover); }
  .at-row .nm { font-weight: 600; white-space: nowrap; }
  .at-row .meta { color: var(--wb-text-3); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .at-row .ops { display: flex; gap: 10px; font-size: 13px; white-space: nowrap; }
  .at-row .st { font-size: 13px; color: var(--wb-text-3); white-space: nowrap; }
  /* 状态字走 *-text 那一档：#16a34a 压白卡片只有 3.30:1，是这一屏里最先看不清的东西（令牌层为此专门留了 --wb-ok-text=5.79:1）；
     红的反过来，#dc2626 在深色卡片上只有 3.41:1。硬写死的另一个后果是它根本不跟着主题翻色 */
  .at-row .st.ok { color: var(--wb-ok-text); }
  .at-row .st.err { color: var(--wb-err-text); }
  .at-group { font-size: 13px; color: var(--wb-text-3); margin: 16px 0 4px; }
  .at-runs td { padding: 8px 10px; border-bottom: 1px solid var(--wb-border); font-size: 13px; vertical-align: top; }
  .at-runs th { padding: 6px 10px; text-align: left; font-size: 13px; color: var(--wb-text-3); font-weight: 500; border-bottom: 1px solid var(--wb-border); }
  .at-runs { width: 100%; border-collapse: collapse; }
  /* 失败那一行的「下一步怎么办」和「上游原话」。字号压一档、颜色退一档：
     它们是给判据做注脚的，不该跟结论抢视线 */
  .at-runs .at-hint { margin-top: 3px; color: var(--wb-text-2); line-height: 1.5; }
  .at-runs .at-raw { margin-top: 3px; color: var(--wb-text-3); font-size: 12px; font-family: var(--font-mono, ui-monospace, monospace); word-break: break-all; }

  /* ===== 资料库页 ===== */
  .lib-page { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 18px; align-items: start; }
  .lib-side .sec { font-size: 13px; color: var(--wb-text-3); margin: 14px 0 4px; display: flex; align-items: center; justify-content: space-between; }
  .lib-it { display: flex; align-items: center; gap: 7px; padding: 6px 8px; border-radius: var(--radius-md); font-size: 14px; cursor: pointer; color: var(--wb-text-2); }
  .lib-it:hover { background: var(--wb-bg-hover); }
  .lib-it.active { background: var(--wb-brand-weak); color: var(--wb-text); font-weight: 600; box-shadow: inset 3px 0 0 var(--wb-brand); }
  .lib-it .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .lib-it .sz { font-size: 12px; color: var(--wb-text-3); }
  .lib-prev { border: 1px solid var(--wb-border); border-radius: var(--radius-xl); min-height: 420px; padding: 18px 20px; overflow: auto; }
  .lib-prev iframe { width: 100%; height: 70vh; border: none; border-radius: var(--radius-md); background: #fff; }
  .lib-prev table.csv { border-collapse: collapse; font-size: 13px; width: 100%; }
  .lib-prev table.csv td, .lib-prev table.csv th { border: 1px solid var(--wb-border); padding: 5px 9px; text-align: left; }
  .lib-prev table.csv th { background: var(--wb-bg-side); font-weight: 600; }
  .lib-prev pre.raw { white-space: pre-wrap; word-break: break-word; font-size: 13px; line-height: 1.6; }
  .lib-prev .ph { color: var(--wb-text-3); text-align: center; padding: 80px 20px; font-size: 14px; }

  /* ================= 全局顺滑层：圆角 / 过渡 / 入场动效（治「生硬」） ================= */
  /* 动效令牌。之前十来条 transition 没写曲线，吃的是浏览器默认的 ease——
     两头都慢、中间快，动起来是「网页味」。苹果那套是减速曲线：起步就到速度、尾巴长，
     手感上像松手后自己滑停的。时长也统一到三档，免得同一次交互里 .12/.15/.18 各走各的。 */
  :root {
    --wb-ease: cubic-bezier(.22,.61,.36,1);            /* 通用减速 */
    --wb-ease-out: cubic-bezier(.32,.72,0,1);          /* 面板滑入这类大位移，尾巴更长 */
    --wb-t-fast: .14s;                                 /* 悬停、按下这种要「跟手」 */
    --wb-t: .2s;                                       /* 常规状态切换 */
    --wb-t-slow: .28s;                                 /* 面板、弹层的进出 */
    /* 影子不再各写各的：全项目只有三档高度，值在 ui.css（浅/暗各一套，这里不用再覆写一遍）。
       老名字留着，是因为卡片悬浮那几条规则还在用它。 */
    --wb-shadow-sm: var(--shadow-surface); --wb-shadow-md: var(--shadow-menu);
  }

  /* 表单控件全局圆角化：自动化等页面级表单不再是浏览器原生方框 */
  input:where(:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="color"]):not([type="file"])), select, textarea {
    border: 1px solid var(--wb-border); border-radius: var(--radius-lg); padding: 8px 12px; font-size: 14px;
    background: var(--wb-bg); color: var(--wb-text); outline: none; min-width: 0;
    transition: border-color .18s var(--wb-ease), box-shadow .18s var(--wb-ease), background .18s var(--wb-ease);
  }
  input:focus, select:focus, textarea:focus { border-color: var(--wb-brand-text); box-shadow: 0 0 0 3px var(--wb-brand-weak); }
  input[type="checkbox"], input[type="radio"] { accent-color: var(--wb-brand-text); }
  textarea { resize: vertical; }
  /* 两个特例保持嵌入式外观：聊天主输入框的边框在卡片上；顶部搜索框贴在栏里 */
  textarea#input, #chat-search input { border: none; border-radius: 0; padding: 0; background: transparent; box-shadow: none; }
  button { border-radius: var(--radius-lg); }
  /* 自动化页内联表单的宽度与间距 */
  #sf-name, #sf-cron, #sf-task { width: 100%; margin-bottom: 8px; }
  .form-row { margin-bottom: 8px; }

  /* 交互元素统一柔性过渡 */
  button, .side-nav .item, .chip, .pk, .card-item, .ex-card, .tpl-card, .proj-card, .feat-card, .out-card,
  .sk-pick label, .ava-pick, .link, a {
    transition: background-color .18s var(--wb-ease), border-color .18s var(--wb-ease), color .18s var(--wb-ease),
                box-shadow .18s var(--wb-ease), transform .18s var(--wb-ease), opacity .18s var(--wb-ease), filter .18s var(--wb-ease);
  }
  .btn-brand:hover { filter: brightness(1.06); box-shadow: 0 4px 14px rgba(91,95,247,.3); }
  .btn-brand:active { transform: scale(.96); }
  .btn-plain:hover { border-color: var(--wb-brand-text); color: var(--wb-brand-text); background: var(--wb-brand-weak); }
  .btn-plain:active, .chip:active, .side-nav .item:active { transform: scale(.96); }

  /* 卡片悬浮轻抬 + 柔影。
     以前只写了 :hover 的终点，没写怎么过去——鼠标一进一出是「啪」地跳两下，
     正是「不够顺」最直接的来源。补上过渡，并且把按下也做出来：
     抬起来的同时按下去要压回原位，不然按住不放时卡片是浮着的，手感上没有「被按到」。 */
  .ex-card, .tpl-card, .proj-card, .feat-card, .card-item, .out-card {
    transition: transform var(--wb-t) var(--wb-ease), box-shadow var(--wb-t) var(--wb-ease), border-color var(--wb-t-fast) var(--wb-ease);
  }
  .ex-card:hover, .tpl-card:hover, .proj-card:hover, .feat-card:hover, .card-item:hover { transform: translateY(-2px); box-shadow: var(--wb-shadow-md); }
  .ex-card:active, .tpl-card:active, .proj-card:active, .feat-card:active, .out-card:active { transform: translateY(0) scale(.985); }
  /* 剩下这几类可点的也补上按下反馈，免得界面里一半按钮有手感一半没有 */
  .scene-tabs button, .chips button, .ask-opt, .pv-head button, .pv-deploy button {
    transition: background-color var(--wb-t-fast) var(--wb-ease), border-color var(--wb-t-fast) var(--wb-ease), color var(--wb-t-fast) var(--wb-ease), transform var(--wb-t-fast) var(--wb-ease);
  }
  .scene-tabs button:active, .chips button:active, .ask-opt:active, .pv-head button:active, .pv-deploy button:active { transform: scale(.96); }
  .input-card:focus-within { border-color: var(--wb-brand-text); box-shadow: 0 8px 30px rgba(91,95,247,.13); }

  /* 入场动效：弹窗淡入上浮、页面淡入、消息上浮、toast 上滑 */
  .modal-mask.show { animation: wbFade .16s var(--wb-ease); }
  .modal-mask.show .modal { animation: wbPop .2s var(--wb-ease); }
  .assist-page { animation: wbFade .22s var(--wb-ease); }
  .turn { animation: wbRise .24s var(--wb-ease); }
  #wb-toast { transform: translateX(-50%) translateY(8px); transition: opacity var(--wb-t) var(--wb-ease), transform var(--wb-t-slow) var(--wb-ease-out); }
  #wb-toast.show { transform: translateX(-50%) translateY(0); }
  @keyframes wbFade { from { opacity: 0; } }
  @keyframes wbPop { from { opacity: 0; transform: translateY(12px) scale(.97); } }
  @keyframes wbRise { from { opacity: 0; transform: translateY(6px); } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }

  /* 滚到底之后别把滚动传给外层：文件面板、设置弹窗、聊天流都是独立的一块，
     在里面划到头还继续带动整页（或者在 macOS 上触发返回上一页的橡皮筋），是最出戏的一下。 */
  #chat-scroll, #history, #file-list, #pv-body, .m-body, .settings-nav, .settings-pane,
  .im-feed, .picker-menu.down, .lib-prev, .ex-card .sk-preview { overscroll-behavior: contain; }

  /* 助理模式聊天流：用户在右（品牌色），助理在左（浅底 + Markdown 排版） */
  .im-row .im-col { max-width: 76%; min-width: 0; }
  .im-row .im-col .im-b { max-width: none; }
  .im-row.usr { justify-content: flex-end; }
  .im-b.usr { background: var(--wb-brand); color: #fff; border-radius: var(--radius-2xl) var(--radius-2xl) var(--radius-xs) var(--radius-2xl); text-align: left; }
  .im-b.bot { background: var(--wb-bg-hover); border-radius: var(--radius-xs) var(--radius-2xl) var(--radius-2xl) var(--radius-2xl); white-space: normal; text-align: left; }
  .im-b.bot pre { white-space: pre-wrap; }
  /* Goal 目标卡：进行中的目标固定在聊天区顶部，验收标准逐条打勾 */
  #goal-card { max-width: var(--wb-content-w); margin: 10px auto 0; padding: 10px 14px; box-sizing: border-box; width: calc(100% - 40px); background: var(--wb-brand-weak); border: 1px solid var(--wb-border); border-radius: var(--radius-xl); font-size: 13px; }
  #goal-card .gc-head { display: flex; align-items: center; gap: 8px; }
  #goal-card .gc-title { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #goal-card .gc-meta { color: var(--wb-text-2); flex-shrink: 0; }
  #goal-card .gc-done { color: var(--wb-ok-text); font-weight: 600; }
  /* 评测里「每格一次尝试」的小方块：格子 17px、字号 10px，图标跟着 1em 会小到看不清 */
  .ev-try .i { width: 12px; height: 12px; }
  #goal-card .gc-close { border: none; background: none; cursor: pointer; color: var(--wb-text-3); font-size: 13px; padding: 2px 4px; }
  #goal-card .gc-close:hover { color: var(--wb-err-text); }
  #goal-card .gc-list { margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
  #goal-card .gc-item { color: var(--wb-text-2); }
  #goal-card .gc-item.ok { color: var(--wb-text); }
  /* 进度条：一排勾勾看不出「离终点还有多远」，这一根横条才是扫一眼就懂的那个信息 */
  #goal-card .gc-bar { height: 4px; margin: 8px 0 2px; border-radius: var(--radius-full); background: var(--wb-border); overflow: hidden; }
  #goal-card .gc-bar i { display: block; height: 100%; border-radius: var(--radius-full); background: var(--wb-brand); transition: width .3s var(--wb-ease, ease); }
  #goal-card.ok .gc-bar i { background: var(--success); }
  /* 拆解/验收这一步自己歪了，得说出来——不然用户对着不动的进度条以为是活没干好 */
  #goal-card .gc-note { margin-top: 8px; padding: 6px 8px; border-radius: var(--radius-md); background: color-mix(in srgb, var(--wb-warn) 12%, transparent); color: var(--wb-warn); font-size: 12px; line-height: 1.6; }
  /* 「停了」是个状态，不是沉默：写清为什么停，旁边给一颗能接着跑的按钮 */
  #goal-card .gc-paused { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--wb-border); color: var(--wb-text-2); font-size: 12px; }
  #goal-card .gc-paused span { flex: 1; min-width: 0; }
  #goal-card .gc-go { flex-shrink: 0; padding: 4px 12px; border: 1px solid var(--wb-brand); border-radius: var(--radius-md); background: var(--wb-brand); color: #fff; font-size: 12px; font-weight: 600; cursor: pointer; }
  #goal-card .gc-go:hover { filter: brightness(1.06); }

  /* ---------- 第45轮 UI 精修（增量，只加不改名） ---------- */
  /* 全局细滚动条：默认的粗滚动条在窄面板里很抢戏。
     原来这里有两套规则（上面一套无前缀的 + 这套带 * 的）在打架，后者赢；
     而后者的滑块是 --border（#e9ebf0）再被 2px 透明边裁到 4px 宽——压在白底上等于没画，
     长列表里根本看不出自己滚到哪了。改成半透明黑/白：一条规则在任何底色上都读得出来。 */
  * { scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) transparent; }
  *::-webkit-scrollbar { width: 11px; height: 11px; }
  *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: var(--radius-full); border: 3px solid transparent; background-clip: content-box; }
  *::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); border: 3px solid transparent; background-clip: content-box; }
  *::-webkit-scrollbar-corner { background: transparent; }

  /* 表单控件统一：焦点环、勾选框主题色、下拉框和输入框一个观感 */
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--wb-brand-text); box-shadow: 0 0 0 3px rgba(91,95,247,.12); }
  input, textarea, select { transition: border-color .15s var(--wb-ease), box-shadow .15s var(--wb-ease); }
  /* 选中高亮：原来 22% 的淡紫在白底上几乎看不出来，拖选完根本不知道选中了没有。
     加到一眼可辨的浓度并显式定文字色，深色代码块里选中也不会糊成一团 */
  ::selection { background: rgba(91,95,247,.72); color: #fff; }
  html[data-theme="dark"] ::selection { background: rgba(139,143,255,.62); color: #fff; }
  /* 自己发出去的消息气泡本身就是品牌紫（.u-msg .bubble / .im-b.usr），在紫底上再涂一层紫
     等于没涂——用户反馈「已经发出去的消息里选中看不出变化」。这两处反过来用白底紫字 */
  .u-msg .bubble::selection, .u-msg .bubble ::selection,
  .im-b.usr::selection, .im-b.usr ::selection { background: #fff; color: var(--wb-brand-on-white); }

  /* 设置导航：选中项加一根短侧条，扫一眼就知道在哪一页 */
  .settings-nav .cat { position: relative; }
  .settings-nav .cat.active::before { content: ""; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 16px; border-radius: var(--radius-full); background: var(--wb-brand); }

  /* 设置卡片：标题和正文拉开一点层次；静态信息卡不需要跟着悬浮乱跳 */
  .settings-pane .card-item:hover { transform: none; box-shadow: none; border-color: var(--wb-text-3); }
  .settings-pane .card-item .t { font-size: 15px; }
  .settings-pane .card-item .d { font-size: 13px; }

  /* 助理设置：分区 + 双栏通道卡。卡头一行 = 图标 · 名字 · 一句副标题 · 状态灯 · 右上角「连接 / 取消连接」；
     **所有卡默认收起**，点卡头或点「连接」才展开。之前是「连上的收起、没连的摊开等你填」，
     结果一进来就有四五张你根本没打算连的渠道的空表单摊在屏幕上。用户原话：
     「默认都收起来啊，当用户需要连接点击的时候才展开」。申请步骤折进「怎么拿凭证」。 */
  .im-sec { margin-bottom: 8px; }
  .im-sec-h { display: flex; align-items: baseline; gap: 8px; margin: 0 0 8px; flex-wrap: wrap; }
  .im-sec-h b { font-size: 14px; font-weight: 600; }
  .im-sec-h span { font-size: 12px; color: var(--wb-text-3); }
  /* 双栏用多列流而不是 grid：grid 一行两卡等高，收起的短卡旁边会留一大块空白；多列流让短卡自己往上挤 */
  .im-grid { columns: 2; column-gap: 12px; }
  @media (max-width: 860px) { .im-grid { columns: 1; } }
  .im-card { border: 1px solid var(--wb-border); border-radius: var(--radius-xl); background: var(--wb-card); min-width: 0; break-inside: avoid; margin-bottom: 12px; }
  .im-card.on { border-color: color-mix(in srgb, var(--wb-ok) 40%, var(--wb-border)); }
  .im-card-h { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; user-select: none; border-radius: var(--radius-xl); }
  /* 折叠箭头：没有它，一屏全是收起的卡，看不出哪些是能点开的 */
  .im-ar { flex: none; width: 14px; height: 14px; border-right: 1.5px solid var(--wb-text-3); border-bottom: 1.5px solid var(--wb-text-3); transform: rotate(-45deg) translate(-2px, -2px); transition: transform var(--wb-t-fast) var(--wb-ease); }
  .im-card.packed .im-ar { transform: rotate(45deg) translate(-1px, -1px); }
  .im-card-h:focus-visible { outline: 2px solid var(--wb-brand); outline-offset: -2px; }
  .im-card-h .ic { font-size: 16px; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: var(--radius-md); background: var(--wb-bg-hover); flex: none; }
  .im-card-h .tt { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 1px; }
  .im-card-h .tt b { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .im-card-h .tt span { font-size: 12px; color: var(--wb-text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .im-st { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--wb-text-3); flex: none; white-space: nowrap; }
  .im-st .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--wb-text-3); flex: none; }
  .im-st em { font-style: normal; }
  .im-st.ok { color: var(--wb-ok-text); } .im-st.ok .dot { background: var(--wb-ok); }
  .im-st.warn { color: var(--wb-warn); } .im-st.warn .dot { background: var(--wb-warn); }
  .im-st.err { color: var(--wb-err-text); } .im-st.err .dot { background: var(--wb-err); }
  .im-conn { flex: none; height: 28px; padding: 0 10px; font-size: 12px; margin: 0; }
  .im-conn.danger { border-color: var(--wb-err); color: var(--wb-err-text); }
  .im-card-b { padding: 10px 12px 12px; border-top: 1px solid var(--wb-border); }
  .im-card.packed .im-card-b { display: none; }
  .im-card-b input { display: block; width: 100%; margin-bottom: 6px; font-size: 13px; padding: 7px 10px; }
  .im-card-b .im-r { font-size: 12px; margin-top: 2px; line-height: 1.5; word-break: break-all; }
  .im-card-b .im-r:empty { display: none; }
  .im-card-b .im-act { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .im-newapp { margin: 0 0 10px; padding: 8px 10px; border: 1px dashed var(--wb-border); border-radius: var(--radius-md); }
  .im-newapp .d { display: inline; }
  .im-newapp img { display: block; }
  .im-src { margin: 2px 0 6px; }
  .im-src .get-key { margin-left: 0; }
  .key-src-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-bottom: 6px; font-size: 12px; }
  .im-help { margin-top: 6px; font-size: 12px; color: var(--wb-text-2); }
  .im-help summary { cursor: pointer; color: var(--wb-brand-text); list-style: none; }
  .im-help summary::-webkit-details-marker { display: none; }
  .im-help summary::before { margin-right: 4px; }
  .im-help[open] summary::before { transform: rotate(90deg); }
  .im-help ol { margin: 6px 0 0; padding-left: 18px; line-height: 1.6; }

  /* 底层引擎选择：一行一个引擎，选中的那条描边+底色，没装的压暗但仍然看得见装法 */
  .eng-list { display: flex; flex-direction: column; gap: 8px; }
  .eng { border: 1px solid var(--wb-border); border-radius: var(--radius-lg); padding: 10px 12px; cursor: pointer; transition: border-color var(--wb-t-fast) var(--wb-ease), background var(--wb-t-fast) var(--wb-ease); }
  .eng:hover { border-color: var(--wb-text-3); }
  .eng.on { border-color: var(--wb-brand); background: color-mix(in srgb, var(--wb-brand) 7%, transparent); }
  .eng.off { opacity: .62; }
  .eng-h { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 14px; }
  .eng-dot { color: var(--wb-brand-text); }
  .eng-n { color: var(--wb-text-2); font-size: 12.5px; line-height: 1.6; margin-top: 3px; }
  .eng-c { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--wb-text-3); margin-top: 4px; }
  .eng-i { font-size: 12px; color: var(--wb-text-2); margin-top: 5px; }
  .eng-i code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--wb-bg-hover); padding: 1px 5px; border-radius: var(--radius-xs); }
  .eng-b { font-size: 11px; padding: 1px 7px; border-radius: var(--radius-full); border: 1px solid var(--wb-border); color: var(--wb-text-2); }
  .eng-b.ok { border-color: color-mix(in srgb, var(--wb-ok) 34%, transparent); color: var(--wb-ok-text); }
  .eng-b.free { border-color: var(--wb-brand); color: var(--wb-brand-text); }
  .eng-b.no { border-color: var(--wb-border); color: var(--wb-text-3); }
  .eng-msg { font-size: 12.5px; color: var(--wb-text-2); min-height: 16px; }
  /* 展开区：只有选中的那条才展开，装法/路径/模型/连接测试都在里面，不选的时候别糊一屏 */
  .eng-x { margin-top: 9px; padding-top: 9px; border-top: 1px dashed var(--wb-border); display: grid; gap: 7px; }
  .eng-x label { font-size: 12px; color: var(--wb-text-2); display: grid; gap: 3px; }
  .eng-x input, .eng-x select { height: 30px; font-size: 12.5px; }
  .eng-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .eng-r { font-size: 12.5px; line-height: 1.6; padding: 7px 9px; border-radius: var(--radius-md); border: 1px solid var(--wb-border); background: var(--wb-bg-hover); }
  .eng-r.ok { border-color: color-mix(in srgb, var(--wb-ok) 34%, transparent); color: var(--wb-ok-text); background: color-mix(in srgb, var(--wb-ok) 6%, transparent); }
  .eng-r.bad { border-color: color-mix(in srgb, var(--wb-err) 34%, transparent); color: var(--wb-err-text); background: color-mix(in srgb, var(--wb-err) 6%, transparent); }
  .eng-r code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .eng-p { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--wb-text-3); word-break: break-all; }

  /* 链接 hover 给个反馈 */
  .link:hover { text-decoration: underline; }

  /* 用户气泡加一点纵深，别糊在背景上 */
  .u-msg .bubble { box-shadow: 0 2px 8px rgba(91,95,247,.18); }

  /* ================= shadcn 桥接层：老类名接到 ui.css 的几何上 =================
     这段必须排在 style 标签（最内联尾部）之后——ui.css 是外链，先于内联样式，压不住上面那些旧写法。
     只统一「尺寸节奏」（高度/圆角/字号/图标 16px/focus 3px 光圈），颜色仍走 --wb-*，
     所以八百行既有样式一行都不用动，视觉上却终于对齐了。 */
  .btn-brand, .btn-plain {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border-radius: var(--radius-md); line-height: 1; white-space: nowrap;
  }
  .btn-brand { height: 36px; padding: 0 16px; font-size: 14px; font-weight: 500; }
  .btn-plain { height: 32px; padding: 0 12px; font-size: 13px; }
  .btn-brand:focus-visible, .btn-plain:focus-visible, .chip:focus-visible, .icon-btn:focus-visible,
  .picker-btn:focus-visible, .ui-btn:focus-visible {
    outline: none; border-color: var(--ring); box-shadow: 0 0 0 3px var(--ring-weak);
  }
  .icon-btn { border-radius: var(--radius-md); }
  .chip { border-radius: var(--radius-full); }

  /* 图标尺寸：跟 shadcn 一样，按钮里的图标一律 16，密集处 14 */
  /* 尺寸不在这儿定：ui.css 里 .i 是 1em，图标自动跟着它所在那行的字号走。
     真要改大小就去改那处的 font-size，或者像下面几条一样按元素单独钉死，
     别在这儿写全局像素值——那会把所有地方一起拽平。 */
  .i { color: inherit; }
  /* 伪元素里塞不进 sprite（<use> 只认真元素），所以这两处折叠箭头用 mask 把 lucide 的
     chevron-right 刷上去：颜色照旧跟 currentColor 走，rotate 也还能转。
     以前是直接写 content:"›" —— 那是个标点，字重、基线、粗细全归字体管，
     跟旁边 sprite 画出来的图标怎么调都对不齐。 */
  .src-hd::before, .im-help summary::before {
    content: ""; display: inline-block; width: 1em; height: 1em; vertical-align: -.14em;
    background: currentColor; transition: transform var(--wb-t-fast) var(--wb-ease);
    -webkit-mask: var(--wb-chev-mask) center / contain no-repeat;
    mask: var(--wb-chev-mask) center / contain no-repeat;
  }
  /* 行内链接/卡片脚注里的图标：不改行盒（.link 有嵌在正文段落里的，改 inline-flex 就没法跟着换行了），
     只留一点左右气口，大小和基线都交给 ui.css 的 1em / -.145em */
  .link .i:first-child, .ex-card.add .i { margin-right: 3px; }
  .link .i:last-child, .sk-own .i, .feat-card .go .i { margin-left: 2px; }
  .tpl-card .chev .i, .proc-head .arrow .i, .side-nav .more-toggle .caret .i { width: 14px; height: 14px; display: block; }
  button .i, .picker-btn .i, .link .i, .mi .i, a.icon-btn .i { width: 16px; height: 16px; }
  .side-nav .item .ic .i { width: 17px; height: 17px; }
  .side-nav .item .ic { display: inline-flex; align-items: center; justify-content: center; width: 18px; flex: none; }
  .picker-btn .i:last-child { width: 13px; height: 13px; opacity: .6; }   /* 尾巴上的 ▾ */
  #new-task .i, #toggle-files .i, #interject-btn .i { width: 15px; height: 15px; }

  /* 换成 svg 后需要重新居中的几个：原来靠字符自身撑，现在要 flex */
  #toggle-files, #interject-btn.show, .files-panel h2 > span:first-child {
    display: inline-flex; align-items: center; gap: 6px;
  }
  #to-bottom.show { display: flex; align-items: center; justify-content: center; }
  #send .i { width: 17px; height: 17px; }
  #gear-btn { display: flex; align-items: center; justify-content: center; }
  .pv-head button, .pv-head a.icon-btn { display: flex; align-items: center; justify-content: center; width: 30px; height: 30px; padding: 0; flex: none; }

  /* 产出 chip 上的三个图标钮：预览 / 打开所在位置 / 下载。没字，全靠 title；文字留给读屏 */
  .out-acts .oa-main, .out-acts .oa-ico {
    display: inline-flex; align-items: center; justify-content: center; gap: 4px;
    width: 26px; height: 26px; padding: 0; border: none; border-radius: var(--radius-sm);
    background: transparent; color: var(--wb-text-3); font-size: 12px; cursor: pointer; text-decoration: none;
  }
  .out-acts .oa-main .tx { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* 一张图两种格式（gen_diagram 一次落 svg+png）时，两个下载键都写清格式，别让用户猜点哪个 */
  .out-acts .oa-fmt { width: auto; padding: 0 6px; font-weight: 500; }
  .out-acts .oa-main:hover, .out-acts .oa-ico:hover { color: var(--wb-brand-text); background: var(--wb-bg); }
  .out-acts .i { width: 14px; height: 14px; }

  /* 回复底部操作条 + 提问卡角标：换成 svg 后要靠 flex 居中 */
  .ta-btn { display: inline-flex; align-items: center; gap: 5px; height: 26px; }
  .ta-btn .i { width: 15px; height: 15px; }
  .ask-hd .ask-ic { display: inline-flex; align-items: center; }
  .ask-hd .ask-ic .i { width: 14px; height: 14px; }

  /* 过程区里的「说一句」提示行：图标顶格对齐第一行文字，文字自己换行不跟图标挤 */
  .proc-note { display: flex; align-items: flex-start; gap: 6px; font-size: 13px; color: var(--wb-text-3); margin: 6px 0; }
  .proc-note .i { width: 14px; height: 14px; margin-top: 2px; }
  .proc-note.err { color: var(--wb-err-text); }
  /* 折叠条上那行「此刻在干什么」：一行到底，长了省略号，图标不跟着缩 */
  .act-live { display: inline-flex; align-items: center; gap: 5px; min-width: 0; }
  .act-live .al-t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* toast：图标和字基线对齐，报错时图标单独上色（整句飘红会太吵） */
  #wb-toast { display: flex; align-items: center; gap: 7px; }
  #wb-toast .i { width: 15px; height: 15px; }
  #wb-toast.err .i { color: #ff8f8f; }
  /* 空态的场景 tab / 胶囊、@ 菜单、里程碑、计划卡：原先靠字符撑位，换 svg 后要 flex */
  .scene-tabs button, .chips button, .mi, .ms-head, .ms-item, .pl-head, .dir-head, .time-head {
    display: inline-flex; align-items: center; gap: 6px;
  }
  .mi, .ms-item, .dir-head, .time-head, .ms-head, .pl-head { display: flex; }
  .mi .sub { margin-left: auto; }
  .dir-head .ar .i, .time-head .ar .i, .out-hd .ar .i { width: 13px; height: 13px; }
  .ms-item .i { width: 14px; height: 14px; flex: none; }
  .ms-item.done .i { color: var(--wb-ok-text, var(--wb-brand-text)); }

  /* .m-body / .ex-editor / .onb-row-b / .im-card-b 里那几条 input{width:100%} 本来是写给文本框的，
     勾选框被一起扫进去：账号弹窗里「开启积分限额」那个框实测 850×13，还套着边框和 8px 内边距。
     这里把勾选框/单选框整个拽出那套盒模型——固定 16 见方，只留标签那段可点文字。
     这条排在所有 .m-body input 之后，同特异度靠后来居上生效，所以它必须待在这段内联样式的最后。 */
  input[type="checkbox"], input[type="radio"] {
    display: inline-block; flex: none; width: 16px; height: 16px; padding: 0; margin-block: 0;
    border: none; background: none; border-radius: 0; box-shadow: none;
    accent-color: var(--wb-brand-text); cursor: pointer; }
</style>
</head>
