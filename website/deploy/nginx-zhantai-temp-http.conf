server {
    listen 80;
    server_name openworkbuddy.zhantaiyingxiao.cn;
    root /var/www/openworkbuddy-zhantai/current;
    index index.html;
    charset utf-8;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location = /indexnow.json { return 404; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }
}
