server {
    listen 80;
    server_name openworkbuddy.zhantaiyingxiao.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://openworkbuddy.zhantaiyingxiao.cn$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name openworkbuddy.zhantaiyingxiao.cn;
    ssl_certificate /etc/letsencrypt/live/openworkbuddy.zhantaiyingxiao.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/openworkbuddy.zhantaiyingxiao.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:OWBTEMPSSL:2m;
    ssl_session_timeout 1d;
    root /var/www/openworkbuddy-zhantai/current;
    index index.html;
    charset utf-8;
    access_log /var/log/nginx/openworkbuddy-zhantai.access.log main;
    error_log /var/log/nginx/openworkbuddy-zhantai.error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;
    location ~ /\. { deny all; }
    location = /indexnow.json { return 404; }
    location = /login { return 301 https://openworkbuddy.zhantaiyingxiao.cn/; }
    location = /login/ { return 301 https://openworkbuddy.zhantaiyingxiao.cn/; }
    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
