server {
    listen 80;
    listen [::]:80;
    server_name openworkbuddy.work www.openworkbuddy.work;
    root /var/www/openworkbuddy/current;
    index index.html;
    charset utf-8;
    access_log /var/log/nginx/openworkbuddy.access.log main;
    error_log /var/log/nginx/openworkbuddy.error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }
    location ~ /\. { deny all; }
    location = /indexnow.json { return 404; }
    location /assets/ {
        expires 7d;
        try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
    location = /404.html { internal; }
}
