# 临时取证用：侧栏那组 CSS 断言只在 runner 上挂，本机怎么都复现不出来。
# 手动触发，只开一个窗口把「哪几条规则进了样式表」打出来，验完就删。
name: 侧栏取证（临时）
on: { workflow_dispatch: {} }
jobs:
  sb:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
      - run: echo "" | base64 -d > "$RUNNER_TEMP/sbdiag.js"
      - run: WB_ROOT="$PWD" npx electron "$RUNNER_TEMP/sbdiag.js" 2>&1 | grep -v "^\[" || true
