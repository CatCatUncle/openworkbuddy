# PR 和 main 的红绿灯。发版流水线是另一个文件（release.yml），这条只管「代码有没有坏」。
#
# 在这条之前，16 个测试套件只在作者本机手敲 npm test 时才跑：一个把 require 图改坏、
# 把依赖漏声明的 commit 可以一路走到 tag，外部 PR 也完全无人把关。
#
# 为什么分两条腿而不是一条 ubuntu 跑全套：e2e 会真拉起 electron 开 BrowserWindow
# （test/frontend.js、test/admin-ui.js），还要验 .app 的装机态，Linux runner 上没有屏幕、
# 也没有 .app 这个概念。与其套 xvfb 赌它能过，不如让 macOS 跑全套、ubuntu 跑不需要屏幕的那批——
# ubuntu 那条几十秒就回来，坏得早、报得快。
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false # 一条腿红了，另一条也要把结论跑出来
      matrix:
        include:
          - os: ubuntu-latest
            label: 快跑（15 个套件，不含 e2e）
            cmd: node test/all.js --only icons,lanes,md-tty,doctor,cli-args,cli-attach,cli-live,repl-commands,prefs,chat-models,media-models,tenant,deploy,trace,term-image,office-tools
          - os: macos-latest
            label: 全套（含 e2e）
            cmd: npm test
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 测试用的是模拟 LLM，不需要任何 API Key（CONTRIBUTING.md 里写了）
      - run: ${{ matrix.cmd }}
