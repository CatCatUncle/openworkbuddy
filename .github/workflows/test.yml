# PR 和 main 的红绿灯。发版流水线是另一个文件（release.yml），这条只管「代码有没有坏」。
#
# 在这条之前，16 个测试套件只在作者本机手敲 npm test 时才跑：一个把 require 图改坏、
# 把依赖漏声明的 commit 可以一路走到 tag，外部 PR 也完全无人把关。
#
# 为什么分两条腿而不是一条 ubuntu 跑全套：e2e 会真拉起 electron 开 BrowserWindow
# （test/frontend.js、test/admin-ui.js），还要验 .app 的装机态，Linux runner 上没有屏幕、
# 也没有 .app 这个概念。与其套 xvfb 赌它能过，不如让 macOS 跑全套、ubuntu 跑不需要屏幕的那批——
# ubuntu 那条几十秒就回来，坏得早、报得快。
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false # 一条腿红了，另一条也要把结论跑出来
      matrix:
        include:
          - os: ubuntu-latest
            label: 快跑（除 e2e 外全跑）
            cmd: node test/all.js --only repo-hygiene,icons,lanes,md-tty,doctor,cli-args,cli-attach,cli-live,cli-ask,cli-approve,repl-commands,session-search,systemone,prefs,chat-models,media-models,gen-cache,sweep,quota,relay,totp,auth-2fa,skill-guard,toolward,tenant,lifecycle,ops,deploy,trace,term-image,office-tools,remote
          - os: macos-latest
            label: 全套（含 e2e）
            cmd: npm test
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # 兜底的保险丝。GitHub 默认给 6 小时，2026-09-13 那次就是这么烧掉的：
    # e2e 里一个 electron 子进程不回话，五个 job 一起挂着，谁也拿不到结论。
    # 测试本身本机 137 秒、CI 上几分钟；40 分钟还没完就是卡了，早点红早点查。
    timeout-minutes: 40
    steps:
      # 要完整的 git log。README「最新动态」那道闸门拿 git log 当底本核对日期，
      # actions/checkout 默认 fetch-depth: 1 只克一个 commit，CI 上就只剩 HEAD 那一天，
      # 每条动态都会被判成「git 里那天没有提交」——2026-09-13 真这么红过一次，
      # 报错指向 README，实际错在这一行。releasePipelineDrift 里钉死了这个值。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 测试用的是模拟 LLM，不需要任何 API Key（CONTRIBUTING.md 里写了）
      - run: ${{ matrix.cmd }}
