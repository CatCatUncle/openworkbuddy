# 打 tag 就出安装包。用法：**先把 package.json 的 version 改成同一个号**，
# 再 git tag v0.1.1 && git push origin v0.1.1。完整清单在 docs/发版.md。
#
# 为什么 Windows 包必须在 CI 上打：开发机是 Mac，没装 wine，electron-builder 造不出 NSIS 安装器。
# Windows 产物由 runner 构建，并通过静默安装、启动和页面加载检查后上传。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: # 也允许手动点一次，用来验证流水线本身通不通

permissions:
  actions: read # 只复用同一提交的已通过主分支 CI
  contents: write # 创建 Release 要写权限

jobs:
  # 先核对同一提交的主分支 CI；没有可信的新鲜记录才重跑全套测试。
  # 测试放 macOS 单独一个 job，不塞进下面 build 的两条腿里：
  # e2e 里有 execFileSync("/bin/sh", ...) 和 .app 装机态验证，Windows runner 上过不了，
  # 硬塞进 matrix 会把 Windows 那份包直接打没——而那份恰恰是开发机造不出来、最需要发的。
  test:
    runs-on: macos-15-intel # 标准 Intel 机器，避开 ARM64 运行机器容量不足；完整测试仍保留
    timeout-minutes: 50 # 全集预算同 test.yml；单套件仍有独立看门狗，卡住不会一直等
    steps:
      # 要完整 git log 的理由同 test.yml：npm test 里有一道闸门拿 git log 核对 README 的日期
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - id: ci
        name: 查找同一提交的已通过主分支 CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verified="$(node scripts/release-ci.js)"
          if [ -n "$verified" ]; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
            echo "Reusing successful main CI #$verified for $GITHUB_SHA"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
        if: steps.ci.outputs.passed != 'true'
      # 产物名来自 package.json 的 ${version}，流水线认的却是 tag。两边不一致 =
      # Release v0.1.7 里挂着 0.1.6 的包；更糟的是 src/server/updater.js 的 currentVersion() 读的也是
      # package.json，装完的用户「设置 → 关于 → 检查更新」会永远显示有新版，点过去下的还是同一个包。
      # 加 if 是为了不误杀第 11 行那条手动通道：workflow_dispatch 时 GITHUB_REF_NAME 是分支名 main，
      # 'main'.replace(/^v/,'') 仍然非空，不守卫的话手动跑一次流水线必红。
      - name: 核对 package.json 版本号和 tag 一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash # matrix 外也显式写死：Windows 上默认 pwsh，引号规则不一样
        run: |
          node -e "const v=require('./package.json').version,t=process.env.GITHUB_REF_NAME.replace(/^v/,'');if(v!==t){console.error('对不上：package.json 是 '+v+'，tag 是 '+t+'。先改 package.json 再重打 tag。');process.exit(1)}"
      - run: npm test
        if: steps.ci.outputs.passed != 'true'

  build:
    needs: test
    strategy:
      fail-fast: false # 一个平台挂了，另一个平台照样打包上传（能不能进 Release 看 release job 的 if）
      matrix:
        include:
          - os: macos-15-intel # 同时打 arm64 / x64 安装包，与测试使用同一系统版本
            script: dist:mac
            artifact: mac
          - os: windows-latest
            script: dist:win
            artifact: win
    runs-on: ${{ matrix.os }}
    steps:
      # 大版本跟 test.yml 同一套口径：只抬到跑 Node 24 的那一档（node20 已被判弃用）
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Windows 包里要带系统沙箱的小助手（native/owb-sandbox，Go 写的），产物不进 git，这里现编。
      # 漏了这两步 electron-builder 的 afterPack 当场红，不会发出一个设置页有开关、底下却没沙箱的包
      - if: runner.os == 'Windows'
        uses: actions/setup-go@v6
        with:
          go-version-file: native/owb-sandbox/go.mod
          cache: false # 只用标准库，没有 go.sum 可当缓存键
      - if: runner.os == 'Windows'
        run: npm run build:sandbox
      # 不签名、不公证：没有 Apple Developer ID 证书。用户首次打开要手动放行，README 里写了。
      # 显式写死这个变量，免得哪天 runner 的钥匙串里有了证书就被自动捡去签
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      # 作者只有 Mac，Windows 包以前打完就上传，没在 Windows 上真启动过一次。
      # 这里静默装上、打开、等页面加载完；起不来这条腿就红，坏包进不了 Release（mac 那条照发）
      - if: runner.os == 'Windows'
        run: node scripts/win-smoke.js dist
      # 资料库的 PDF / Office 封面在 Windows 上靠系统自带的 Windows.Data.Pdf 画（win-thumb.js），
      # 单测里的 PowerShell 是假的：真调得通调不通只有这台机器知道
      - if: runner.os == 'Windows'
        run: node scripts/win-thumb-check.js
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    # 带 needs 的 job 默认门槛是 success()，只有 if 里出现状态函数才会被顶掉。
    # 不写 !cancelled() 的话：Windows 那条腿一红，已经打好的 mac dmg/zip 就只能躺在
    # Actions 运行页的 artifact 里等 90 天过期，用户侧看到的是「推了 tag 却没有新版本可下」。
    # startsWith 这一半不能省，否则手动 workflow_dispatch 也会去建 Release。
    # != 'skipped' 是拦测试没过的情况——那时 build 整个被跳过，不该建一个空 Release。
    if: ${{ !cancelled() && needs.build.result != 'skipped' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-24.04
    steps:
      # 不写 name，一次把两条腿的产物都拉下来摊成 dist/mac、dist/win——
      # 下面 files: dist/**/* 正是按这个形状 glob 的，换大版本时先确认这个行为没变
      # 要 git 历史：正文最上面那段「这一版改了什么」是拿上一个 tag 到这个 tag
      # README 里**新增的**那几行凑的（scripts/release-notes.js）。浅克隆下取不到上一个 tag，
      # 脚本会一个字都不写——Release 页于是退回只有安装指南，跟以前一样，不会印错东西
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous="$(gh release list --repo "${GITHUB_REPOSITORY}" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')"
          md="$(node scripts/release-notes.js "${GITHUB_REF_NAME}" "$previous")"
          [ -n "$md" ] || echo "::warning::README「最新动态」这一版没有新条目，Release 页不会有「这一版改了什么」"
          {
            echo 'md<<OWB_NOTES_EOF'
            printf '%s\n' "$md"
            echo OWB_NOTES_EOF
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v7
        # 两条腿全挂时这一步会报 "Unable to find any artifacts"。download-artifact 没有
        # 「允许缺失」这种输入项，只能靠 continue-on-error 兜，别让它把整个 release 拖红
        continue-on-error: true
        with: { path: dist }
      - name: Generate installer checksums
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          assets = sorted(p for p in Path("dist").rglob("*") if p.is_file() and p.suffix in {".dmg", ".zip", ".exe"})
          if assets:
              names = [p.name for p in assets]
              if len(names) != len(set(names)):
                  raise SystemExit("Duplicate installer names")
              rows = []
              for p in assets:
                  digest = hashlib.sha256()
                  with p.open("rb") as stream:
                      for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                          digest.update(chunk)
                  rows.append(f"{digest.hexdigest()}  {p.name}")
              Path("dist/SHA256SUMS.txt").write_text("\n".join(rows) + "\n")
          PY
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          # 缺了平台就落草稿由人拍板：下面那段正文写死了 Windows 的文件名，
          # 缺 Windows 还照发，等于给用户指了几个不存在的下载链接
          draft: ${{ needs.build.result != 'success' }}
          files: dist/**/*
          generate_release_notes: true
          body: |
            ${{ steps.notes.outputs.md }}
            ## 安装 / Install

            | 系统 / Platform | 下载文件 / Asset |
            |---|---|
            | macOS · Apple Silicon | `OpenWorkBuddy-*-mac-arm64.dmg` |
            | macOS · Intel | `OpenWorkBuddy-*-mac-x64.dmg` |
            | Windows · x64 / ARM64 | `OpenWorkBuddy-*-win-setup.exe` |
            | Windows · portable | `OpenWorkBuddy-*-win-x64-portable.exe` / `OpenWorkBuddy-*-win-arm64-portable.exe` |

            **Windows 推荐安装版**：按机器自动选架构。免安装版每次启动都要解压，首次打开可能较慢，请勿重复双击。
            **On Windows, use the setup installer** unless you need a portable copy. Portable builds extract on every launch and may take longer to open.

            `SHA256SUMS.txt` 提供各安装包的 SHA-256 校验值，可核对下载内容是否一致。
            Compare your download's SHA-256 hash with `SHA256SUMS.txt` to check file integrity.

            ### 第一次打开 / First launch

            当前 macOS 包使用 ad-hoc 签名，未经过 Apple 公证；Windows 包未使用代码签名证书。
            请从本仓库 Releases 下载，并在确认来源后决定是否继续安装。
            macOS builds use ad-hoc signing without Apple notarization. Windows builds are not code signed. Verify the download source before proceeding.

            - **macOS「无法验证」**：先将应用拖到「应用程序」。关闭提示，进入 **系统设置 → 隐私与安全性 → 仍要打开**，按系统要求确认。
              **macOS “cannot be verified”**: move the app to Applications, dismiss the prompt, then use **System Settings → Privacy & Security → Open Anyway**.
              [Apple 操作说明 / Apple instructions](https://support.apple.com/guide/mac-help/open-a-mac-app-from-an-unknown-developer-mh40616/mac).

              <p><img src="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docs/images/macos-open-anyway.png" width="860" alt="macOS 系统设置 → 隐私与安全性 → 仍要打开 OpenWorkBuddy / macOS System Settings → Privacy &amp; Security → Open Anyway"></p>

              如图，在 **系统设置 → 隐私与安全性** 的「安全性」区域找到 OpenWorkBuddy，点击 **「仍要打开」**，再按系统提示确认。此入口通常在尝试打开应用并被拦截后出现。
              In **System Settings → Privacy & Security**, find OpenWorkBuddy under Security, click **Open Anyway**, then confirm when prompted. This option usually appears after an attempt to open the app is blocked.
            - **macOS「已损坏」**：重新下载；仍有问题时检查签名及启动日志，见下方安装指南。这个提示不能只按「无法验证」处理。
              **macOS “is damaged”**: download a fresh copy, then check the signature and startup log using the installation guide if needed.
            - **Windows SmartScreen**：核对来源后选择 **更多信息 → 仍要运行**。组织设备还可能受管理员策略限制。
              After checking the source, use **More info → Run anyway**. Managed devices may have additional restrictions.

            装完后注册账号，在「设置 → 模型」配置可用的模型，再完成 [第一份项目汇报 PPT](https://github.com/CatCatUncle/openworkbuddy#quick-start)。模型服务可能收费；不附带 API Key。
            After registering, connect a model in Settings → Models and complete the [first project update deck](https://github.com/CatCatUncle/openworkbuddy/blob/main/README.en.md#quick-start). Model providers may charge for usage; no API key is included.

            ### 排查与升级 / Troubleshooting and upgrades

            - **双击无反应 / No window**：查看 `~/OpenWorkBuddy/logs/boot.log`（Windows：`%USERPROFILE%\OpenWorkBuddy\logs\boot.log`）。分享日志前请删去个人路径、账号和凭据。
            - **黑屏 / Blank window**：在数据目录的 `config.json` 中，将 `server.disable_gpu` 设为 `true`，然后重启。
            - **数据目录 / Data directory**：默认 `~/OpenWorkBuddy`，可用 `OPENWORKBUDDY_HOME` 更改。卸载应用不会删除此目录。
            - **升级 / Upgrade**：先备份数据目录并关闭应用。安装包用户下载同架构的新包覆盖安装，免安装版换成新文件。源码用户先检查 `git status`；只有工作区干净且分支可快进时，执行 `git pull --ff-only`、`npm ci` 后重启。有本地改动或分叉时保留原目录，按安装指南处理。
              Back up the data directory and close the app. Replace the installed or portable build with the new package for your architecture. Source users: check `git status` first; only run `git pull --ff-only` and `npm ci` in a clean working tree whose branch can fast-forward. Preserve a modified or diverged checkout and follow the installation guide.

            [中文安装与启动](https://github.com/CatCatUncle/openworkbuddy/blob/main/docs/%E5%AE%89%E8%A3%85%E4%B8%8E%E5%90%AF%E5%8A%A8.md) · [English user guide](https://catcatuncle.github.io/openworkbuddy/guides/user.html) · [中文用户指南](https://catcatuncle.github.io/openworkbuddy/zh/guides/user.html) · [开发者 / Developer guide](https://catcatuncle.github.io/openworkbuddy/guides/developer.html)

            有用的话欢迎 [Star 收藏](https://github.com/CatCatUncle/openworkbuddy/stargazers)，通过 **Watch → Custom → Releases** 接收新版本通知。
            Star the repository if it helps you, or enable **Watch → Custom → Releases** for release notifications.
